/* ------------------------------- level up ------------------------------ */
function drawLevelUp(){
  G.cardT = (G.cardT||0) + 0.016;
  var a = clamp(G.cardT*5,0,1);
  ctx.fillStyle='rgba(3,5,14,'+(0.82*a)+')';
  ctx.fillRect(0,0,VW,VH);

  var hi = RARITY[G.bestRarity||0];
  text('LEVEL '+G.level, VW/2, 92, 17, (G.bestRarity>=EPIC)?hi.col:C.scrap, 'center', 800, a, 6);
  text('CHOOSE AN UPGRADE', VW/2, 132, 34, C.text, 'center', 900, a, 5);

  for(var i=0;i<G.cards.length;i++){
    var r = cardRect(i), u = G.cards[i];
    var hov = IN.has && inRect(IN.x,IN.y,r);
    var lift = hov?8:0;
    var ca = clamp((G.cardT-i*0.06)*6,0,1);
    var top = r.y-lift;
    ctx.globalAlpha = ca;

    var rar = RARITY[u.r];

    // Epics carry a soft outer bloom so the good card reads across the room.
    if(u.r >= EPIC){
      var puls = 0.5 + 0.5*Math.sin(G.uiT*2.6 + i);
      ctx.globalAlpha = ca*(0.10 + 0.12*puls);
      ctx.strokeStyle = rar.col; ctx.lineWidth = 12;
      roundRect(r.x-3, top-3, r.w+6, r.h+6, 21); ctx.stroke();
      ctx.globalAlpha = ca;
    }

    ctx.fillStyle = hov ? hexA(rar.col,0.15) : 'rgba(255,255,255,0.042)';
    roundRect(r.x, top, r.w, r.h, 18); ctx.fill();
    ctx.strokeStyle = hov ? rar.col : hexA(rar.col, u.r?0.55:0.32);
    ctx.lineWidth = hov?3:(u.r?2:1.5);
    roundRect(r.x, top, r.w, r.h, 18); ctx.stroke();

    var cx = r.x+r.w/2;

    // header row
    text(String(i+1), r.x+PAD, top+34, 14, C.dim, 'left', 700, ca*0.8, 1);
    text(rar.name, r.x+r.w-PAD, top+34, 10, rar.col, 'right', 800, ca*0.95, 3.5);

    // icon
    var cy = top+142;
    ctx.globalCompositeOperation='lighter';
    blob(cx,cy,82, hexA(rar.col, rar.glow));
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle = rar.col; ctx.lineWidth=3;
    poly(cx,cy,32, u.sides, G.uiT*(0.8+i*0.3)); ctx.stroke();
    ctx.fillStyle = rar.col; ctx.globalAlpha = ca*0.9;
    ctx.beginPath(); ctx.arc(cx,cy,8,0,TAU); ctx.fill();
    ctx.globalAlpha = ca;

    hr(r.x+PAD, r.x+r.w-PAD, top+212, ca*0.10);

    text(u.name, cx, top+250, 21, C.text, 'center', 900, ca, 1.5);
    wrapText(u.desc, cx, top+288, 15, C.dim, r.w-2*PAD-16, 21);

    // stack pips
    var taken = (G.taken&&G.taken[u.id])||0;
    for(var p=0;p<u.max;p++){
      var px = cx - (u.max-1)*8 + p*16;
      ctx.fillStyle = p<taken ? rar.col : 'rgba(234,242,255,0.18)';
      ctx.beginPath(); ctx.arc(px, top+r.h-42, 4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  text(IN.isTouch?'Tap a card':'Click a card, or press 1 / 2 / 3',
       VW/2, 616, 14, C.dim, 'center', 600, a*0.75, 1.5);
}

function wrapText(str,cx,y,size,col,maxW,lh,align,alpha){
  ctx.font = '600 '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  var words = str.split(' '), line='', lines=[];
  for(var i=0;i<words.length;i++){
    var test = line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line=words[i]; }
    else line = test;
  }
  if(line) lines.push(line);
  for(var j=0;j<lines.length;j++){
    text(lines[j], cx, y+j*lh, size, col, align||'center', 600, alpha===undefined?0.9:alpha, 0);
  }
  return lines.length;
}

/* ------------------------------ game over ------------------------------ */
/* The panel sits higher when a banner has space reserved beneath it. */
function overY(){ return BANNER.reserved ? 48 : 100; }
var OVER_H = 512;

function overBtns(){
  var y = overY() + 410;
  return {
    play:  {x:VW/2-196, y:y, w:250, h:54},
    cores: {x:VW/2+66,  y:y, w:130, h:54}
  };
}

function drawGameOver(){
  var t = G.overT||0;
  var a = clamp(t*2.5,0,1);
  ctx.fillStyle='rgba(3,5,14,'+(0.84*a)+')';
  ctx.fillRect(0,0,VW,VH);

  var by = overY(), bw = 580, bx = VW/2-bw/2, bh = OVER_H;
  ctx.globalAlpha = a;
  ctx.fillStyle='rgba(255,255,255,0.042)';
  roundRect(bx,by,bw,bh,22); ctx.fill();
  ctx.strokeStyle=hexA(C.player,0.30); ctx.lineWidth=2;
  roundRect(bx,by,bw,bh,22); ctx.stroke();

  var inset = bx+PAD+10, inR = bx+bw-PAD-10;

  // identity
  text('CORE LOST', VW/2, by+54, 36, '#ff5f7a', 'center', 900, 1, 5);
  var bw2 = parseInt(store('mgn.bestwave')||'0',10);
  text('RANK  '+rankFor(bw2), VW/2, by+86, 11, C.dim, 'center', 700, 0.62, 4);

  // the number of the run
  text(String(G.score), VW/2, by+152, 66, C.text, 'center', 900, 1, 2);
  if(G.newBest){
    text('NEW BEST SCORE', VW/2, by+198, 12, C.scrap, 'center', 800, 0.65+0.35*Math.sin(G.uiT*6), 4);
  } else {
    text('SCORE', VW/2, by+198, 11, C.dim, 'center', 700, 0.7, 5);
  }

  hr(inset, inR, by+230, a*0.10);

  // run detail
  var best = parseInt(store('mgn.best')||'0',10);
  stat(VW/2-168, by+268, 'WAVE', String(G.wave));
  stat(VW/2,     by+268, 'BEST COMBO', 'x'+G.bestCombo);
  stat(VW/2+168, by+268, 'BEST', String(Math.max(best, G.score)));

  hr(inset, inR, by+326, a*0.10);

  // The Flux payout counts up, so the reward for the run you just finished is
  // the thing that animates rather than a static number you skim past.
  var earned = G.fluxEarned||0;
  var shown = Math.round(earned * clamp((t-0.35)/0.8, 0, 1));
  text('+'+shown+' FLUX', VW/2, by+366, 29, C.scrap, 'center', 900, 1, 2);
  text(getFlux()+' BANKED', VW/2, by+392, 11, C.dim, 'center', 700, 0.7, 4);

  // actions
  var b = overBtns(), pulse = 0.65+0.35*Math.sin(G.uiT*4);
  var hovP = IN.has && inRect(IN.x,IN.y,b.play);
  ctx.fillStyle=hexA(C.player, hovP?0.26:(0.13+0.05*pulse));
  roundRect(b.play.x,b.play.y,b.play.w,b.play.h,14); ctx.fill();
  ctx.strokeStyle=hexA(C.player, hovP?1:pulse); ctx.lineWidth=2;
  roundRect(b.play.x,b.play.y,b.play.w,b.play.h,14); ctx.stroke();
  text('PLAY AGAIN', b.play.x+b.play.w/2, b.play.y+28, 20, C.text, 'center', 900, 1, 3);

  var hovC = IN.has && inRect(IN.x,IN.y,b.cores);
  ctx.fillStyle = hovC ? hexA(C.scrap,0.16) : 'rgba(255,255,255,0.05)';
  roundRect(b.cores.x,b.cores.y,b.cores.w,b.cores.h,14); ctx.fill();
  ctx.strokeStyle = hovC ? C.scrap : 'rgba(234,242,255,0.26)'; ctx.lineWidth=2;
  roundRect(b.cores.x,b.cores.y,b.cores.w,b.cores.h,14); ctx.stroke();
  text('CORES', b.cores.x+b.cores.w/2, b.cores.y+28, 15, hovC?C.scrap:C.text, 'center', 800, 1, 2.5);

  // With an ad on screen, "click anywhere" would turn the whole page into a
  // button sitting next to it - the button becomes the only pointer target.
  var hint = BANNER.reserved
    ? (IN.isTouch ? 'Tap PLAY AGAIN to retry' : 'Press PLAY AGAIN or Enter to retry')
    : (IN.isTouch ? 'Tap anywhere to retry'   : 'Click anywhere or press Enter to retry');
  text(hint, VW/2, by+bh-26, 12, C.dim, 'center', 600, 0.55*a, 1.5);
  ctx.globalAlpha = 1;
}

var RANKS = [[20,'EVENT HORIZON'],[15,'SINGULARITY'],[10,'MAGNETAR'],[5,'FIELD TECH'],[1,'SCRAP RAT']];
function rankFor(w){
  for(var i=0;i<RANKS.length;i++) if(w>=RANKS[i][0]) return RANKS[i][1];
  return 'SCRAP RAT';
}
function stat(x,y,label,val){
  text(val, x, y, 26, C.text, 'center', 900, 1, 1);
  text(label, x, y+26, 11, C.dim, 'center', 700, 0.75, 2.5);
}

/* -------------------------------- cores -------------------------------- */
/* The core menu is a full screen with no spare band, so a banner has to be
   made room for rather than dropped in. Everything tightens by about 17% and
   only while a banner is actually reserved - with no ad (no SDK, no fill, the
   Artifact build) the roomy layout is what you get. */
function coresLayout(){
  return BANNER.reserved
    ? { title:46, sub:78, sync:100,
        y0:120, h:186, step:202,
        glyphY:64, glyphR:22, nameY:38,
        tagY:62, tagSize:12, tagLh:16,
        divY:110, statY:134, statLh:18, statSize:12,
        launch:{x:VW/2-130, y:524, w:260, h:46} }
    : { title:62, sub:98, sync:124,
        y0:152, h:225, step:251,
        glyphY:76, glyphR:25, nameY:44,
        tagY:74, tagSize:12.5, tagLh:18,
        divY:134, statY:160, statLh:22, statSize:12.5,
        launch:{x:VW/2-130, y:650, w:260, h:52} };
}
function coreCardRect(i){
  var L = coresLayout(), col = i%3, row = Math.floor(i/3);
  return {x:66 + col*392, y:L.y0 + row*L.step, w:364, h:L.h};
}
function launchRect(){ return coresLayout().launch; }

function coreGlyph(c, cx, cy, r, alpha){
  ctx.globalCompositeOperation='lighter';
  blob(cx, cy, r*2.6, hexA(c.col, 0.30*alpha));
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c.col;
  poly(cx, cy, r, c.sides, G.uiT*0.5); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx, cy, r*0.30, 0, TAU); ctx.fill();
  ctx.strokeStyle = hexA(c.col, 0.45);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r*1.55, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}

function openCores(){
  G.mode = 'cores';
  G.coreT = 0;
  A.sUi();
}

function drawCores(){
  G.coreT = (G.coreT||0) + 0.016;
  var a = clamp(G.coreT*5,0,1);
  var L = coresLayout();
  ctx.fillStyle='rgba(3,5,14,0.94)';
  ctx.fillRect(0,0,VW,VH);
  ctx.globalAlpha = a;

  text('CORES', 66, L.title, 34, C.text, 'left', 900, 1, 7);
  text('Every run banks Flux. Spend it on a different way to open the next one.',
       66, L.sub, 13, C.dim, 'left', 600, 0.75, 0.5);

  var flux = getFlux();
  text(String(flux), VW-66, L.title-4, 34, C.scrap, 'right', 900, 1, 1);
  text('FLUX BANKED', VW-66, L.title+26, 10, C.dim, 'right', 700, 0.75, 4);

  // Progression is only worth chasing if the player believes it will still be
  // there tomorrow, so say plainly where it is being kept.
  var synced = !!(window.CG && window.CG.cloud);
  var msg = synced ? 'SYNCED TO YOUR CRAZYGAMES ACCOUNT' : 'SAVED ON THIS DEVICE';
  var col = synced ? '#6effc0' : C.dim;
  ctx.globalAlpha = a*0.8;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(70, L.sync, 3.5, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  text(msg, 82, L.sync, 10, col, 'left', 700, a*0.65, 2.5);

  var sel = selectedCore();
  for(var i=0;i<CORES.length;i++){
    var c = CORES[i], r = coreCardRect(i);
    var own = owns(c.id), eq = (c.id===sel), afford = flux >= c.cost;
    var hov = IN.has && inRect(IN.x,IN.y,r);
    var live = own || afford;          // dim only what you cannot act on yet
    var ca = a * (live ? 1 : 0.5);

    ctx.fillStyle = eq ? hexA(c.col,0.11) : (hov && live ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.032)');
    roundRect(r.x,r.y,r.w,r.h,18); ctx.fill();
    ctx.strokeStyle = eq ? c.col : (hov && live ? hexA(c.col,0.75) : 'rgba(234,242,255,0.14)');
    ctx.lineWidth = eq ? 2.5 : 1.5;
    roundRect(r.x,r.y,r.w,r.h,18); ctx.stroke();

    coreGlyph(c, r.x+64, r.y+L.glyphY, L.glyphR, ca);

    var tx = r.x+118;
    text(c.name, tx, r.y+L.nameY, 20, own?C.text:'rgba(234,242,255,0.8)', 'left', 900, ca, 1.5);
    wrapText(c.tag, tx, r.y+L.tagY, L.tagSize, C.dim, r.w-118-PAD, L.tagLh, 'left', ca*0.8);

    hr(r.x+PAD, r.x+r.w-PAD, r.y+L.divY, ca*0.09);

    for(var k=0;k<c.stats.length;k++){
      var sy = r.y+L.statY+k*L.statLh;
      ctx.globalAlpha = ca*0.9;
      ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.arc(r.x+PAD+2, sy, 2.5, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      text(c.stats[k], r.x+PAD+14, sy, L.statSize, C.dim, 'left', 600, ca*0.85, 0.3);
    }

    // Share a baseline with the last stat line so the row reads as one.
    var bxr = r.x+r.w-PAD, byr = r.y+L.statY+(c.stats.length-1)*L.statLh;
    if(eq)        text('EQUIPPED', bxr, byr, 13, c.col, 'right', 900, a, 3);
    else if(own)  text('SELECT',   bxr, byr, 13, hov?C.text:C.dim, 'right', 800, a, 3);
    else          text(c.cost+' FLUX', bxr, byr, 13, afford?C.scrap:'rgba(234,242,255,0.32)', 'right', 800, a, 2.5);
  }

  var LB = L.launch;
  var hovL = IN.has && inRect(IN.x,IN.y,LB);
  var pulse = 0.6+0.4*Math.sin(G.uiT*4);
  ctx.fillStyle = hexA(C.player, hovL?0.24:0.13);
  roundRect(LB.x,LB.y,LB.w,LB.h,14); ctx.fill();
  ctx.strokeStyle = hexA(C.player, hovL?1:pulse); ctx.lineWidth=2;
  roundRect(LB.x,LB.y,LB.w,LB.h,14); ctx.stroke();
  text('LAUNCH', VW/2, LB.y+LB.h/2, 19, C.text, 'center', 900, 1, 4);

  drawBtn(BTN_MUTE, A.muted?'muted':'sound');
  ctx.globalAlpha = 1;
}


/* ------------------------------- banner -------------------------------- */
/* Death screen only. The ad requirements forbid banners during gameplay and
   ask that they sit clear of the game's own buttons, so this lives in the
   empty band below the game-over panel and never appears anywhere else.
   Space is reserved as soon as we know a banner *could* fill, so a failed
   fill does not make the panel jump. */
var BANNER = {
  ID:'mgn-banner',
  wrap:null, el:null,
  shown:false, reserved:false, requesting:false, filled:false, screen:'', token:0,
  w:0, h:0, lastReq:-1e9, fails:0,

  init:function(){
    this.wrap = document.getElementById('mgn-banner-wrap');
    this.el = document.getElementById(this.ID);
  },

  /* Each screen leaves the band in a different place. */
  bandTop:function(){ return (G.mode === 'cores') ? 600 : 582; },

  /* Largest supported size that fits under the panel, or null. */
  pick:function(){
    var labelH = 14, pad = 10;
    var top = offY + this.bandTop()*scale;
    var avail = cssH - top - pad;
    if(cssW >= 768 && avail >= 90 + labelH) return [728,90];
    if(cssW >= 500 && avail >= 60 + labelH) return [468,60];
    if(cssW >= 340 && avail >= 50 + labelH) return [320,50];
    return null;
  },

  available:function(){
    return !!(window.CG && window.CG.ready && window.CG.bannersOk &&
              window.CG.adsOk && this.fails < 3 && this.pick());
  },

  place:function(size){
    if(!this.wrap) return;
    var labelH = 14;
    var top = offY + this.bandTop()*scale;
    var room = cssH - top;
    this.el.style.width = size[0]+'px';
    this.el.style.height = size[1]+'px';
    this.wrap.style.left = Math.round((cssW - size[0])/2)+'px';
    this.wrap.style.top = Math.round(top + Math.max(0,(room - size[1] - labelH)/2))+'px';
  },

  /* Reserve the space immediately, but only reveal the labelled container once
     an ad has actually been filled into it - otherwise the player sees an
     ADVERTISEMENT label over an empty box while the request is in flight. */
  show:function(){
    if(!this.wrap) return;
    var size = this.pick();
    if(!size || !this.available()){ this.hide(); return; }
    this.reserved = true;
    this.screen = G.mode;
    this.place(size);

    if(this.requesting) return;                     // one in flight; wait for it
    var now = performance.now(), self = this;
    var sameSize = (this.w === size[0] && this.h === size[1]);
    if(sameSize && this.filled){                    // already filled at this size
      this.wrap.className = 'on'; this.shown = true; return;
    }
    // The SDK enforces a refresh floor; staying well clear of it avoids
    // burning requests on bannerCooldown errors. Stay blank until it lifts.
    if(sameSize && now - this.lastReq < 61000) return;

    this.w = size[0]; this.h = size[1];
    this.filled = false;
    this.lastReq = now;
    this.requesting = true;
    // A hide() between request and response invalidates this token, so a
    // response for the old screen can never reveal an emptied container.
    var tok = ++this.token;
    try{
      window.CG.sdk.banner.requestBanner({ id:this.ID, width:size[0], height:size[1] })
        .then(function(){
          if(self.token !== tok) return;
          self.requesting = false; self.fails = 0; self.filled = true;
          if(self.reserved && self.wrap){ self.wrap.className = 'on'; self.shown = true; }
        })
        .catch(function(e){
          if(self.token !== tok) return;   // belongs to a superseded request
          self.requesting = false; self.fail(e && e.code);
        });
    }catch(e){ this.requesting = false; this.fail('threw'); }
  },

  /* No fill: collapse the container rather than leave an empty rectangle.
     The reserved space stays, so the panel does not jump. */
  fail:function(code){
    if(code !== 'bannerCooldown') this.fails++;
    this.shown = false;
    this.filled = false;
    if(this.wrap) this.wrap.className = '';
  },

  hide:function(){
    this.shown = false;
    this.reserved = false;
    this.filled = false;
    this.screen = '';
    this.token++;              // orphan any in-flight request
    this.requesting = false;   // ...and never let a hung one wedge the next
    if(this.wrap) this.wrap.className = '';
    // The container is now empty, so the next death has to request again -
    // otherwise the size check would short-circuit and show a labelled but
    // blank box. If that request lands inside the SDK's refresh floor it
    // returns bannerCooldown and fail() simply collapses the container.
    this.w = 0; this.h = 0;
    try{
      if(window.CG.ready && window.CG.sdk.banner) window.CG.sdk.banner.clearBanner(this.ID);
    }catch(e){}
  }
};

function syncBanner(){
  // Menus only - never during gameplay, and never behind a video ad (the SDK
  // rejects that with videoAdPlaying anyway). The core menu is a shop, which
  // the ad requirements list as an allowed placement.
  var want = (G.mode === 'over' || G.mode === 'cores') && !G.adBusy;
  if(want){
    // The two screens park the band at different heights, so moving between
    // them has to re-place rather than reuse the old slot.
    if(BANNER.reserved && BANNER.screen !== G.mode) BANNER.hide();
    // Retry while the space is reserved but nothing is on screen yet; show()
    // rate-limits itself, so this cannot spam the SDK.
    if(!BANNER.reserved || (!BANNER.shown && !BANNER.requesting)) BANNER.show();
    else if(BANNER.shown) BANNER.place([BANNER.w, BANNER.h]);   // follow resizes
  } else if(BANNER.reserved || BANNER.shown){
    BANNER.hide();
  }
}

/* -------------------------------- ads ---------------------------------- */

  var by = 186;

       VW/2, by+168, 12, C.dim, 'center', 600, 0.7, 0.4);

       b.yes.x+b.yes.w/2, b.yes.y+44, 10, C.dim, 'center', 700, 0.65, 0.6);

/* --------------------------------- UI ---------------------------------- */
function handleUI(){
  if(!IN.clicked) return;
  var x = IN.clickX, y = IN.clickY;
  IN.clicked = false;
  if(G.adBusy){ IN.swallow = true; return; }   // the overlay blocks everything

  if(inRect(x,y,BTN_MUTE)){ A.setMute(!A.muted); A.sUi(); IN.swallow=true; return; }
  if(inRect(x,y,BTN_PAUSE)){ togglePause(); IN.swallow=true; return; }

  if(G.mode==='levelup'){
    for(var i=0;i<G.cards.length;i++){
      if(inRect(x,y,cardRect(i))){ chooseUpgrade(i); IN.swallow=true; return; }
    }
    return;
  }
  if(G.mode==='revive'){
    var rb = reviveBtns();
    if(inRect(x,y,rb.yes)){ takeRevive(); IN.swallow=true; return; }
    if(inRect(x,y,rb.no)){  finishRun();  IN.swallow=true; return; }
    return;
  }
  if(G.mode==='over'){
    var ob = overBtns();
    if(inRect(x,y,ob.cores)){ openCores(); IN.swallow=true; return; }
    if(inRect(x,y,ob.play)){
      if((G.overT||0) > 0.35){ restart(); IN.swallow=true; }
      return;
    }
    if(!BANNER.reserved && (G.overT||0) > 0.55){ restart(); IN.swallow=true; }
    return;
  }
  if(G.mode==='cores'){
    if(inRect(x,y,launchRect())){ restart(); IN.swallow=true; return; }
    for(var ci=0; ci<CORES.length; ci++){
      if(!inRect(x,y,coreCardRect(ci))) continue;
      var c = CORES[ci];
      if(owns(c.id)){
        if(c.id!==selectedCore()){ equipCore(c.id); A.sUi(); }
      } else if(buyCore(c.id)){
        equipCore(c.id);
        A.sLevel();
        G.boughtT = G.uiT;
      } else {
        A.tone(150,0.20,'square',0.09,100);   // not enough Flux
      }
      IN.swallow=true;
      return;
    }
    return;
  }
  if(G.paused){ G.paused=false; IN.swallow=true; A.sUi(); return; }
}

/* -------------------------------- loop --------------------------------- */
var STEP = 1/120, acc = 0, last = 0;

function frame(now){
  requestAnimationFrame(frame);
  if(!last) last = now;
  var rdt = (now-last)/1000; last = now;
  if(rdt > 0.25) rdt = 0.25;

  if(!G.adBusy) A.tick();
  G.uiT += rdt;
  if(G.mode==='over') G.overT = (G.overT||0) + rdt;

  handleUI();
  syncBanner();

  var sim = (G.mode==='play' || G.mode==='intro' || G.mode==='levelup' || G.mode==='dying');
  if(G.paused || G.adBusy) sim = false;

  if(G.mode==='dying'){
    G.deathT += rdt;
    if(!G.postDeath && G.deathT > 1.15){ G.postDeath = true; afterDeath(); }
  }
  if(G.mode==='revive' && !G.adBusy){
    G.reviveT -= rdt;
    if(G.reviveT <= 0) finishRun();   // silence declines, it never nags
  }
  if(G.adMsgT > 0) G.adMsgT -= rdt;

  if(sim){
    if(G.hitStop > 0){
      G.hitStop -= rdt;
    } else {
      G.timeScale = (G.mode==='levelup') ? 0.16 : (G.mode==='dying' ? 0.25 : 1);
      acc += rdt * G.timeScale;
      var steps = 0;
      while(acc >= STEP && steps < 12){ update(STEP); acc -= STEP; steps++; }
      if(acc > STEP*12) acc = 0;
    }
  } else {
    acc = 0;
    A.setHum(0,0);
  }

  render(rdt);
}

/* -------------------------- CrazyGames SDK ----------------------------- */
/* The game is fully playable with no SDK: store() falls back to localStorage
   and every call below is a guarded no-op. On CrazyGames the SDK gives us
   cloud saves (Flux and unlocks follow the player across devices), gameplay
   analytics, and happytime signals.

   The build flips ENABLE_CG_SDK off for the Artifact copy, whose CSP blocks
   external scripts - loading it there would only log a violation. */
var ENABLE_CG_SDK = false;   // disabled for the Artifact build (CSP blocks the SDK)

window.CG = {
  ready:false, cloud:false, adsOk:false, bannersOk:false, sdk:null,

  init:function(){
    if(!ENABLE_CG_SDK || !document.head) return;
    var s = document.createElement('script');
    s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    // Blocked by CSP, offline, or ad-blocked: stay on localStorage silently.
    s.onerror = function(){};
    s.onload = function(){
      try{
        var SDK = window.CrazyGames && window.CrazyGames.SDK;
        if(!SDK || !SDK.init) return;
        // Every other module throws until init() resolves.
        SDK.init().then(function(){ window.CG.onReady(SDK); })
                  .catch(function(){});
      }catch(e){}
    };
    document.head.appendChild(s);
  },

  onReady:function(SDK){
    // "disabled" means we are on a domain the SDK does not serve; its calls
    // throw there, so we keep the local backend and stay quiet.
    try{ if(SDK.environment === 'disabled') return; }catch(e){ return; }

    this.sdk = SDK;
    this.ready = true;

    // Adopt cloud storage, folding in anything this device saved first.
    try{
      if(SDK.data && typeof SDK.data.getItem === 'function'){
        adoptCloudSave(SDK.data);
        this.cloud = true;
        applyCloudSave();
      }
    }catch(e){}

    // Signing in swaps the account under us, so drop the cache and re-apply.
    try{
      if(SDK.user && SDK.user.addAuthListener){
        SDK.user.addAuthListener(function(){
          refreshCloudSave();
          applyCloudSave();
        });
      }
    }catch(e){}

    // A revive button that can never fire is a rejection cause, so find out
    // up front whether ads can actually run for this player.
    try{
      this.adsOk = !!(SDK.ad && SDK.ad.requestAd);
      this.bannersOk = !!(SDK.banner && SDK.banner.requestBanner);
      if(this.adsOk && SDK.ad.hasAdblock){
        SDK.ad.hasAdblock()
          .then(function(blocked){ window.CG.adsOk = !blocked; })
          .catch(function(){ window.CG.adsOk = true; });
      }
    }catch(e){ this.adsOk = false; }

    // The SDK missed the real load, so bracket it now that it can hear us.
    try{ SDK.game.loadingStart(); SDK.game.loadingStop(); }catch(e){}
    if(G.mode==='play' || G.mode==='intro'){ this.gameplayStart(); }
  },

  /* One guarded path for both ad types. The game is blocked from the moment
     of the request (so nothing is clickable underneath) but only muted once
     the ad actually starts, which is what the docs ask for. Both guards exist
     because a game that freezes waiting on an ad is a rejection cause. */
  requestAd:function(type, onDone, onFail){
    var self = this;
    if(!this.ready || !this.sdk.ad || !this.sdk.ad.requestAd){ if(onFail) onFail('nosdk'); return; }
    var settled = false, startGuard = 0, runGuard = 0;
    function settle(ok, code){
      if(settled) return;
      settled = true;
      clearTimeout(startGuard); clearTimeout(runGuard);
      G.adBusy = false;
      A.duck(false);
      if(ok){ if(onDone) onDone(); }
      else { if(onFail) onFail(code||'other'); }
    }
    G.adBusy = true;
    startGuard = setTimeout(function(){ settle(false,'noStart'); }, 8000);
    try{
      this.sdk.ad.requestAd(type, {
        adStarted:function(){
          clearTimeout(startGuard);
          A.duck(true);
          self.gameplayStop();
          runGuard = setTimeout(function(){ settle(false,'noEnd'); }, 120000);
        },
        adFinished:function(){ settle(true); },
        adError:function(e){ settle(false, e && e.code); }
      });
    }catch(e){ settle(false,'threw'); }
  },

  gameplayStart:function(){ try{ if(this.ready) this.sdk.game.gameplayStart(); }catch(e){} },
  gameplayStop:function(){  try{ if(this.ready) this.sdk.game.gameplayStop();  }catch(e){} },
  happytime:function(){     try{ if(this.ready) this.sdk.game.happytime();     }catch(e){} },
  progress:function(pct){
    try{ if(this.ready) this.sdk.game.reportGameCompletedPercentage(clamp(Math.round(pct),0,100)); }catch(e){}
  }
};

/* Cloud values can land mid-session. Flux, unlocks and best scores are all
   read live so they need nothing; the equipped core is only consulted when a
   run is built. Re-rolling the player mid-run would be theft, so we only
   re-apply while the run is still effectively untouched. */
function applyCloudSave(){
  var core = selectedCore();
  if(P.core === core) return;
  var untouched = (G.mode==='intro') ||
                  (G.mode==='play' && G.wave<=1 && G.score===0 && G.kills===0);
  if(untouched){
    var wasIntro = (G.mode==='intro');
    reset();
    if(!wasIntro && G.mode!=='play'){ G.mode='play'; startWave(1); }
  }
  // Otherwise the cloud core simply takes effect on the next run.
}

window.CG.init();

/* -------------------------------- boot --------------------------------- */
var booted = false;
function boot(){
  if(booted) return;
  booted = true;
  A.init(); A.resume();
  if(window.CG) window.CG.gameplayStart();
}
cv.addEventListener('touchstart', function(){ IN.isTouch = true; }, {passive:true, capture:true});

BANNER.init();
migrateSave();
reset();
requestAnimationFrame(frame);

})();
</script>
