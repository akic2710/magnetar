<title>Magnetar</title>
<style>
  html,body{height:100%;margin:0;background:#04050c;overflow:hidden;}
  body{
    color:#eaf2ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  /* The native cursor is only hidden once the player has actually moved the
     mouse, at which point the game draws its own reticle. */
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#04050c;cursor:crosshair;}
  #stage.reticle{cursor:none;}

  /* Banner ad, shown only on the death screen. Kept clear of the game's
     buttons so a mis-tap can never land on an ad. */
  #mgn-banner-wrap{
    position:fixed; display:none; z-index:5;
    flex-direction:column; align-items:center; gap:4px;
    touch-action:auto;
  }
  #mgn-banner-wrap.on{ display:flex; }
  #mgn-banner-label{
    font:700 9px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    letter-spacing:.18em; color:rgba(234,242,255,.38); user-select:none;
  }
  #mgn-banner{ overflow:hidden; background:transparent; }
</style>
<canvas id="stage"></canvas>
<div id="mgn-banner-wrap" aria-hidden="true">
  <div id="mgn-banner-label">ADVERTISEMENT</div>
  <div id="mgn-banner"></div>
</div>
<script>
(function(){
'use strict';

var VW = 1280, VH = 720, TAU = Math.PI * 2;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(a+Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function len(x,y){ return Math.sqrt(x*x+y*y); }

/* ----------------------------- persistence -----------------------------
   store() reads and writes through whichever backend is available, in order
   of preference:
     1. the CrazyGames SDK data module - synced to the player's account and
        across their devices (adopted at runtime once the SDK finishes init)
     2. localStorage - per-device, the default before/without the SDK
     3. an in-memory map - private mode, sandboxed iframes, blocked storage
   Reads are served from a cache so per-frame HUD lookups cost nothing, and
   every path is exception-safe: storage that throws degrades to memory
   rather than breaking the run. */
var SYNC_KEYS  = ['mgn.earned','mgn.owned','mgn.core','mgn.best','mgn.bestwave','mgn.played',
                  'mgn.shop','mgn.trail','mgn.arena'];
var LOCAL_ONLY = {'mgn.mute':1};   // a device preference, not account state
var saveBackend = null;            // null = localStorage, else SDK data module
var saveCache = {};

function rawGet(k){
  try{
    if(saveBackend && !LOCAL_ONLY[k]) return saveBackend.getItem(k);
    return localStorage.getItem(k);
  }catch(e){ return null; }
}
function rawSet(k,v){
  try{
    if(saveBackend && !LOCAL_ONLY[k]){ saveBackend.setItem(k,v); return; }
    localStorage.setItem(k,v);
  }catch(e){}
}
function store(k,v){
  if(v===undefined){
    if(k in saveCache) return saveCache[k];   // cached misses are null, and `in` still finds them
    var got = rawGet(k);
    saveCache[k] = got;
    return got;
  }
  v = String(v);
  saveCache[k] = v;
  rawSet(k,v);
  return v;
}

/* ------------------------------- canvas -------------------------------- */
var cv = document.getElementById('stage');
var ctx = cv.getContext('2d', {alpha:false});
var dpr = 1, scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;

function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  cssW = window.innerWidth||VW; cssH = window.innerHeight||VH;
  cv.width  = Math.max(1,Math.round(cssW*dpr));
  cv.height = Math.max(1,Math.round(cssH*dpr));
  cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  scale = Math.min(cssW/VW, cssH/VH);
  offX = (cssW - VW*scale)/2;
  offY = (cssH - VH*scale)/2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,150); });
resize();

/* ---------------------------- glow sprites ----------------------------- */
var glowCache = {};
function glow(color){
  var g = glowCache[color];
  if(g) return g;
  var s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  var g2 = c.getContext('2d');
  var grd = g2.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0.00, color);
  grd.addColorStop(0.20, color);
  grd.addColorStop(1.00, 'rgba(0,0,0,0)');
  g2.fillStyle = grd;
  g2.fillRect(0,0,s,s);
  glowCache[color] = c;
  return c;
}
function blob(x,y,r,color,alpha){
  ctx.globalAlpha = (alpha===undefined?1:alpha);
  ctx.drawImage(glow(color), x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
}

/* -------------------------------- audio -------------------------------- */
var A = {
  ctx:null, master:null, sfxBus:null, musBus:null, noise:null,
  muted: store('mgn.mute')==='1',
  hum:null, hum2:null, humGain:null, humFilt:null, ready:false,
  musT:0, step:0, bar:0,

  init:function(){
    if(this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{ this.ctx = new AC(); }catch(e){ return; }
    var c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.muted?0:0.5; this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.85; this.sfxBus.connect(this.master);
    this.musBus = c.createGain(); this.musBus.gain.value = 0.26; this.musBus.connect(this.master);
    var n = Math.floor(c.sampleRate*1.2), buf = c.createBuffer(1,n,c.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
    this.humGain = c.createGain(); this.humGain.gain.value = 0; this.humGain.connect(this.sfxBus);
    this.humFilt = c.createBiquadFilter(); this.humFilt.type='lowpass'; this.humFilt.frequency.value=520; this.humFilt.Q.value=6;
    this.humFilt.connect(this.humGain);
    this.hum = c.createOscillator(); this.hum.type='sawtooth'; this.hum.frequency.value=62; this.hum.connect(this.humFilt);
    this.hum2 = c.createOscillator(); this.hum2.type='sine'; this.hum2.frequency.value=124; this.hum2.connect(this.humFilt);
    try{ this.hum.start(); this.hum2.start(); }catch(e){}
    this.ready = true;
  },
  resume:function(){ if(this.ctx && this.ctx.state==='suspended'){ try{ this.ctx.resume(); }catch(e){} } },
  ducked:false, forced:false,
  setMute:function(m){
    this.muted = m; store('mgn.mute', m?'1':'0');
    this.applyGain();
  },
  /* CrazyGames requires the game to be silent for the duration of a video ad.
     Ducking is separate from mute so restoring audio afterwards cannot
     clobber what the player actually chose. */
  duck:function(on){ this.ducked = !!on; this.applyGain(); },
  /* The portal can mute the game itself via SDK.game.settings.muteAudio. The
     docs require that to take priority over in-game audio settings, so it is a
     third independent flag: the player's own mute button cannot lift it. */
  setForcedMute:function(on){ this.forced = !!on; this.applyGain(); },
  silent:function(){ return this.muted || this.ducked || this.forced; },
  applyGain:function(){
    if(!this.master || !this.ctx) return;
    this.master.gain.setTargetAtTime(this.silent()?0:0.5, this.ctx.currentTime, 0.03);
  },
  tone:function(f,dur,type,vol,f2,delay,bus){
    if(!this.ctx||this.muted||this.forced) return;
    var c=this.ctx, t=c.currentTime+(delay||0);
    var o=c.createOscillator(); o.type=type||'square';
    o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(24,f2), t+dur);
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol===undefined?0.25:vol, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(bus||this.sfxBus);
    try{ o.start(t); o.stop(t+dur+0.03); }catch(e){}
  },
  hit:function(dur,vol,freq,q,delay){
    if(!this.ctx||this.muted||this.forced) return;
    var c=this.ctx, t=c.currentTime+(delay||0);
    var s=c.createBufferSource(); s.buffer=this.noise; s.loop=true;
    var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(freq,t); f.Q.value=q||1.2;
    f.frequency.exponentialRampToValueAtTime(Math.max(90,freq*0.28), t+dur);
    var g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus);
    try{ s.start(t); s.stop(t+dur+0.03); }catch(e){}
  },
  setHum:function(v,pitch){
    if(!this.ctx||!this.humGain) return;
    var t=this.ctx.currentTime;
    this.humGain.gain.setTargetAtTime(this.silent()?0:v*0.15, t, 0.06);
    this.humFilt.frequency.setTargetAtTime(360+pitch*900, t, 0.08);
    this.hum.frequency.setTargetAtTime(58+pitch*26, t, 0.10);
  },

  sBlast:function(p){
    this.hit(0.30+p*0.16, 0.30, 1500+p*900, 0.9);
    this.tone(360+p*70, 0.26, 'sawtooth', 0.16, 70);
    this.tone(120, 0.22, 'sine', 0.30, 44);
  },
  sPop:function(combo){
    var f = 420 + Math.min(combo,14)*46;
    this.tone(f, 0.10, 'square', 0.13, f*1.7);
    this.hit(0.09, 0.15, 2600, 1.4);
  },
  sBig:function(){ this.hit(0.5,0.32,900,0.7); this.tone(150,0.5,'sawtooth',0.20,40); },
  sCatch:function(){ this.tone(880,0.09,'triangle',0.15,1500); },
  sPull:function(){ this.tone(1150,0.05,'sine',0.05,1800); },
  sHurt:function(){ this.tone(180,0.42,'sawtooth',0.30,48); this.hit(0.36,0.28,700,0.5); },
  sLevel:function(){ var n=[523,659,784,1046]; for(var i=0;i<4;i++) this.tone(n[i],0.30,'triangle',0.17,null,i*0.075); },
  /* A distinct sting when an epic is in the hand - you should hear it before
     you have finished reading the cards. */
  sEpic:function(){
    var n=[523,659,784,1046,1318];
    for(var i=0;i<5;i++) this.tone(n[i],0.42,'triangle',0.17,null,i*0.07);
    this.tone(196,0.80,'sawtooth',0.11,98,0.02);
    this.tone(1568,0.60,'sine',0.09,null,0.30);
  },
  sWave:function(){ this.tone(392,0.16,'triangle',0.15); this.tone(587,0.30,'triangle',0.15,null,0.11); },
  sBoss:function(){ this.tone(90,1.1,'sawtooth',0.25,40); this.hit(0.9,0.20,420,0.6); },
  sUi:function(){ this.tone(700,0.06,'square',0.10,900); },
  /* The orbit hitting capacity is the one moment the game wants you to act on,
     so it gets its own two-note lift rather than being left to the hum. */
  sCharged:function(){
    this.tone(880,0.09,'triangle',0.11,1180);
    this.tone(1318,0.16,'sine',0.08,null,0.055);
  },
  /* Passing your own best mid-run - short and bright, not a fanfare. */
  sBest:function(){
    var n=[784,1046,1318];
    for(var i=0;i<3;i++) this.tone(n[i],0.26,'triangle',0.15,null,i*0.06);
  },
  sDead:function(){ this.tone(300,1.3,'sawtooth',0.26,36); this.hit(1.0,0.22,600,0.5); },
  sHeal:function(){ var n=[659,880,1174]; for(var i=0;i<3;i++) this.tone(n[i],0.24,'sine',0.16,null,i*0.06); },

  ROOTS:[0,0,-4,3],
  tick:function(){
    if(!this.ctx || this.silent()){ this.musT = 0; return; }
    var spb=60/126, six=spb/4, c=this.ctx;
    if(this.musT===0) this.musT = c.currentTime+0.12;
    var guard=0;
    while(this.musT < c.currentTime+0.18 && guard++<64){
      this.stepAt(this.step, this.musT);
      this.step++;
      if(this.step>=16){ this.step=0; this.bar=(this.bar+1)%4; }
      this.musT += six;
    }
  },
  stepAt:function(s,t){
    var c=this.ctx, root=110*Math.pow(2, this.ROOTS[this.bar]/12);
    var inten = clamp((G.wave-1)/14, 0, 1);
    if(s%4===0){
      var o=c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(44,t+0.14);
      var g=c.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.20);
      o.connect(g); g.connect(this.musBus); try{ o.start(t); o.stop(t+0.24); }catch(e){}
    }
    if(s%4===2){
      var sh=c.createBufferSource(); sh.buffer=this.noise; sh.loop=true;
      var f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=7200;
      var gg=c.createGain(); gg.gain.setValueAtTime(0.09+0.06*inten,t); gg.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
      sh.connect(f); f.connect(gg); gg.connect(this.musBus); try{ sh.start(t); sh.stop(t+0.07); }catch(e){}
    }
    var arp=[0,7,12,7,3,10,15,10];
    if(s%2===0){
      var f2 = root*Math.pow(2, arp[(s/2)%8]/12);
      var o2=c.createOscillator(); o2.type='sawtooth'; o2.frequency.setValueAtTime(f2,t);
      var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(700+1900*inten,t); lp.Q.value=5;
      var g2=c.createGain();
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.linearRampToValueAtTime(0.12,t+0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.20);
      o2.connect(lp); lp.connect(g2); g2.connect(this.musBus);
      try{ o2.start(t); o2.stop(t+0.24); }catch(e){}
    }
    if(s===0){
      var ob=c.createOscillator(); ob.type='triangle'; ob.frequency.setValueAtTime(root/2,t);
      var gb=c.createGain(); gb.gain.setValueAtTime(0.0001,t);
      gb.gain.linearRampToValueAtTime(0.20,t+0.02); gb.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      ob.connect(gb); gb.connect(this.musBus); try{ ob.start(t); ob.stop(t+0.75); }catch(e){}
    }
  }
};


/* ------------------------------- palette ------------------------------- */
var C = {
  bg:'#04050c',
  grid:'rgba(90,150,255,0.055)',
  player:'#7cf3ff',
  playerCore:'#ffffff',
  field:'rgba(124,243,255,0.16)',
  scrap:'#ffd76a',
  bolt:'#ff5db1',
  drone:'#ff6b5a',
  spinner:'#ffa23e',
  shooter:'#ff5db1',
  splitter:'#b06bff',
  brute:'#ff3d6e',
  lancer:'#c9d6ff',
  spike:'#ffffff',
  boss:'#ff2f5e',
  shot:'#9dfbff',
  text:'#eaf2ff',
  dim:'rgba(234,242,255,0.55)'
};

/* -------------------------------- input -------------------------------- */
var IN = {
  x:VW/2, y:VH/2, down:false, justDown:false, justUp:false, has:false,
  keys:{}, kx:0, ky:0, kMag:false, anyKey:false, clickX:0, clickY:0, clicked:false,
  cssX:0, cssY:0, clickCssX:0, clickCssY:0
};

/* Only prompt on something that can actually be rotated. A desktop window that
   happens to be taller than it is wide should never be told to turn itself. */
var TOUCH_CAPABLE = ('ontouchstart' in window) || ((navigator.maxTouchPoints|0) > 0);
var rotateDismissed = false;

function toWorld(cx,cy){
  return { x: clamp((cx-offX)/scale, -80, VW+80), y: clamp((cy-offY)/scale, -80, VH+80) };
}
function onDown(cx,cy){
  var p = toWorld(cx,cy);
  IN.x=p.x; IN.y=p.y; IN.has=true;
  IN.cssX=cx; IN.cssY=cy; IN.clickCssX=cx; IN.clickCssY=cy;
  if(!IN.down){ IN.down=true; IN.justDown=true; }
  IN.clickX=p.x; IN.clickY=p.y; IN.clicked=true;
  boot();
}
function onMove(cx,cy){
  var p=toWorld(cx,cy); IN.x=p.x; IN.y=p.y;
  IN.cssX=cx; IN.cssY=cy;
  if(!IN.has && !IN.isTouch){ IN.has=true; cv.className='reticle'; }
  IN.has=true;
}
function onUp(){ if(IN.down){ IN.down=false; IN.justUp=true; } }

cv.addEventListener('mousedown', function(e){ e.preventDefault(); onDown(e.clientX,e.clientY); });
window.addEventListener('mousemove', function(e){ onMove(e.clientX,e.clientY); });
window.addEventListener('mouseup', function(e){ onUp(); });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

cv.addEventListener('touchstart', function(e){
  e.preventDefault();
  var t=e.changedTouches[0]; onDown(t.clientX,t.clientY);
}, {passive:false});
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  var t=e.changedTouches[0]; onMove(t.clientX,t.clientY);
}, {passive:false});
cv.addEventListener('touchend', function(e){ e.preventDefault(); onUp(); }, {passive:false});
cv.addEventListener('touchcancel', function(e){ e.preventDefault(); onUp(); }, {passive:false});

/* Keyboard is a full alternative scheme. Blast is radial, so no aiming is
   needed and arrows / WASD / ZQSD (AZERTY) all work. Escape and Ctrl+W are
   never bound - CrazyGames reserves them. */
var MOVE_KEYS = {
  ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1],
  KeyA:[-1,0], KeyD:[1,0], KeyW:[0,-1], KeyS:[0,1],
  KeyQ:[-1,0], KeyZ:[0,-1]
};
window.addEventListener('keydown', function(e){
  if(e.repeat) return;
  IN.keys[e.code]=true; IN.anyKey=true;
  if(e.code==='Space' || e.code==='ShiftLeft' || e.code==='ShiftRight'){ e.preventDefault(); IN.kMag=true; }
  if(MOVE_KEYS[e.code]) e.preventDefault();
  if(e.code==='KeyM'){ A.setMute(!A.muted); A.sUi(); }
  if(e.code==='KeyP'){ togglePause(); }
  if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'){
    if(G.mode==='levelup') chooseUpgrade(+e.code.slice(5)-1);
  }
  if(e.code==='Enter' && (G.mode==='over' || G.mode==='cores' || G.mode==='shop')) restart();
  if(e.code==='KeyC' && (G.mode==='over' || G.mode==='shop')) openCores();
  if(e.code==='KeyS' && (G.mode==='over' || G.mode==='cores')) openShop();
  if(G.mode==='revive' && !G.adBusy){
    if(e.code==='KeyY') takeRevive();
    if(e.code==='KeyN') finishRun();
  }
  boot();
});
window.addEventListener('keyup', function(e){
  IN.keys[e.code]=false;
  if(e.code==='Space' || e.code==='ShiftLeft' || e.code==='ShiftRight'){
    IN.kMag=false;
    if(G.mode==='play'||G.mode==='intro') doBlast();
  }
});
window.addEventListener('blur', function(){
  IN.keys={}; IN.kMag=false; IN.down=false;
  if(G.mode==='play') G.paused=true;
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(G.mode==='play') G.paused=true; }
});

function keyVector(){
  var vx=0, vy=0;
  for(var k in MOVE_KEYS){ if(IN.keys[k]){ vx+=MOVE_KEYS[k][0]; vy+=MOVE_KEYS[k][1]; } }
  var l=len(vx,vy);
  if(l>0){ vx/=l; vy/=l; }
  return [vx,vy,l>0];
}

/* ------------------------------- upgrades ------------------------------ */
/* ------------------------------- rarity -------------------------------- */
/* Three tiers. `w` is the draw weight for one upgrade of that tier, so the
   pool composition matters less than the tier: commons come up constantly,
   epics are the cards you build a run around. Rarity only means anything if
   the rare things are actually stronger, so the epics below are the
   behaviour-changing upgrades, not just bigger numbers. */
var RARITY = [
  { name:'COMMON', w:56, col:'#b9c7de', glow:0.12 },
  { name:'RARE',   w:30, col:'#5ad2ff', glow:0.20 },
  { name:'EPIC',   w:12, col:'#c88bff', glow:0.32 }
];
var COMMON = 0, RARE = 1, EPIC = 2;

/* `sides` gives each upgrade a stable icon shape - previously the polygon came
   from the card slot, so the same upgrade looked different every level. */
var UPGRADES = [
  {id:'range',  r:COMMON, sides:6, name:'MAGNET FIELD',    desc:'Pull radius +52',                 max:6, ap:function(){ P.magR+=52; }},
  {id:'cap',    r:COMMON, sides:8, name:'ORBIT SLOTS',     desc:'Hold +2 more objects',            max:5, ap:function(){ P.cap+=2; }},

function coreById(id){

  return CORES[0];

/* --------------------------------- shop ---------------------------------
   Bought with Flux, which is only ever earned by playing. Two rules keep the
   shop from touching the thing the bots spent so long balancing:

     - wakes and arenas are looks only. Nothing in either reaches a number the
       run reads, so no purchase can be mistaken for an advantage.
     - the one line that is not cosmetic, the amplifier, pays out more Flux and
       does nothing else. It buys you the rest of the shop sooner; it can never
       buy you a longer run.

   Wakes deliberately declare no colour of their own and take the equipped
   core's instead. Warm hues belong to enemies here, and a cosmetic that could
   dress the player in an enemy's colour is a cosmetic that gets people killed.
   Arenas may recolour, because the grid is background by definition - but they
   stay dark and low-saturation for the same readability reason. */
var SHOP = [
  { id:'trail.std',   kind:'trail', name:'STANDARD',     cost:0,
    tag:'No wake. Just you and the field.' },

    tag:'Ghosts of where you just were.' },

  { id:'arena.deep',  kind:'arena', name:'DEEP FIELD',   cost:0,
    tag:'The standard arena.',
    sky:'#05070f', grid:'84,150,255',  top:'60,120,255',  bot:'180,60,255',  edge:'124,200,255' },
  { id:'arena.noct',  kind:'arena', name:'NOCTURNE',     cost:300,
    tag:'Indigo grid, deeper black.',
    sky:'#03030a', grid:'104,96,255',  top:'70,50,200',   bot:'120,40,220',  edge:'150,140,255' },
  { id:'arena.tide',  kind:'arena', name:'TIDE',         cost:550,

    sky:'#040b10', grid:'60,200,190',  top:'20,140,160',  bot:'30,90,180',   edge:'120,240,220' },

    sky:'#08090c', grid:'170,180,200', top:'120,130,150', bot:'90,100,120',  edge:'190,200,215' },

    tag:'+20% Flux from every run, forever.' },

    tag:'+45% Flux instead. Needs Amplifier I.', req:'boost.amp1' }
];

function shopById(id){
  for(var i=0;i<SHOP.length;i++) if(SHOP[i].id===id) return SHOP[i];
  return null;
}
function shopOwned(){ var s = store('mgn.shop'); return s ? s.split(',') : []; }
function ownsItem(id){
  var it = shopById(id);
  if(!it) return false;
  return it.cost === 0 || shopOwned().indexOf(id) >= 0;   // defaults are always yours
}
function itemLocked(it){ return !!(it && it.req && !ownsItem(it.req)); }
function spentShop(){
  var l = shopOwned(), t = 0;
  for(var i=0;i<SHOP.length;i++) if(l.indexOf(SHOP[i].id) >= 0) t += SHOP[i].cost;
  return t;
}
function equippedTrail(){
  var id = store('mgn.trail') || 'trail.std';
  return ownsItem(id) ? id : 'trail.std';
}
function equippedArena(){
  var id = store('mgn.arena') || 'arena.deep';
  return ownsItem(id) ? id : 'arena.deep';
}
/* Read once per frame by the background, so it is worth not walking the
   catalogue every time. Cleared by anything that can change the answer. */
var themeCache = null;
function arenaTheme(){
  if(!themeCache) themeCache = shopById(equippedArena()) || shopById('arena.deep');
  return themeCache;
}
function fluxMul(){
  if(ownsItem('boost.amp2')) return 1.45;
  if(ownsItem('boost.amp1')) return 1.20;
  return 1;
}
function buyItem(id){
  var it = shopById(id);
  if(!it || it.cost === 0 || ownsItem(id) || itemLocked(it)) return false;
  if(getFlux() < it.cost) return false;
  var l = shopOwned();      // the spend is implied by ownership, never deducted
  if(l.indexOf(id) < 0) l.push(id);
  store('mgn.shop', l.join(','));
  return true;
}
function equipItem(id){
  var it = shopById(id);
  if(!it || !ownsItem(id)) return;
  if(it.kind === 'trail') store('mgn.trail', id);
  else if(it.kind === 'arena'){ store('mgn.arena', id); themeCache = null; }
}

/* ----------------------------- purchase rail -----------------------------
   Every purchase in the game goes through PURCHASE.buy, so exactly one place
   knows how a player pays for anything.

   Today the only rail is Flux. CrazyGames in-game purchases are invite-only:
   they issue an Xsolla project id per game, and their SDK surface is just two
   calls - SDK.user.getXsollaUserToken() for a short-lived token, and
   SDK.analytics.trackOrder('xsolla', order) to report a finished order. The
   catalogue and the checkout widget live in Xsolla's own API, not theirs.

   A 'cash' rail drops in beside the Flux one when that invite arrives, and
   nothing outside this object has to change. Their rules are the reason
   canPurchase() exists at all: real-money purchases must be limited to
   signed-in players, guests must not even see a buy button, and the shop has
   to be hidden entirely inside the CrazyGames mobile app. On the Flux rail
   none of that applies, because Flux is earned rather than bought. */
var PURCHASE = {
  rail: 'flux',
  signedIn: false,     // fed by the SDK auth listener; only the cash rail reads it
  inCrazyApp: false,   // ditto - the app forbids real-money purchases outright

  canPurchase: function(){
    if(this.rail === 'flux') return true;
    return this.signedIn && !this.inCrazyApp;
  },
  priceLabel: function(it){
    return this.rail === 'flux' ? (it.cost + ' FLUX') : it.price;
  },
  /* done(ok, why) - always called, never throws, so the caller never has to
     guess whether a purchase is still in flight. */
  buy: function(it, done){
    if(!it || !this.canPurchase()){ done(false, 'unavailable'); return; }
    if(this.rail === 'flux'){
      if(itemLocked(it)){ done(false, 'locked'); return; }
      if(getFlux() < it.cost){ done(false, 'funds'); return; }
      done(buyItem(it.id), 'bought');
      return;
    }
    done(false, 'unavailable');   // no cash rail until the invite lands
  }
};
function num(v){ var n = parseInt(v||'0',10); return isNaN(n) ? 0 : n; }
function spentFlux(){
  var l = ownedList(), total = 0;
  for(var i=0;i<CORES.length;i++) if(l.indexOf(CORES[i].id)>=0) total += CORES[i].cost;
  return total + spentShop();
}
/* Balance is derived, never stored, so it can never disagree with `owned`. */
function getEarned(){ return num(store('mgn.earned')); }
function getFlux(){ return Math.max(0, getEarned() - spentFlux()); }
function addFlux(n){ store('mgn.earned', String(getEarned() + Math.max(0, Math.round(n)))); }

/* Saves written before the earned/spent model stored a balance. */
function migrateSave(){
  if(store('mgn.earned') !== null) return;
  var old = store('mgn.flux');
  if(old === null) return;
  store('mgn.earned', String(num(old) + spentFlux()));
}

/* Merge local and cloud saves without ever taking something away: unlocks
   union, monotonic counters take the max, and the equipped core has to be one
   the player actually owns afterwards. */
function mergeSave(local, cloud){
  var ids = {}, i, l;
  l = (local['mgn.owned']||'prospector').split(',');
  for(i=0;i<l.length;i++) if(l[i]) ids[l[i]] = 1;
  l = (cloud['mgn.owned']||'prospector').split(',');
  for(i=0;i<l.length;i++) if(l[i]) ids[l[i]] = 1;
  var owned = [];
  for(i=0;i<CORES.length;i++) if(ids[CORES[i].id]) owned.push(CORES[i].id);
  if(owned.indexOf('prospector') < 0) owned.unshift('prospector');

  /* Prefer the cloud's selection, but only where it is an actual selection.
     Every default is permanently "owned", so a device that never picked
     anything still reports one - and letting that win silently undoes a choice
     made somewhere else. Ranking a real choice above a default in both
     directions means a merge can only ever add information. */
  function pickEquipped(cloudV, localV, ok, dflt){
    if(ok(cloudV) && cloudV !== dflt) return cloudV;
    if(ok(localV) && localV !== dflt) return localV;
    if(ok(cloudV)) return cloudV;
    if(ok(localV)) return localV;
    return dflt;
  }
  function ownsCore(v){ return !!v && owned.indexOf(v) >= 0; }
  var core = pickEquipped(cloud['mgn.core'], local['mgn.core'], ownsCore, 'prospector');

  var sids = {}, shop = [];
  l = (local['mgn.shop']||'').split(',');
  for(i=0;i<l.length;i++) if(l[i]) sids[l[i]] = 1;
  l = (cloud['mgn.shop']||'').split(',');
  for(i=0;i<l.length;i++) if(l[i]) sids[l[i]] = 1;
  for(i=0;i<SHOP.length;i++) if(sids[SHOP[i].id]) shop.push(SHOP[i].id);

  /* An equipped item must be one the merged account actually has - a free
     default, or something in the union above. */
  function eqOk(v, kind){
    var it = v && shopById(v);
    return !!it && it.kind === kind && (it.cost === 0 || !!sids[v]);
  }
  function okTrail(v){ return eqOk(v,'trail'); }
  function okArena(v){ return eqOk(v,'arena'); }
  var trail = pickEquipped(cloud['mgn.trail'], local['mgn.trail'], okTrail, 'trail.std');
  var arena = pickEquipped(cloud['mgn.arena'], local['mgn.arena'], okArena, 'arena.deep');

  return {
    'mgn.owned':    owned.join(','),
    'mgn.core':     core,
    'mgn.shop':     shop.join(','),
    'mgn.trail':    trail,
    'mgn.arena':    arena,
    'mgn.earned':   String(Math.max(num(local['mgn.earned']),   num(cloud['mgn.earned']))),
    'mgn.best':     String(Math.max(num(local['mgn.best']),     num(cloud['mgn.best']))),
    'mgn.bestwave': String(Math.max(num(local['mgn.bestwave']), num(cloud['mgn.bestwave']))),
    'mgn.played':   (local['mgn.played']==='1' || cloud['mgn.played']==='1') ? '1' : null
  };
}

/* Switch store() onto the SDK data module, folding in whatever this device
   already had. The SDK migrates its own guest data on sign-in, but guest
   progress written straight to localStorage before the SDK loaded is invisible
   to it - this is what keeps that from being lost. */
function adoptCloudSave(dataModule){
  var local = {}, cloud = {}, i, k;
  for(i=0;i<SYNC_KEYS.length;i++){ k=SYNC_KEYS[i]; local[k] = store(k); }
  saveBackend = dataModule;
  saveCache = {};
  for(i=0;i<SYNC_KEYS.length;i++){ k=SYNC_KEYS[i]; cloud[k] = store(k); }
  var merged = mergeSave(local, cloud);
  for(k in merged) if(merged[k] !== null) store(k, merged[k]);
  themeCache = null;
  return merged;
}

/* The account swaps underneath us on sign-in, so the caches have to go. */
function refreshCloudSave(){ saveCache = {}; themeCache = null; }
function ownedList(){ return (store('mgn.owned')||'prospector').split(','); }
function owns(id){ return id==='prospector' || ownedList().indexOf(id)>=0; }
function selectedCore(){
  var id = store('mgn.core') || 'prospector';
  return owns(id) ? id : 'prospector';
}
function equipCore(id){ if(owns(id)) store('mgn.core', id); }
function buyCore(id){
  var c = coreById(id);
  if(!c || owns(id)) return false;
  if(getFlux() < c.cost) return false;
  var l = ownedList();   // the spend is implied by ownership, never deducted
  if(l.indexOf(id) < 0) l.push(id);
  store('mgn.owned', l.join(','));
  return true;
}
/* Depth is worth more than score, so a deep careful run beats farming wave 3.
   The flat term keeps a short first run from feeling like it paid nothing. */
function fluxFor(score, wave){ return 15 + Math.floor(score/150) + wave*4; }

/* ------------------------------ game state ----------------------------- */
var P = {};
var G = {};

var scrap=[], enemies=[], bolts=[], shots=[], orbit=[], parts=[], pops=[], waves=[], zaps=[];

function reset(){
  P = newPlayer();

  scrap.length=0; enemies.length=0; bolts.length=0; shots.length=0;
  orbit.length=0; parts.length=0; pops.length=0; waves.length=0; zaps.length=0;

  if(store('mgn.played')==='1'){ G.mode='play'; startWave(1); }
