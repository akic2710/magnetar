  for(var i=0;i<SHOP.length;i++){
    var it = SHOP[i], r = shopCardRect(i);
    var own = ownsItem(it.id);
    var eq = (it.id === trail || it.id === arena);
    var lock = itemLocked(it);
    var afford = flux >= it.cost;
    var live = own || (afford && !lock);   // dim only what you cannot act on yet
    var hov = IN.has && inRect(IN.x,IN.y,r);
    var ca = a * (live ? 1 : 0.5);

    ctx.fillStyle = eq ? hexA(C.player,0.11) : (hov && live ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.032)');
    roundRect(r.x,r.y,r.w,r.h,16); ctx.fill();
    ctx.strokeStyle = eq ? C.player : (hov && live ? hexA(C.player,0.75) : 'rgba(234,242,255,0.14)');
    ctx.lineWidth = eq ? 2.5 : 1.5;
    roundRect(r.x,r.y,r.w,r.h,16); ctx.stroke();

    shopGlyph(it, r.x+40, r.y+L.glyphY, ca);

    var tx = r.x+74;
    text(it.name, tx, r.y+L.nameY, 16, own?C.text:'rgba(234,242,255,0.8)', 'left', 900, ca, 1.2);
    wrapText(it.tag, tx, r.y+L.tagY, L.tagSize, C.dim, r.w-74-18, L.tagLh, 'left', ca*0.8);

    hr(r.x+18, r.x+r.w-18, r.y+L.priceY-22, ca*0.09);

    var px = r.x+r.w-18, py = r.y+L.priceY;
    if(it.kind === 'boost'){
      if(own)       text('ACTIVE', px, py, 12, C.scrap, 'right', 900, a, 3);
      else if(lock) text('LOCKED', px, py, 12, 'rgba(234,242,255,0.32)', 'right', 800, a, 3);
      else          text(PURCHASE.priceLabel(it), px, py, 12, afford?C.scrap:'rgba(234,242,255,0.32)', 'right', 800, a, 2.5);
    }
    else if(eq)  text('EQUIPPED', px, py, 12, C.player, 'right', 900, a, 3);
    else if(own) text('EQUIP', px, py, 12, hov?C.text:C.dim, 'right', 800, a, 3);
    else         text(PURCHASE.priceLabel(it), px, py, 12, afford?C.scrap:'rgba(234,242,255,0.32)', 'right', 800, a, 2.5);
  }

  if(G.menuMsgT > 0){
    text(G.menuMsg, VW/2, L.launch.y-22, 12, '#ff5f7a', 'center', 800,
         clamp(G.menuMsgT*2,0,1)*a, 3);
  }

  drawMetaButtons(L, 'CORES');
  drawBtn(BTN_MUTE, (A.muted||A.forced)?'muted':'sound');
  ctx.globalAlpha = 1;
}


/* ------------------------ game over, portrait --------------------------
   Not a list like the other two, so it does not use the shared frame: it is a
   column of numbers with the actions underneath. The block is measured from
   its own type sizes and then centred, rather than pinned to fractions of the
   screen, so a 568-tall phone and a 932-tall one both look composed instead of
   one of them looking stretched.

   Unlike the shop and the core menu this screen KEEPS its banner. The death
   screen is the placement that actually earns, so rather than drop it the
   layout reserves a real strip at the bottom and lifts the buttons above it -
   the ad requirements ask for clear separation from the game's own controls,
   and 8px of dead space plus the ADVERTISEMENT label is what provides it. */
function overBannerBand(){
  /* Reserved only when a banner could actually fill: with no SDK - the
     Artifact build, or an adblocker - the roomier layout is what you get.
     320x50 is the narrowest unit, so below 340 CSS px nothing can fill. */
  var can = !!(window.CG && window.CG.ready && window.CG.bannersOk &&
               window.CG.adsOk && BANNER.fails < 3 && cssW >= 340);
  if(!can) return 0;
  /* And only if the panel still fits once the strip is taken out. Below about
     400px tall the two button rows plus a 74px band leave less than the score
     block needs even at its type floors, and the numbers would end up under
     the buttons. A screen that short gives up the banner, not the score. */
  var btnH = fit(cssH * 0.060, 46, 64);
  var floors = 192;                                  // block at its minimum type
  var need = floors + 2*btnH + 10 + Math.round(cssH*0.04) + fit(cssW*0.045, 12, 48) + 82;
  return cssH >= need ? 74 : 0;
}

function overPortraitLayout(){
  var m = fit(cssW * 0.045, 12, 48);
  var w = Math.min(cssW - m*2, 560);
  var x0 = Math.round((cssW - w) / 2);

  var btnH = fit(cssH * 0.060, 46, 64);
  var bandH = overBannerBand();
  var bandY = cssH - bandH;
  /* Two rows: the thing you almost always want is full width on its own, and
     the two places you might go instead share the row below it. */
  var row2Y = (bandH ? bandY - 8 : cssH - m) - btnH;
  var row1Y = row2Y - 10 - btnH;

  var muteW = btnH;
  var mute = { x:x0 + w - muteW, y:row2Y, w:muteW, h:btnH };
  var half = (w - muteW - 16) / 2;
  var cores = { x:x0, y:row2Y, w:half, h:btnH };
  var shop  = { x:x0 + half + 8, y:row2Y, w:half, h:btnH };
  var play  = { x:x0, y:row1Y, w:w, h:btnH };

  var small = fit(cssW * 0.029, 10, 13);
  var T0 = fit(cssW * 0.075, 22, 38);
  var S0 = fit(cssW * 0.160, 44, 72);
  var C0 = fit(cssW * 0.065, 18, 28);
  var F0 = fit(cssW * 0.070, 20, 30);

  var top = m + Math.round(cssH * 0.02);
  var bot = row1Y - Math.round(cssH * 0.02);
  var span = bot - top;

  /* Sized from the width, but stacked down the screen - so on a short viewport
     the column has to come down or it runs into the buttons. A 360x400 frame
     overflowed by 31px. Shrink the display type and the gaps together, keeping
     the small labels at their floor, until the block fits; real phones are
     nowhere near this and land on s = 1 unchanged. */
  var GAPS = [8, 20, 6, 16, 16, 4, 16, 16, 6];
  var s = 1, titleSize, scoreSize, statSize, fluxSize, gaps, block, i;
  for(i = 0; i < 14; i++){
    var gs = Math.max(0.55, s);
    titleSize = Math.max(18, Math.round(T0*s));
    scoreSize = Math.max(32, Math.round(S0*s));
    statSize  = Math.max(15, Math.round(C0*s));
    fluxSize  = Math.max(16, Math.round(F0*s));
    gaps = [];
    block = titleSize + scoreSize + statSize + fluxSize + 4*small;
    for(var k=0;k<GAPS.length;k++){ gaps[k] = Math.round(GAPS[k]*gs); block += gaps[k]; }
    if(block <= span || s <= 0.55) break;
    s -= 0.04;
  }

  var y = top + Math.max(0, (span - block) / 2);
  var titleY = y + titleSize*0.5;   y += titleSize + gaps[0];
  var rankY  = y + small*0.5;       y += small + gaps[1];
  var scoreY = y + scoreSize*0.5;   y += scoreSize + gaps[2];
  var scoreLabelY = y + small*0.5;  y += small + gaps[3];
  var hr1Y = y;                     y += gaps[4];
  var statY = y + statSize*0.5;     y += statSize + gaps[5];
  var statLabelY = y + small*0.5;   y += small + gaps[6];
  var hr2Y = y;                     y += gaps[7];
  var fluxY = y + fluxSize*0.5;     y += fluxSize + gaps[8];
  var bankY = y + small*0.5;

  return { m:m, x0:x0, w:w, small:small,
           titleSize:titleSize, titleY:titleY, rankY:rankY,
           scoreSize:scoreSize, scoreY:scoreY, scoreLabelY:scoreLabelY,
           hr1Y:hr1Y,
           statSize:statSize, statY:statY, statLabelY:statLabelY,
           hr2Y:hr2Y,
           fluxSize:fluxSize, fluxY:fluxY, bankY:bankY,
           play:play, cores:cores, shop:shop, mute:mute,
           bandY:bandY, bandH:bandH };
}

function drawOverPortrait(){
  var L = overPortraitLayout();
  var t = G.overT||0, a = clamp(t*2.5, 0, 1);

  ctx.fillStyle = '#03050e';
  ctx.fillRect(0, 0, cssW, cssH);
  ctx.globalAlpha = a;

  var cx = L.x0 + L.w/2;
  text('CORE LOST', cx, L.titleY, L.titleSize, '#ff5f7a', 'center', 900, 1, 4);
  var bw = parseInt(store('mgn.bestwave')||'0',10);
  text('RANK  '+rankFor(bw), cx, L.rankY, L.small, C.dim, 'center', 700, 0.62, 3);

  text(String(G.score), cx, L.scoreY, L.scoreSize, C.text, 'center', 900, 1, 2);
  if(G.newBest){
    text('NEW BEST SCORE', cx, L.scoreLabelY, L.small, C.scrap, 'center', 800,
         0.65+0.35*Math.sin(G.uiT*6), 3);
  } else {
    text('SCORE', cx, L.scoreLabelY, L.small, C.dim, 'center', 700, 0.7, 4);
  }

  hr(L.x0, L.x0+L.w, L.hr1Y, a*0.10);

  var best = parseInt(store('mgn.best')||'0',10);
  var cols = [['WAVE', String(G.wave)],
              ['BEST COMBO', 'x'+G.bestCombo],
              ['BEST', String(Math.max(best, G.score))]];
  for(var i=0;i<3;i++){
    var sx = L.x0 + L.w*(i*2+1)/6;
    text(cols[i][1], sx, L.statY, L.statSize, C.text, 'center', 900, 1, 1);
    text(cols[i][0], sx, L.statLabelY, L.small, C.dim, 'center', 700, 0.75, 1.5);
  }

  hr(L.x0, L.x0+L.w, L.hr2Y, a*0.10);

  var shown = Math.round((G.fluxEarned||0) * clamp((t-0.35)/0.8, 0, 1));
  text('+'+shown+' FLUX', cx, L.fluxY, L.fluxSize, C.scrap, 'center', 900, 1, 2);
  text(bankedLine(L.w, L.small), cx, L.bankY, L.small, C.dim, 'center', 700, 0.7, 1.5);

  var pulse = 0.65+0.35*Math.sin(G.uiT*4);
  var PB = L.play;
  ctx.fillStyle = hexA(C.player, 0.13+0.05*pulse);
  roundRect(PB.x, PB.y, PB.w, PB.h, 12); ctx.fill();
  ctx.strokeStyle = hexA(C.player, pulse); ctx.lineWidth = 2;
  roundRect(PB.x, PB.y, PB.w, PB.h, 12); ctx.stroke();
  text('PLAY AGAIN', PB.x+PB.w/2, PB.y+PB.h/2, fit(cssW*0.048, 16, 22), C.text, 'center', 900, 1, 3);

  var sm = fit(cssW*0.032, 11, 15);
  [[L.cores,'CORES'], [L.shop,'SHOP']].forEach(function(b){
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    roundRect(b[0].x, b[0].y, b[0].w, b[0].h, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(234,242,255,0.26)'; ctx.lineWidth = 2;
    roundRect(b[0].x, b[0].y, b[0].w, b[0].h, 12); ctx.stroke();
    text(b[1], b[0].x+b[0].w/2, b[0].y+b[0].h/2, sm, C.text, 'center', 800, 1, 1.5);
  });

  drawBtn(L.mute, (A.muted||A.forced) ? 'muted' : 'sound');
  ctx.globalAlpha = 1;
}

function handleOverPortrait(){
  var x = IN.clickCssX, y = IN.clickCssY;
  var L = overPortraitLayout();
  function hit(r){ return x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h; }

  IN.swallow = true;            // never restart on a stray tap next to an ad
  if(hit(L.mute)){ A.setMute(!A.muted); A.sUi(); return; }
  if(hit(L.cores)){ openCores(); return; }
  if(hit(L.shop)){ openShop(); return; }
  // The same grace period the landscape screen uses, so the tap that killed
  // you cannot immediately start the next run.
  if(hit(L.play) && (G.overT||0) > 0.35){ restart(); return; }
}

/* -------------------------- cores, portrait ----------------------------
   Same reasoning as the shop below, one problem harder: a core carries three
   stat lines as well as a name, and there are six of them rather than four.
   On a 568-tall phone that leaves about 65px a card, which is one line of
   stats, not three - so the card asks how many lines it can afford and shows
   the longest prefix of the stats that actually fits. The tag is the one
   thing dropped in portrait: it is flavour, and the stats are the trade. */
function coresPortraitLayout(){
  return portraitFrame(Math.round(cssH * 0.028), CORES.length, 104);
}
function coresPortraitCard(i){
  var L = coresPortraitLayout();
  return { x:L.x0, y:L.listTop + i*L.slot, w:L.w, h:L.cardH };
}
function corePortraitLabel(c, own, eq){
  if(eq) return 'EQUIPPED';
  if(own) return 'SELECT';
  return c.cost + ' FLUX';
}
/* The longest run of stats that fits the lines this card can spare. Falls
   back to the first line alone, which is always the lives/slots trade. */
function coreStatLine(c, L, maxLines){
  for(var n=c.stats.length; n>=1; n--){
    var s = c.stats.slice(0, n).join('  \u00b7  ');
    if(wrapCount(s, L.tagSize, L.textW) <= maxLines) return s;
  }
  return c.stats[0];
}

function tryBuyCore(c){
  if(buyCore(c.id)){
    equipCore(c.id);
    A.sLevel();
    G.boughtT = G.uiT;
    return;
  }
  A.tone(150,0.20,'square',0.09,100);
  G.menuMsg = 'NOT ENOUGH FLUX';
  G.menuMsgT = 1.8;
}

function drawCoresPortrait(){
  var L = coresPortraitLayout();
  ctx.fillStyle = '#03050e';
  ctx.fillRect(0, 0, cssW, cssH);

  var flux = getFlux();
  text('CORES', L.x0, L.titleY, L.titleSize, C.text, 'left', 900, 1, 4);
  text(String(flux), L.x0 + L.w, L.titleY, L.titleSize, C.scrap, 'right', 900, 1, 1);
  text('FLUX BANKED', L.x0 + L.w, L.subY, L.subSize, C.dim, 'right', 700, 0.7, 2);

  // Where progress is kept matters as much here as it does in landscape.
  var synced = !!(window.CG && window.CG.cloud);
  var msg = synced ? 'SYNCED TO YOUR ACCOUNT' : 'SAVED ON THIS DEVICE';
  var scol = synced ? '#6effc0' : C.dim;
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = scol;
  ctx.beginPath(); ctx.arc(L.x0 + 3, L.subY, 3, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  text(msg, L.x0 + 13, L.subY, L.subSize, scol, 'left', 700, 0.7, 1.5);

  var sel = selectedCore();
  for(var i=0;i<CORES.length;i++){
    var c = CORES[i], r = coresPortraitCard(i);
    var own = owns(c.id), eq = (c.id === sel), afford = flux >= c.cost;
    var live = own || afford;
    var ca = live ? 1 : 0.5;

    ctx.fillStyle = eq ? hexA(c.col, 0.11) : 'rgba(255,255,255,0.04)';
    roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
    ctx.strokeStyle = eq ? c.col : 'rgba(234,242,255,0.14)';
    ctx.lineWidth = eq ? 2.5 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 14); ctx.stroke();

    coreGlyph(c, r.x + L.gutter/2, r.y + r.h/2, L.glyphR, ca);

    var tx = r.x + L.gutter, ty = r.y + r.h*0.30;
    text(c.name, tx, ty, L.nameSize, own?C.text:'rgba(234,242,255,0.8)', 'left', 900, ca, 0.8);

    var label = corePortraitLabel(c, own, eq);
    var lcol = eq ? c.col : (own ? C.dim : (afford ? C.scrap : 'rgba(234,242,255,0.32)'));
    text(label, r.x + r.w - 16, ty, L.priceSize, lcol, 'right', eq?900:800, 1, 1.2);

    var statTop = r.y + r.h*0.54;
    var lines = Math.max(1, Math.floor((r.y + r.h - 6 - statTop) / (L.tagSize*1.3)));
    wrapText(coreStatLine(c, L, lines), tx, statTop, L.tagSize, C.dim,
             L.textW, L.tagSize*1.3, 'left', ca*0.8);
  }

  if(G.menuMsgT > 0){
    text(G.menuMsg, cssW/2, L.launch.y - 14, L.tagSize, '#ff5f7a', 'center', 800,
         clamp(G.menuMsgT*2, 0, 1), 2);
  }

  var LB = L.launch, pulse = 0.6 + 0.4*Math.sin(G.uiT*4);
  ctx.fillStyle = hexA(C.player, 0.13);
  roundRect(LB.x, LB.y, LB.w, LB.h, 12); ctx.fill();
  ctx.strokeStyle = hexA(C.player, pulse); ctx.lineWidth = 2;
  roundRect(LB.x, LB.y, LB.w, LB.h, 12); ctx.stroke();
  text('LAUNCH', LB.x + LB.w/2, LB.y + LB.h/2, Math.max(15, L.nameSize), C.text, 'center', 900, 1, 3);

  var AB = L.alt;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(AB.x, AB.y, AB.w, AB.h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(234,242,255,0.26)'; ctx.lineWidth = 2;
  roundRect(AB.x, AB.y, AB.w, AB.h, 12); ctx.stroke();
  text('SHOP', AB.x + AB.w/2, AB.y + AB.h/2, fit(cssW*0.032, 11, 15), C.text, 'center', 800, 1, 1.5);

  drawBtn(L.mute, (A.muted||A.forced) ? 'muted' : 'sound');
}

function handleCoresPortrait(){
  var x = IN.clickCssX, y = IN.clickCssY;
  var L = coresPortraitLayout();
  function hit(r){ return x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h; }

  IN.swallow = true;            // this screen owns the whole viewport
  if(hit(L.mute)){ A.setMute(!A.muted); A.sUi(); return; }
  if(hit(L.launch)){ restart(); return; }
  if(hit(L.alt)){ openShop(); return; }

  for(var i=0;i<CORES.length;i++){
    if(!hit(coresPortraitCard(i))) continue;
    var c = CORES[i];
    if(owns(c.id)){
      if(c.id !== selectedCore()){ equipCore(c.id); A.sUi(); }
    } else {
      tryBuyCore(c);
    }
    return;
  }
}

/* --------------------------- shop, portrait ----------------------------
   The game lives in a fixed 1280x720 field that letterboxes into a 375x211
   strip on a phone. That is fine for an arena you look at and useless for a
   menu you read: item names landed at 4.7px and the LAUNCH button at 15px
   tall. So in portrait the shop leaves that coordinate space altogether and
   lays itself out in CSS pixels across the whole screen, the way the rotate
   prompt already does.

   Ten cards cannot be legible on a 568-tall phone, so the catalogue splits
   into the three groups it already had and shows one at a time. Four cards
   maximum per screen is what buys every card enough room to read and to hit,
   and it means no scrolling - which on a canvas would have to fight the tap
   handler for the same gesture. */
function portraitUI(){ return cssH > cssW * 1.05; }

var SHOP_TABS = [
  { key:'trail', label:'WAKES',  hint:'Looks only. No effect on the run.' },
  { key:'arena', label:'ARENAS', hint:'Looks only. No effect on the run.' },
  { key:'boost', label:'BOOSTS', hint:'Pays more Flux. Never an easier run.' }
];
function shopTabItems(t){
  var kind = SHOP_TABS[t].key, out = [];
  for(var i=0;i<SHOP.length;i++) if(SHOP[i].kind === kind) out.push(SHOP[i]);
  return out;
}

/* Sizes scale with the viewport but are clamped at both ends: a floor so a
   280-wide phone stays legible and hittable, a ceiling so a 1024-wide tablet
   does not end up with 43px item names on metre-wide cards. */
function fit(v, lo, hi){ return Math.max(lo, Math.min(hi, Math.round(v))); }

/* Both meta screens share a portrait frame: a centred column, a header, a
   list, and the same three controls along the bottom. Only what sits between
   the header and the buttons differs, so only that lives in each screen's own
   layout - two copies of this clamping would have drifted apart by the second
   change to either. `topExtra` is the space a screen needs under its subtitle
   (the shop puts its tab bar there; the core menu puts nothing). */
function portraitFrame(topExtra, rows, maxCardH){
  var m = fit(cssW * 0.045, 12, 48);
  // Past ~560 the column stops widening and centres instead - a full-width
  // card on a tablet is a very long line for four words of tag text.
  var w = Math.min(cssW - m*2, 560);
  var x0 = Math.round((cssW - w) / 2);

  var titleSize = fit(cssW * 0.068, 20, 34);
  var headTop = m + Math.round(cssH * 0.012);
  var titleY = headTop + titleSize*0.6;
  var subY = titleY + titleSize*0.78;

  /* The bottom row carries the same three controls the landscape screen ends
     on, so leaving portrait does not change what the buttons are. */
  var btnH = fit(cssH * 0.060, 46, 64);
  var btnY = cssH - m - btnH;
  var muteW = btnH;
  var altW = Math.min(96, Math.round(w * 0.28));
  var mute = { x:x0 + w - muteW, y:btnY, w:muteW, h:btnH };
  var alt  = { x:mute.x - 8 - altW, y:btnY, w:altW, h:btnH };
  var launch = { x:x0, y:btnY, w:alt.x - 8 - x0, h:btnH };

  var listTop = subY + topExtra;
  var listBot = btnY - Math.round(cssH * 0.020);
  /* A tall phone has more room than the list needs. Capping the card and then
     spreading what is left into the gaps keeps it evenly paced - centring the
     block on its own banked all the slack into one lump under the header,
     which read as a missing row. */
  var avail = listBot - listTop;
  var gap = Math.min(14, avail * (0.12 / rows));
  var cardH = Math.min((avail - (rows-1)*gap) / rows, maxCardH);
  gap = Math.max(0, Math.min(28, (avail - rows*cardH) / (rows-1)));
  /* A 44px touch target matters more than the space between cards, so on a
     short viewport the gap gives way first. Six core rows miss 44 by 4px on a
     400-tall frame at the default spacing and clear it comfortably once the
     gap collapses. */
  if(cardH < 44 && avail >= rows*44){
    cardH = 44;
    gap = Math.max(0, (avail - rows*44) / (rows-1));
  }
  listTop += Math.max(0, (avail - (rows*cardH + (rows-1)*gap)) / 2);

  /* The glyph gutter gives way before the text does, and on the narrowest
     screens a price drops the word FLUX - the number is already in the Flux
     colour under a header that says FLUX BANKED. Without that, "AMPLIFIER II"
     and "2200 FLUX" collide on a 280-wide phone. */
  var gutter = fit(cssW * 0.20, 56, 78);
  var textW = w - gutter - 16;

  return {
    m:m, x0:x0, w:w,
    titleSize:titleSize, titleY:titleY, subY:subY,
    subSize: fit(cssW * 0.029, 10, 13),
    listTop:listTop, slot:cardH + gap, cardH:cardH,
    gutter:gutter, textW:textW,
    compact: textW < 200,
    glyphR:    fit(cssW * 0.042, 13, 20),
    nameSize:  fit(cssW * 0.042, 14, 20),
    tagSize:   fit(cssW * 0.030, 11, 14),
    priceSize: fit(cssW * 0.031, 11, 14),
    launch:launch, alt:alt, mute:mute
  };
}

/* The cheapest thing you do not own and could buy next. Shown when the run
   ends, because the moment you have just banked Flux is the moment the next
   unlock actually means something - and "250 more" is a reason to press play
   that a bare balance is not. */
function nextUnlock(){
  var best = null, i, c;
  for(i=0;i<CORES.length;i++){
    c = CORES[i];
    if(c.cost > 0 && !owns(c.id) && (!best || c.cost < best.cost)) best = {name:c.name, cost:c.cost};
  }
  for(i=0;i<SHOP.length;i++){
    var it = SHOP[i];
    if(it.cost > 0 && !ownsItem(it.id) && !itemLocked(it) && (!best || it.cost < best.cost)){
      best = {name:it.name, cost:it.cost};
    }
  }
  return best;
}

/* One line for what you have, what it is nearly enough for, and whether an
   amplifier padded it - composed longest-first and trimmed until it fits, so a
   280-wide phone drops the least important part instead of overflowing. */
function bankedLine(maxW, size){
  var flux = getFlux();
  var base = flux + ' BANKED';
  var nx = nextUnlock(), mul = fluxMul();
  var goal = '', amp = '';
  if(nx){
    var need = nx.cost - flux;
    goal = (need > 0) ? ('   \u00b7   ' + need + ' TO ' + nx.name)
                      : ('   \u00b7   ENOUGH FOR ' + nx.name);
  }
  if(mul > 1) amp = '   \u00b7   x' + mul.toFixed(2);
  var tries = [base+goal+amp, base+goal, base+amp, base];
  for(var i=0;i<tries.length;i++){
    if(textWidth(tries[i], size, 700, 1.5) <= maxW) return tries[i];
  }
  return base;
}

/* Width of a tracked string, matching exactly what text() will draw. Lets a
   layout ask whether something fits before committing to drawing it. */
function textWidth(str, size, weight, track){
  ctx.font = (weight||700)+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  if(!track) return ctx.measureText(str).width;
  var t = 0;
  for(var i=0;i<str.length;i++) t += ctx.measureText(str[i]).width + track;
  return t - track;
}

/* Counts the lines wrapText would produce, without drawing any of them. Kept
   next to it so the two cannot disagree about where a break falls. */
function wrapCount(str, size, maxW){
  ctx.font = '600 '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  var words = str.split(' '), line = '', n = 1;
  for(var i=0;i<words.length;i++){
    var test = line ? line+' '+words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){ n++; line = words[i]; }
    else line = test;
  }
  return n;
}

function shopPortraitLayout(){
  var tabH = fit(cssH * 0.050, 44, 56);          // 44 is the touch minimum
  var pad = Math.round(cssH * 0.022);
  var L = portraitFrame(pad + tabH + pad, 4, 124);
  L.tab = { y:L.subY + pad, h:tabH, w:(L.w - 12) / 3, step:(L.w - 12) / 3 + 6 };
  L.tabSize = fit(cssW * 0.032, 11, 15);
  return L;
}
/* One place decides what the right-hand label says, so the drawing and the
   width test can never disagree about it. */
function shopPortraitLabel(it, L, own, eq, lock){
  if(it.kind === 'boost'){
    if(own) return 'ACTIVE';
    if(lock) return 'LOCKED';
  } else {
    if(eq) return 'EQUIPPED';
    if(own) return 'EQUIP';
  }
  return L.compact ? String(it.cost) : (it.cost + ' FLUX');
}
function shopPortraitCard(i){
  var L = shopPortraitLayout();
  return { x:L.x0, y:L.listTop + i*L.slot, w:L.w, h:L.cardH };
}
function shopPortraitTab(i){
  var L = shopPortraitLayout();
  return { x:L.x0 + i*L.tab.step, y:L.tab.y, w:L.tab.w, h:L.tab.h };
}

function drawShopPortrait(){
  var L = shopPortraitLayout();
  ctx.fillStyle = '#03050e';
  ctx.fillRect(0, 0, cssW, cssH);

  var flux = getFlux();
  text('SHOP', L.x0, L.titleY, L.titleSize, C.text, 'left', 900, 1, 4);
  text(String(flux), L.x0 + L.w, L.titleY, L.titleSize, C.scrap, 'right', 900, 1, 1);
  text(SHOP_TABS[G.shopTab||0].hint, L.x0, L.subY, L.subSize, C.dim, 'left', 600, 0.75, 0.3);
  text('FLUX BANKED', L.x0 + L.w, L.subY, L.subSize, C.dim, 'right', 700, 0.7, 2);

  var t, tr;
  for(t=0;t<SHOP_TABS.length;t++){
    tr = shopPortraitTab(t);
    var on = ((G.shopTab||0) === t);
    ctx.fillStyle = on ? hexA(C.player, 0.16) : 'rgba(255,255,255,0.04)';
    roundRect(tr.x, tr.y, tr.w, tr.h, 10); ctx.fill();
    ctx.strokeStyle = on ? C.player : 'rgba(234,242,255,0.16)';
    ctx.lineWidth = on ? 2 : 1.5;
    roundRect(tr.x, tr.y, tr.w, tr.h, 10); ctx.stroke();
    text(SHOP_TABS[t].label, tr.x + tr.w/2, tr.y + tr.h/2, L.tabSize,
         on ? C.text : C.dim, 'center', 800, 1, 1.5);
  }

  var items = shopTabItems(G.shopTab||0);
  var trail = equippedTrail(), arena = equippedArena();
  for(var i=0;i<items.length;i++){
    var it = items[i], r = shopPortraitCard(i);
    var own = ownsItem(it.id);
    var eq = (it.id === trail || it.id === arena);
    var lock = itemLocked(it);
    var afford = flux >= it.cost;
    var live = own || (afford && !lock);
    var ca = live ? 1 : 0.5;

    ctx.fillStyle = eq ? hexA(C.player,0.11) : 'rgba(255,255,255,0.04)';
    roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
    ctx.strokeStyle = eq ? C.player : 'rgba(234,242,255,0.14)';
    ctx.lineWidth = eq ? 2.5 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 14); ctx.stroke();

    shopGlyph(it, r.x + L.gutter/2, r.y + r.h/2, ca);

    var tx = r.x + L.gutter, ty = r.y + r.h*0.36;
    text(it.name, tx, ty, L.nameSize, own?C.text:'rgba(234,242,255,0.8)', 'left', 900, ca, 0.8);
    wrapText(it.tag, tx, r.y + r.h*0.62, L.tagSize, C.dim,
             L.textW, L.tagSize*1.35, 'left', ca*0.8);

    var label = shopPortraitLabel(it, L, own, eq, lock);
    var lcol = (label === 'ACTIVE') ? C.scrap
             : (label === 'EQUIPPED') ? C.player
             : (label === 'EQUIP') ? C.dim
             : (label === 'LOCKED') ? 'rgba(234,242,255,0.32)'
             : (afford ? C.scrap : 'rgba(234,242,255,0.32)');
    var lw = (label === 'ACTIVE' || label === 'EQUIPPED') ? 900 : 800;
    text(label, r.x + r.w - 16, ty, L.priceSize, lcol, 'right', lw, 1, 1.2);
  }

  if(G.menuMsgT > 0){
    text(G.menuMsg, cssW/2, L.launch.y - 14, L.tagSize, '#ff5f7a', 'center', 800,
         clamp(G.menuMsgT*2, 0, 1), 2);
  }

  var LB = L.launch, pulse = 0.6 + 0.4*Math.sin(G.uiT*4);
  ctx.fillStyle = hexA(C.player, 0.13);
  roundRect(LB.x, LB.y, LB.w, LB.h, 12); ctx.fill();
  ctx.strokeStyle = hexA(C.player, pulse); ctx.lineWidth = 2;
  roundRect(LB.x, LB.y, LB.w, LB.h, 12); ctx.stroke();
  text('LAUNCH', LB.x + LB.w/2, LB.y + LB.h/2, Math.max(15, L.nameSize), C.text, 'center', 900, 1, 3);

  var AB = L.alt;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(AB.x, AB.y, AB.w, AB.h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(234,242,255,0.26)'; ctx.lineWidth = 2;
  roundRect(AB.x, AB.y, AB.w, AB.h, 12); ctx.stroke();
  text('CORES', AB.x + AB.w/2, AB.y + AB.h/2, L.tabSize, C.text, 'center', 800, 1, 1.5);

  drawBtn(L.mute, (A.muted||A.forced) ? 'muted' : 'sound');
}

/* Taps land in CSS pixels here, because that is the space this was drawn in -
   the same split the rotate prompt already makes. */
function handleShopPortrait(){
  var x = IN.clickCssX, y = IN.clickCssY;
  var L = shopPortraitLayout();
  function hit(r){ return x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h; }

  IN.swallow = true;            // this screen owns the whole viewport
  if(hit(L.mute)){ A.setMute(!A.muted); A.sUi(); return; }
  if(hit(L.launch)){ restart(); return; }
  if(hit(L.alt)){ openCores(); return; }

  var t;
  for(t=0;t<SHOP_TABS.length;t++){
    if(hit(shopPortraitTab(t))){
      if((G.shopTab||0) !== t){ G.shopTab = t; A.sUi(); }
      return;
    }
  }
  var items = shopTabItems(G.shopTab||0);
  for(var i=0;i<items.length;i++){
    if(!hit(shopPortraitCard(i))) continue;
    var it = items[i];
    if(!ownsItem(it.id)) tryBuy(it);
    else if(it.kind !== 'boost' && it.id !== equippedTrail() && it.id !== equippedArena()){
      equipItem(it.id); A.sUi();
    }
    return;
  }
}

/* ---------------------------- rotate prompt ---------------------------- */
/* The arena is a fixed 16:9 field scaled to fit, so a portrait phone gets a
   letterboxed strip about a third of the screen tall. Ask for landscape - but
   never trap anyone: orientation can be locked at the OS level, so the prompt
   is always dismissable and the run continues underneath. */
function needsRotate(){
  if(!TOUCH_CAPABLE || rotateDismissed || G.adBusy) return false;
  /* The prompt exists because the ARENA needs landscape. Both meta screens
     now lay themselves out for portrait, so asking someone to rotate in order
     to read a menu that already fits would just be in the way. */
  if(G.mode === 'shop' || G.mode === 'cores' || G.mode === 'over') return false;
  return cssH > cssW * 1.05;          // margin stops it flapping near square
}

/* One layout, used by both the drawing and the hit test. They were computed
   from different origins before, which put the button on top of the title. The
   unit is capped so a tablet does not scale the lockup off the bottom. */
function rotateLayout(){
  var u = Math.min(cssW, cssH) / 100;
  /* The unit comes off the narrow edge, but the lockup is laid out DOWN the
     screen - so a short viewport has to shrink it or the dismiss button walks
     off the bottom. Everything below centre is 52*uc plus the button plus a
     margin, and that has to fit in the lower half. A 360x400 frame put the
     button 27px past the bottom edge before this. Real phones are nowhere near
     the limit, so none of them change. */
  var uc = Math.max(2, Math.min(u, 5, (cssH/2 - 52) / 52));
  var cy = cssH/2 - 14*uc;
  /* 44 is the floor every touch guideline agrees on, and 11*uc only clears it
     above a ~400px narrow edge - so on a 375-wide phone this button was 41px
     and the one control on the screen was the one under the minimum. */
  var bh = Math.max(44, 11*uc);
  var bw = Math.min(cssW*0.62, 58*uc);
  /* Last resort below the size the shrink can rescue: crowded text is ugly,
     but a dismiss button under the fold is a trap - the prompt swallows every
     tap, so an unreachable button means an unplayable game. Keep it on screen. */
  var by = Math.min(cy + 66*uc, cssH - bh - 8);
  return { u:u, uc:uc, cy:cy,
           titleY: cy + 46*uc,
           subY:   cy + 57*uc,
           btn: { x:(cssW-bw)/2, y:by, w:bw, h:bh } };
}
function rotateBtn(){ return rotateLayout().btn; }

function drawRotate(){
  var L = rotateLayout(), uc = L.uc, cx = cssW/2, cy = L.cy;
  /* Over the arena the backdrop stays a little translucent, so the run reads
     as still there behind the prompt. Over a menu that hint is just noise: a
     card grid showing through at 6% is a smudge rather than depth, and the
     menu is not a thing you are in the middle of. */
  var overMenu = (G.mode === 'shop'  || G.mode === 'cores' || G.mode === 'over' ||
                  G.mode === 'levelup' || G.mode === 'revive');
  ctx.fillStyle = overMenu ? '#03050e' : 'rgba(3,5,14,0.94)';
  ctx.fillRect(0, 0, cssW, cssH);

  // phone turning from portrait to landscape, on a loop
  var t = (G.uiT * 0.5) % 1;
  var e = t < 0.45 ? 0 : (t < 0.7 ? (t-0.45)/0.25 : 1);
  e = e*e*(3-2*e);                                   // smoothstep
  var ang = -Math.PI/2 * e;
  var pw = 15*uc, ph = 26*uc;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.fillStyle = hexA(C.player, 0.10);
  roundRect(-pw, -ph, pw*2, ph*2, 3.2*uc); ctx.fill();
  ctx.strokeStyle = C.player; ctx.lineWidth = Math.max(2, 0.7*uc);
  roundRect(-pw, -ph, pw*2, ph*2, 3.2*uc); ctx.stroke();
  ctx.strokeStyle = hexA(C.player, 0.30); ctx.lineWidth = Math.max(1, 0.35*uc);
  roundRect(-pw*0.74, -ph*0.80, pw*1.48, ph*1.60, 1.4*uc); ctx.stroke();
  ctx.restore();

  // arc arrow sweeping the same quarter turn
  var r = ph * 1.5;
  ctx.strokeStyle = hexA(C.scrap, 0.85);
  ctx.lineWidth = Math.max(2, 0.6*uc);
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI*0.92, -Math.PI*0.30); ctx.stroke();
  var ah = -Math.PI*0.30, ax = cx + Math.cos(ah)*r, ay = cy + Math.sin(ah)*r;
  ctx.fillStyle = C.scrap;
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(ah + Math.PI/2);
  ctx.beginPath();
  ctx.moveTo(0, 2.2*uc); ctx.lineTo(-1.9*uc, -1.6*uc); ctx.lineTo(1.9*uc, -1.6*uc);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  text('ROTATE YOUR DEVICE', cx, L.titleY, Math.max(15, 5.2*uc), C.text, 'center', 900, 1, 0.22*uc);
  text('Magnetar is built for landscape', cx, L.subY, Math.max(11, 2.9*uc), C.dim, 'center', 600, 0.8, 0.05*uc);

  var b = L.btn;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(b.x, b.y, b.w, b.h, b.h*0.28); ctx.fill();
  ctx.strokeStyle = 'rgba(234,242,255,0.30)'; ctx.lineWidth = 2;
  roundRect(b.x, b.y, b.w, b.h, b.h*0.28); ctx.stroke();
  text('Play anyway', b.x + b.w/2, b.y + b.h/2, Math.max(12, 3.4*uc), C.dim, 'center', 700, 0.85, 0.5);
}

/* ------------------------------- banner -------------------------------- */
/* Death screen only. The ad requirements forbid banners during gameplay and
   ask that they sit clear of the game's own buttons, so this lives in the
   empty band below the game-over panel and never appears anywhere else.
   Space is reserved as soon as we know a banner *could* fill, so a failed
   fill does not make the panel jump. */
var BANNER = {
  ID:'mgn-banner',
  wrap:null, el:null,
  shown:false, reserved:false, requesting:false, filled:false, screen:'', token:0,
  w:0, h:0, lastReq:-1e9, fails:0,

  init:function(){
    this.wrap = document.getElementById('mgn-banner-wrap');
    this.el = document.getElementById(this.ID);
  },

  /* Each screen leaves the band in a different place. */
  bandTop:function(){ return (G.mode === 'cores' || G.mode === 'shop') ? 600 : 582; },

  /* The portrait death screen reserves its band in CSS pixels rather than
     inside the letterboxed field, so it is the layout that says where the
     strip starts. */
  bandTopCss:function(){
    if(portraitUI() && G.mode === 'over') return overPortraitLayout().bandY;
    return offY + this.bandTop()*scale;
  },

  /* Largest supported size that fits under the panel, or null. */
  pick:function(){
    var labelH = 14, pad = 10;
    var top = this.bandTopCss();
    var avail = cssH - top - pad;
    if(cssW >= 768 && avail >= 90 + labelH) return [728,90];
    if(cssW >= 500 && avail >= 60 + labelH) return [468,60];
    if(cssW >= 340 && avail >= 50 + labelH) return [320,50];
    return null;
  },

  available:function(){
    return !!(window.CG && window.CG.ready && window.CG.bannersOk &&
              window.CG.adsOk && this.fails < 3 && this.pick());
  },

  place:function(size){
    if(!this.wrap) return;
    var labelH = 14;
    var top = this.bandTopCss();
    var room = cssH - top;
    this.el.style.width = size[0]+'px';
    this.el.style.height = size[1]+'px';
    this.wrap.style.left = Math.round((cssW - size[0])/2)+'px';
    this.wrap.style.top = Math.round(top + Math.max(0,(room - size[1] - labelH)/2))+'px';
  },

  /* Reserve the space immediately, but only reveal the labelled container once
     an ad has actually been filled into it - otherwise the player sees an
     ADVERTISEMENT label over an empty box while the request is in flight. */
  show:function(){
    if(!this.wrap) return;
    var size = this.pick();
    if(!size || !this.available()){ this.hide(); return; }
    this.reserved = true;
    this.screen = G.mode;
    this.place(size);

    if(this.requesting) return;                     // one in flight; wait for it
    var now = performance.now(), self = this;
    var sameSize = (this.w === size[0] && this.h === size[1]);
    if(sameSize && this.filled){                    // already filled at this size
      this.wrap.className = 'on'; this.shown = true; return;
    }
    // The SDK enforces a refresh floor; staying well clear of it avoids
    // burning requests on bannerCooldown errors. Stay blank until it lifts.
    if(sameSize && now - this.lastReq < 61000) return;

    this.w = size[0]; this.h = size[1];
    this.filled = false;
    this.lastReq = now;
    this.requesting = true;
    // A hide() between request and response invalidates this token, so a
    // response for the old screen can never reveal an emptied container.
    var tok = ++this.token;
    try{
      window.CG.sdk.banner.requestBanner({ id:this.ID, width:size[0], height:size[1] })
        .then(function(){
          if(self.token !== tok) return;
          self.requesting = false; self.fails = 0; self.filled = true;
          if(self.reserved && self.wrap){ self.wrap.className = 'on'; self.shown = true; }
        })
        .catch(function(e){
          if(self.token !== tok) return;   // belongs to a superseded request
          self.requesting = false; self.fail(e && e.code);
        });
    }catch(e){ this.requesting = false; this.fail('threw'); }
  },

  /* No fill: collapse the container rather than leave an empty rectangle.
     The reserved space stays, so the panel does not jump. */
  fail:function(code){
    // Same as ads: in basic launch banners are off, so stop asking entirely
    // rather than reserving space for a slot that can never fill.
    if(code === 'bannersDisabledBasicLaunch'){
      try{ window.CG.bannersOk = false; }catch(e){}
      this.shown = false; this.reserved = false; this.filled = false;
      if(this.wrap) this.wrap.className = '';
      return;
    }
    if(code !== 'bannerCooldown') this.fails++;
    this.shown = false;
    this.filled = false;
    if(this.wrap) this.wrap.className = '';
  },

  hide:function(){
    this.shown = false;
    this.reserved = false;
    this.filled = false;
    this.screen = '';
    this.token++;              // orphan any in-flight request
    this.requesting = false;   // ...and never let a hung one wedge the next
    if(this.wrap) this.wrap.className = '';
    // The container is now empty, so the next death has to request again -
    // otherwise the size check would short-circuit and show a labelled but
    // blank box. If that request lands inside the SDK's refresh floor it
    // returns bannerCooldown and fail() simply collapses the container.
    this.w = 0; this.h = 0;
    try{
      if(window.CG.ready && window.CG.sdk.banner) window.CG.sdk.banner.clearBanner(this.ID);
    }catch(e){}
  }
};

function syncBanner(){
  // Menus only - never during gameplay, and never behind a video ad (the SDK
  // rejects that with videoAdPlaying anyway). The core menu is a shop, which
  // the ad requirements list as an allowed placement.
  var want = (G.mode === 'over' || G.mode === 'cores' || G.mode === 'shop') && !G.adBusy;
  /* The portrait meta screens use the full viewport, so there is no band left
     to put a banner in. Overlaying one on the layout would put an ad against a
     live button, which the ad requirements specifically forbid. */
  if(portraitUI() && (G.mode === 'shop' || G.mode === 'cores')) want = false;
  if(want){
    // The two screens park the band at different heights, so moving between
    // them has to re-place rather than reuse the old slot.
    if(BANNER.reserved && BANNER.screen !== G.mode) BANNER.hide();
    // Retry while the space is reserved but nothing is on screen yet; show()
    // rate-limits itself, so this cannot spam the SDK.
    if(!BANNER.reserved || (!BANNER.shown && !BANNER.requesting)) BANNER.show();
    else if(BANNER.shown) BANNER.place([BANNER.w, BANNER.h]);   // follow resizes
  } else if(BANNER.reserved || BANNER.shown){
    BANNER.hide();
  }
}

/* -------------------------------- ads ---------------------------------- */
function reviveBtns(){
  var by = 186;
  return {
    yes:{x:VW/2-262, y:by+192, w:300, h:60},
    no: {x:VW/2+42,  y:by+192, w:220, h:60}
  };
}

function drawRevive(){
  ctx.fillStyle='rgba(3,5,14,0.80)';
  ctx.fillRect(0,0,VW,VH);

  var by=186, bw=620, bx=VW/2-bw/2, bh=330;
  ctx.fillStyle='rgba(255,255,255,0.048)';
  roundRect(bx,by,bw,bh,22); ctx.fill();
  ctx.strokeStyle=hexA(C.player,0.36); ctx.lineWidth=2;
  roundRect(bx,by,bw,bh,22); ctx.stroke();

  text('CORE LOST', VW/2, by+52, 26, '#ff5f7a', 'center', 900, 1, 5);
  text('WAVE '+G.wave+'    '+G.score+' PTS', VW/2, by+82, 12, C.dim, 'center', 700, 0.7, 3);

  hr(bx+PAD+10, bx+bw-PAD-10, by+108, 0.10);

  text('Watch a short ad to get back in?', VW/2, by+142, 21, C.text, 'center', 800, 1, 0.5);
  text('Optional \u2014 declining keeps every point and every Flux you earned.',
       VW/2, by+168, 12, C.dim, 'center', 600, 0.7, 0.4);

  var b = reviveBtns();
  var hy = IN.has && inRect(IN.x,IN.y,b.yes);
  ctx.fillStyle = hexA(C.player, hy?0.24:0.13);
  roundRect(b.yes.x,b.yes.y,b.yes.w,b.yes.h,14); ctx.fill();
  ctx.strokeStyle = hexA(C.player, hy?1:0.7); ctx.lineWidth=2;
  roundRect(b.yes.x,b.yes.y,b.yes.w,b.yes.h,14); ctx.stroke();
  text('WATCH AD TO REVIVE', b.yes.x+b.yes.w/2, b.yes.y+24, 17, C.text, 'center', 900, 1, 1.5);
  text('2 lives, back where you fell   \u00b7   press Y',
       b.yes.x+b.yes.w/2, b.yes.y+44, 10, C.dim, 'center', 700, 0.65, 0.6);

  var hn = IN.has && inRect(IN.x,IN.y,b.no);
  ctx.fillStyle = hn?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.04)';
  roundRect(b.no.x,b.no.y,b.no.w,b.no.h,14); ctx.fill();
  ctx.strokeStyle = 'rgba(234,242,255,'+(hn?0.5:0.24)+')'; ctx.lineWidth=2;
  roundRect(b.no.x,b.no.y,b.no.w,b.no.h,14); ctx.stroke();
  text('NO THANKS', b.no.x+b.no.w/2, b.no.y+24, 17, C.text, 'center', 800, 1, 2);
  text('press N', b.no.x+b.no.w/2, b.no.y+44, 10, C.dim, 'center', 700, 0.65, 1.5);

  // The docs ask for a visible timer on a rewarded request.
  var frac = clamp(G.reviveT/REVIVE_SECONDS, 0, 1);
  var cx = VW/2, cy = by+bh-32;
  ctx.strokeStyle='rgba(234,242,255,0.14)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx-16,cy,11,0,TAU); ctx.stroke();
  ctx.strokeStyle=C.scrap; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx-16,cy,11,-Math.PI/2,-Math.PI/2+TAU*frac); ctx.stroke();
  text(Math.ceil(Math.max(0,G.reviveT))+'s', cx+4, cy, 12, C.dim, 'left', 800, 0.7, 1);
}

function drawAdBusy(){
  ctx.fillStyle='rgba(3,5,14,0.90)';
  ctx.fillRect(0,0,VW,VH);
  var cx=VW/2, cy=VH/2-8;
  ctx.strokeStyle='rgba(234,242,255,0.14)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(cx,cy,26,0,TAU); ctx.stroke();

function drawPaused(){

/* --------------------------------- UI ---------------------------------- */
function handleUI(){
  if(!IN.clicked) return;
  var x = IN.clickX, y = IN.clickY;
  IN.clicked = false;
  if(G.adBusy){ IN.swallow = true; return; }   // the overlay blocks everything

  if(needsRotate()){
    // Hit-tested in CSS pixels, because that is the space it was drawn in.
    var rb = rotateBtn();
    if(IN.clickCssX >= rb.x && IN.clickCssX <= rb.x+rb.w &&
       IN.clickCssY >= rb.y && IN.clickCssY <= rb.y+rb.h){
      rotateDismissed = true;
    }
    IN.swallow = true;   // never let a tap fall through to the game underneath
    return;
  }

  if(portraitUI() && G.mode === 'shop'){ handleShopPortrait(); return; }
  if(portraitUI() && G.mode === 'cores'){ handleCoresPortrait(); return; }
  if(portraitUI() && G.mode === 'over'){ handleOverPortrait(); return; }

  if(inRect(x,y,BTN_MUTE)){ A.setMute(!A.muted); A.sUi(); IN.swallow=true; return; }
  if(inRect(x,y,BTN_PAUSE)){ togglePause(); IN.swallow=true; return; }

  if(G.mode==='levelup'){
    for(var i=0;i<G.cards.length;i++){
      if(inRect(x,y,cardRect(i))){ chooseUpgrade(i); IN.swallow=true; return; }
    }
    return;
  }
  if(G.mode==='revive'){
    var rb = reviveBtns();
    if(inRect(x,y,rb.yes)){ takeRevive(); IN.swallow=true; return; }
    if(inRect(x,y,rb.no)){  finishRun();  IN.swallow=true; return; }
    return;
  }
  if(G.mode==='over'){
    var ob = overBtns();
    if(inRect(x,y,ob.cores)){ openCores(); IN.swallow=true; return; }
    if(inRect(x,y,ob.shop)){  openShop();  IN.swallow=true; return; }
    if(inRect(x,y,ob.play)){
      if((G.overT||0) > 0.35){ restart(); IN.swallow=true; }
      return;
    }
    if(!BANNER.reserved && (G.overT||0) > 0.55){ restart(); IN.swallow=true; }
    return;
  }
  if(G.mode==='shop'){
    var SL = shopLayout();
    if(inRect(x,y,SL.launch)){ restart();   IN.swallow=true; return; }
    if(inRect(x,y,SL.alt)){    openCores(); IN.swallow=true; return; }
    for(var si=0; si<SHOP.length; si++){
      if(!inRect(x,y,shopCardRect(si))) continue;
      var si2 = SHOP[si];
      if(!ownsItem(si2.id)) tryBuy(si2);
      else if(si2.kind !== 'boost' && si2.id !== equippedTrail() && si2.id !== equippedArena()){
        equipItem(si2.id); A.sUi();
      }
      IN.swallow=true;
      return;
    }
    return;
  }
  if(G.mode==='cores'){
    if(inRect(x,y,coresLayout().alt)){ openShop(); IN.swallow=true; return; }
    if(inRect(x,y,launchRect())){ restart(); IN.swallow=true; return; }
    for(var ci=0; ci<CORES.length; ci++){
      if(!inRect(x,y,coreCardRect(ci))) continue;
      var c = CORES[ci];
      if(owns(c.id)){
        if(c.id!==selectedCore()){ equipCore(c.id); A.sUi(); }
      } else if(buyCore(c.id)){
        equipCore(c.id);
        A.sLevel();
        G.boughtT = G.uiT;
      } else {
        A.tone(150,0.20,'square',0.09,100);   // not enough Flux
      }
      IN.swallow=true;
      return;
    }
    return;
  }
  if(G.paused){ G.paused=false; IN.swallow=true; A.sUi(); return; }
}

/* -------------------------------- loop --------------------------------- */
var STEP = 1/120, acc = 0, last = 0;

function frame(now){
  requestAnimationFrame(frame);
  if(!last) last = now;
  var rdt = (now-last)/1000; last = now;
  if(rdt > 0.25) rdt = 0.25;

  if(!G.adBusy) A.tick();
  G.uiT += rdt;

  /* These three are presentation, not simulation, so they tick on real time.
     Decayed inside update() they froze whenever the sim stopped - and since
     you almost always take a hit in the moments before dying, the red damage
     flash stayed painted at full strength over the death screen and every
     menu reached from it. */
  G.flash    = Math.max(0, G.flash    - rdt*2.4);
  G.dmgFlash = Math.max(0, G.dmgFlash - rdt*1.8);
  G.chroma   = Math.max(0, G.chroma   - rdt*1.4);
  G.chargeT  = Math.max(0, G.chargeT  - rdt*1.6);
  /* One hint at a time, and only once the last has cleared - the point is to
     reduce what you have to take in, not to add a second thing to read. */
  if(G.hintT > 0) G.hintT -= rdt;
  else if(G.hintQ && G.hintQ.length){ G.hintTxt = G.hintQ.shift(); G.hintT = HINT_SECONDS; }
  if(G.mode==='over') G.overT = (G.overT||0) + rdt;
  if(G.menuMsgT > 0) G.menuMsgT -= rdt;

  handleUI();
  syncBanner();

  // Rotating back to landscape offers the prompt again on a later flip.
  if(cssW >= cssH) rotateDismissed = false;
  var rot = needsRotate();
  if(rot !== window.__rotWas){
    window.__rotWas = rot;
    if(window.CG){
      if(rot) window.CG.gameplayStop();
      else if(G.mode==='play' || G.mode==='intro') window.CG.gameplayStart();
    }
  }

  var sim = (G.mode==='play' || G.mode==='intro' || G.mode==='levelup' || G.mode==='dying');
  if(G.paused || G.adBusy || rot) sim = false;

  if(G.mode==='dying'){
    G.deathT += rdt;
    if(!G.postDeath && G.deathT > 1.15){ G.postDeath = true; afterDeath(); }
  }
  if(G.mode==='revive' && !G.adBusy){
    G.reviveT -= rdt;
    if(G.reviveT <= 0) finishRun();   // silence declines, it never nags
  }
  if(G.adMsgT > 0) G.adMsgT -= rdt;

  if(sim){
    if(G.hitStop > 0){
      G.hitStop -= rdt;
    } else {
      G.timeScale = (G.mode==='levelup') ? 0.16 : (G.mode==='dying' ? 0.25 : 1);
      acc += rdt * G.timeScale;
      var steps = 0;
      while(acc >= STEP && steps < 12){ update(STEP); acc -= STEP; steps++; }
      if(acc > STEP*12) acc = 0;
    }
  } else {
    acc = 0;
    A.setHum(0,0);
  }

  render(rdt);
}

/* -------------------------- CrazyGames SDK ----------------------------- */
/* The game is fully playable with no SDK: store() falls back to localStorage
   and every call below is a guarded no-op. On CrazyGames the SDK gives us
   cloud saves (Flux and unlocks follow the player across devices), gameplay
   analytics, and happytime signals.

   The build flips ENABLE_CG_SDK off for the Artifact copy, whose CSP blocks
   external scripts - loading it there would only log a violation. */
var ENABLE_CG_SDK = true;

window.CG = {
  ready:false, cloud:false, adsOk:false, bannersOk:false, sdk:null,

  init:function(){
    if(!ENABLE_CG_SDK || !document.head) return;
    var s = document.createElement('script');
    s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    // Blocked by CSP, offline, or ad-blocked: stay on localStorage silently.
    s.onerror = function(){};
    s.onload = function(){
      try{
        var SDK = window.CrazyGames && window.CrazyGames.SDK;
        if(!SDK || !SDK.init) return;
        // Every other module throws until init() resolves.
        SDK.init().then(function(){ window.CG.onReady(SDK); })
                  .catch(function(){});
      }catch(e){}
    };
    document.head.appendChild(s);
  },

  onReady:function(SDK){
    // "disabled" means we are on a domain the SDK does not serve; its calls
    // throw there, so we keep the local backend and stay quiet.
    try{ if(SDK.environment === 'disabled') return; }catch(e){ return; }

    this.sdk = SDK;
    this.ready = true;

    // Adopt cloud storage, folding in anything this device saved first.
    try{
      if(SDK.data && typeof SDK.data.getItem === 'function'){
        adoptCloudSave(SDK.data);
        this.cloud = true;
        applyCloudSave();
      }
    }catch(e){}

    // Signing in swaps the account under us, so drop the cache and re-apply.
    try{
      if(SDK.user && SDK.user.addAuthListener){
        SDK.user.addAuthListener(function(){
          refreshCloudSave();
          applyCloudSave();
        });
      }
    }catch(e){}

    /* The portal can mute us at any time. Read it once, then follow changes -
       the player's own mute button deliberately cannot lift this. */
    try{
      if(SDK.game && SDK.game.settings) A.setForcedMute(!!SDK.game.settings.muteAudio);
      if(SDK.game && SDK.game.addSettingsChangeListener){
        SDK.game.addSettingsChangeListener(function(st){
          A.setForcedMute(!!(st && st.muteAudio));
        });
      }
    }catch(e){}

    // A revive button that can never fire is a rejection cause, so find out
    // up front whether ads can actually run for this player.
    try{
      this.adsOk = !!(SDK.ad && SDK.ad.requestAd);
      this.bannersOk = !!(SDK.banner && SDK.banner.requestBanner);
      if(this.adsOk && SDK.ad.hasAdblock){
        SDK.ad.hasAdblock()
          .then(function(blocked){ window.CG.adsOk = !blocked; })
          .catch(function(){ window.CG.adsOk = true; });
      }
    }catch(e){ this.adsOk = false; }

    // The SDK missed the real load, so bracket it now that it can hear us.
    try{ SDK.game.loadingStart(); SDK.game.loadingStop(); }catch(e){}
    if(G.mode==='play' || G.mode==='intro'){ this.gameplayStart(); }
  },

  /* One guarded path for both ad types. The game is blocked from the moment
     of the request (so nothing is clickable underneath) but only muted once
     the ad actually starts, which is what the docs ask for. Both guards exist
     because a game that freezes waiting on an ad is a rejection cause. */
  requestAd:function(type, onDone, onFail){
    var self = this;
    if(!this.ready || !this.sdk.ad || !this.sdk.ad.requestAd){ if(onFail) onFail('nosdk'); return; }
    var settled = false, startGuard = 0, runGuard = 0;
    function settle(ok, code){
      if(settled) return;
      settled = true;
      clearTimeout(startGuard); clearTimeout(runGuard);
      G.adBusy = false;
      A.duck(false);
      if(ok){ if(onDone) onDone(); }
      else { if(onFail) onFail(code||'other'); }
    }
    G.adBusy = true;
    startGuard = setTimeout(function(){ settle(false,'noStart'); }, 8000);
    try{
      this.sdk.ad.requestAd(type, {
        adStarted:function(){
          clearTimeout(startGuard);
          A.duck(true);
          self.gameplayStop();
          runGuard = setTimeout(function(){ settle(false,'noEnd'); }, 120000);
        },
        adFinished:function(){ settle(true); },
        adError:function(e){
          var code = e && e.code;
          /* Basic launch disables ads outright. Without this the rewarded
             revive would be offered on every death and fail every time - a
             button with no functional effect, which is a rejection cause. */
          if(code === 'adsDisabledBasicLaunch') self.adsOk = false;
          settle(false, code);
        }
      });
    }catch(e){ settle(false,'threw'); }
  },

  gameplayStart:function(){ try{ if(this.ready) this.sdk.game.gameplayStart(); }catch(e){} },
  gameplayStop:function(){  try{ if(this.ready) this.sdk.game.gameplayStop();  }catch(e){} },
  happytime:function(){     try{ if(this.ready) this.sdk.game.happytime();     }catch(e){} },
  progress:function(pct){
    try{ if(this.ready) this.sdk.game.reportGameCompletedPercentage(clamp(Math.round(pct),0,100)); }catch(e){}
  }
};

/* Cloud values can land mid-session. Flux, unlocks and best scores are all
   read live so they need nothing; the equipped core is only consulted when a
   run is built. Re-rolling the player mid-run would be theft, so we only
   re-apply while the run is still effectively untouched. */
function applyCloudSave(){
  var core = selectedCore();
  if(P.core === core) return;
  var untouched = (G.mode==='intro') ||
                  (G.mode==='play' && G.wave<=1 && G.score===0 && G.kills===0);
  if(untouched){
    var wasIntro = (G.mode==='intro');
    reset();
    if(!wasIntro && G.mode!=='play'){ G.mode='play'; startWave(1); }
  }
  // Otherwise the cloud core simply takes effect on the next run.
}

window.CG.init();

/* -------------------------------- boot --------------------------------- */
var booted = false;
function boot(){
  if(booted) return;
  booted = true;
  A.init(); A.resume();
  if(window.CG) window.CG.gameplayStart();
}
cv.addEventListener('touchstart', function(){ IN.isTouch = true; }, {passive:true, capture:true});

BANNER.init();
migrateSave();
reset();
requestAnimationFrame(frame);

})();
</script>
