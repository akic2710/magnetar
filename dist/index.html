/* ------------------------------- spawning ------------------------------ */
function addScrap(anywhere){
  var x,y,tries=0;
  do{
    x = rnd(40, VW-40); y = rnd(40, VH-40); tries++;
  } while(tries<12 && len(x-P.x, y-P.y) < (anywhere?120:220));
  scrap.push({ x:x, y:y, vx:rnd(-16,16), vy:rnd(-16,16), r:rnd(5,8), a:rnd(0,TAU), sp:rnd(-2,2), life:0 });
}

function edgePoint(){
  var s = ri(0,3), m = 46;
  if(s===0) return {x:rnd(m,VW-m), y:m};
  if(s===1) return {x:VW-m, y:rnd(m,VH-m)};
  if(s===2) return {x:rnd(m,VW-m), y:VH-m};
  return {x:m, y:rnd(m,VH-m)};
}

/* Player tops out at 400 u/s (240 while holding the magnet), so enemy speeds
   are set relative to that: early waves are comfortably outrunnable, late
   waves close the gap and holding the magnet becomes a real commitment. */
var ETYPE = {
  drone:   {r:14, hp:1, spd:132, xp:1, sc:10,  col:C.drone},
  spinner: {r:12, hp:1, spd:252, xp:1, sc:16,  col:C.spinner},
  shooter: {r:17, hp:2, spd:112, xp:2, sc:28,  col:C.shooter},
  splitter:{r:22, hp:3, spd:96,  xp:3, sc:44,  col:C.splitter},
  brute:   {r:31, hp:9, spd:82,  xp:5, sc:80,  col:C.brute},
  lancer:  {r:19, hp:4, spd:104, xp:3, sc:60,  col:C.lancer},
  boss:    {r:58, hp:44, spd:52, xp:16,sc:400, col:C.boss}
};

/* Six types arrive between waves 2 and 11 and nothing ever named them. Each
   line is the ONE rule that changes what you should do - not flavour, and not
   a stat sheet. The drone is left out on purpose: it is the first thing you
   ever see and it does the obvious thing.

   The shooter and the lancer are the pair that matter most. The whole game
   rests on "their shots are ammunition", and on the single exception to it,
   and neither was ever said out loud. */
var ETYPE_HINT = {
  spinner:  'SPINNER \u2014 fast, and never in a straight line',
  shooter:  'SHOOTER \u2014 its shots are magnetic. Catch them and send them back',
  splitter: 'SPLITTER \u2014 breaks into drones when it dies',
  brute:    'BRUTE \u2014 heavy. Touching one costs a whole heart',
  lancer:   'LANCER \u2014 its spike cannot be caught. Dodge it'
};

function makeEnemy(type, x, y){
  var d = ETYPE[type];
  var wave = Math.max(1,G.wave);
  var hp = d.hp;
  if(type==='boss') hp = 30 + Math.floor(wave/5-1)*20;
  else if(wave>8) hp += Math.floor((wave-8)/3);
  return {
    type:type, x:x, y:y, vx:0, vy:0, r:d.r,
    hp:hp, maxHp:hp, spd:d.spd*(1+Math.min(0.80, wave*0.030)),
    col:d.col, xp:d.xp, sc:d.sc,
    t:rnd(0,10), fire:rnd(0.8,2.2), flash:0, dead:false, charge:0,
    phase:0, phaseT:0, wob:rnd(0,TAU), spawnA:0.6
  };
}

function spawnAt(type, pt){
  var e = makeEnemy(type, pt.x, pt.y);
  enemies.push(e);
  // Queued rather than shown, so two new types in one wave do not overlap.
  if(ETYPE_HINT[type] && !G.seen[type]){
    G.seen[type] = 1;
    G.hintQ.push(ETYPE_HINT[type]);
  }
  waves.push({x:pt.x, y:pt.y, r:6, max:type==='boss'?110:46, life:0.6, col:e.col, w:3});
  return e;
}

function startWave(n){
  G.wave = n;
  G.waveT = 0;
  G.healedThisWave = false;
  // Wave 30 is a deep run; report progress against that as "complete".
  if(window.CG) window.CG.progress(Math.min(100, n/30*100));
  G.spawnQ.length = 0;
  var isBoss = (n % 5 === 0);
  if(isBoss){
    G.waveBannerTxt = 'WAVE ' + n + '  •  GUARDIAN';
    G.spawnQ.push({t:'boss', at:0.35, pt:{x:VW/2, y:120}});
    A.sBoss();
  } else {
    G.waveBannerTxt = 'WAVE ' + n;
    // Gentle first waves (first impression decides bounce rate on a portal),
    // saturating through the mid game, then steady linear growth so late
    // waves keep escalating instead of plateauing.
    var budget = Math.round(3 + 30*(1 - Math.exp(-n/10)) + Math.max(0, n-12)*2.0);

    // Weighted pool: drones thin out as tougher types take over the budget,
    // so wave 25 is not just fifty drones.
    var pool = [{t:'drone', c:1, w:Math.max(1.2, 8 - n*0.32)}];
    if(n>=2) pool.push({t:'spinner',  c:2, w:2.6});
    if(n>=3) pool.push({t:'shooter',  c:3, w:1.8 + n*0.14});
    if(n>=6) pool.push({t:'splitter', c:4, w:1.2 + n*0.12});
    if(n>=8) pool.push({t:'brute',    c:7, w:0.9 + n*0.10});
    if(n>=11) pool.push({t:'lancer',  c:5, w:1.4 + n*0.13});

    var list=[], guard=0;
    while(budget>0 && guard++<160){
      var opts=[], total=0, i;
      for(i=0;i<pool.length;i++) if(pool[i].c<=budget){ opts.push(pool[i]); total+=pool[i].w; }
      if(!opts.length) break;
      var roll = Math.random()*total, p = opts[opts.length-1];
      for(i=0;i<opts.length;i++){ roll -= opts[i].w; if(roll<=0){ p = opts[i]; break; } }
      budget -= p.c; list.push(p.t);
    }
    for(var j=0;j<list.length;j++) G.spawnQ.push({t:list[j], at:j*0.17, pt:edgePoint()});
    A.sWave();
  }
  G.waveBanner = 2.0;
}


/* -------------------------------- effects ------------------------------ */
function spark(x,y,n,col,spdA,spdB,lifeA,lifeB,size){
  for(var i=0;i<n;i++){
    var a=rnd(0,TAU), s=rnd(spdA,spdB);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(lifeA,lifeB),max:0,r:size||3,col:col,drag:2.6});
    parts[parts.length-1].max = parts[parts.length-1].life;
  }
}
function popText(x,y,txt,col,size){
  pops.push({x:x,y:y,txt:txt,col:col||C.text,life:0.9,max:0.9,size:size||22,vy:-42});
}
function ring(x,y,max,col,life,w){
  waves.push({x:x,y:y,r:6,max:max,life:life||0.45,col:col,w:w||3});
}
function shakeIt(v){ G.shake = Math.min(34, G.shake+v); }

/* --------------------------- orbit + magnet ---------------------------- */
function orbitCount(){ return orbit.length; }

function captureInto(kind, x, y, r){
  if(orbit.length >= P.cap) return false;
  orbit.push({kind:kind, ang:0, cur:len(x-P.x,y-P.y), r:r, x:x, y:y, spin:rnd(-4,4), t:0});
  redistribute();
  /* Filling the orbit is the moment the whole verb is building towards, and it
     used to pass in silence - you found out by watching a thin arc change
     colour. One cue, once, on the frame it fills. */
  if(orbit.length >= P.cap && !G.charged){
    G.charged = true;
    G.chargeT = 0.55;
    A.sCharged();
    ring(P.x, P.y, P.orbR*2.8, hexA(C.scrap,0.65), 0.42, 3);
  }
  return true;
}
function redistribute(){
  var n = orbit.length;
  for(var i=0;i<n;i++) orbit[i].slot = i;
}

function doBlast(){
  var n = orbit.length;
  P.blastCool = 0.06;
  if(n===0){
    // tiny courtesy pulse so the verb always answers
    ring(P.x,P.y,52,'rgba(124,243,255,0.5)',0.22,2);
    A.tone(520,0.06,'sine',0.05,760);
    return;
  }
  for(var i=0;i<n;i++){
    var o = orbit[i];
    var ang = P.orbBase + (o.slot||0)*TAU/n;
    var sp = P.blastSpd * (o.kind==='bolt'?1.12:1);
    shots.push({
      x:P.x+Math.cos(ang)*P.orbR, y:P.y+Math.sin(ang)*P.orbR,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      r:o.kind==='bolt'?8:6,
      dmg:(o.kind==='bolt'?3:1) + (P.dmg-1),
      pierce:(o.kind==='bolt'?2:1) + (P.pierce-1),
      bounce:P.bounce, kind:o.kind, life:2.6, a:rnd(0,TAU), hitIds:[]
    });
  }
  orbit.length = 0;
  var power = clamp(n/8, 0, 1.6);
  A.sBlast(power);
  shakeIt(3 + power*7);
  G.pulse = Math.min(1, 0.35 + power*0.5);
  ring(P.x, P.y, 90+power*70, 'rgba(157,251,255,0.55)', 0.34, 3);
  spark(P.x,P.y, 6+Math.round(power*8), C.shot, 120, 420, 0.18, 0.4, 3);
  if(P.repulse>0){
    shots.push({shock:true, x:P.x, y:P.y, r:10, max:120+P.repulse*46, dmg:P.repulse, life:0.34, hitIds:[]});
  }
  if(G.mode==='intro' && n>=2) G.introBlasted = true;
}

/* ------------------------------- combat -------------------------------- */
function damageEnemy(e, dmg, fx, fy){
  if(e.dead) return;
  e.hp -= dmg;
  e.flash = 0.12;
  if(e.type!=='brute' && e.type!=='boss'){
    e.vx += (fx||0)*0.35; e.vy += (fy||0)*0.35;
  }
  if(e.hp<=0){ killEnemy(e); }
  else {
    spark(e.x,e.y,3,e.col,60,200,0.12,0.26,2.4);
    A.sPop(0);
  }
}

function killEnemy(e){
  e.dead = true;
  G.kills++;
  G.combo++; G.comboT = 2.6;
  if(G.combo > G.bestCombo) G.bestCombo = G.combo;
  var mult = 1 + (G.combo-1)*0.12;
  var pts = Math.round(e.sc * mult);
  G.score += pts;
  G.xp += e.xp;

  /* The run stops being "a run" and becomes "the run" the moment it passes
     your own record, so say so then rather than only on the death screen. */
  if(!G.passedBest){
    var pb = parseInt(store('mgn.best')||'0',10);
    if(pb > 0 && G.score > pb){
      G.passedBest = true;
      A.sBest();
      popText(P.x, P.y-54, 'NEW BEST', C.scrap, 28);
      ring(P.x, P.y, 230, hexA(C.scrap,0.65), 0.7, 4);
      G.flash = Math.max(G.flash, 0.35);
    }
  }
  if(G.combo>2) popText(e.x, e.y-8, '+'+pts, C.scrap, 20);

  spark(e.x, e.y, e.type==='boss'?60:(10+Math.round(e.r*0.6)), e.col, 90, 340+e.r*6, 0.25, 0.7, 3.4);
  ring(e.x, e.y, e.r*3.2, e.col, 0.36, 2.5);
  A.sPop(G.combo);
  G.hitStop = Math.max(G.hitStop, e.type==='boss'?0.22:0.035);
  shakeIt(e.type==='boss'?26:(e.type==='brute'?9:3));

  var drops = e.type==='boss'?14:(e.type==='brute'?5:(e.type==='splitter'?4:2));
  for(var i=0;i<drops;i++){
    var a=rnd(0,TAU), d=rnd(10,e.r+16);
    scrap.push({x:e.x+Math.cos(a)*d, y:e.y+Math.sin(a)*d, vx:Math.cos(a)*rnd(40,150), vy:Math.sin(a)*rnd(40,150), r:rnd(5,8), a:rnd(0,TAU), sp:rnd(-3,3), life:0});
  }
  if(e.type==='splitter'){
    for(var k=0;k<3;k++){
      var an = k*TAU/3 + rnd(0,1);
      var s = spawnAt('drone', {x:clamp(e.x+Math.cos(an)*36,30,VW-30), y:clamp(e.y+Math.sin(an)*36,30,VH-30)});
      s.spawnA = 0.18;
    }
  }
  if(e.type==='boss'){
    G.bossRef=null; A.sBig(); G.flash=0.6; G.chroma=1;
    if(window.CG) window.CG.happytime();
    popText(e.x, e.y-30, 'GUARDIAN DOWN', C.scrap, 30);
  }
  P.killsSinceHeal++;
  // Capped at one heal per wave: unbounded kill-based sustain made a
  // fully-upgraded player literally unkillable in long runs.
  if(P.siphon>0 && !G.healedThisWave && P.killsSinceHeal >= 30/P.siphon){
    P.killsSinceHeal = 0; G.healedThisWave = true;
    if(P.hp < P.maxHp){
      // Clamped: healing a whole heart off a half would overshoot the maximum.
      P.hp = Math.min(P.maxHp, P.hp + 1);
      A.sHeal(); popText(P.x,P.y-34,'+1 LIFE','#78ffa8',22); ring(P.x,P.y,90,'rgba(120,255,168,0.6)',0.5,3);
    }
  }
  checkLevel();
}

/* Damage comes in half hearts. The split is meant to be readable off the
   screen rather than memorised: the things that CHIP at you take half - the
   light swarm running into you, and the magnetic bullets you were supposed to
   be catching - and the things you are meant to actually fear take a whole
   one: a brute or the Guardian landing on you, and the lancer's spike, which
   is the single attack in the game you cannot catch and can only dodge.

   Halves are exact in binary, so hp stays on clean 0.5 steps and `<= 0` is a
   safe death test - no epsilon needed. */
function hurtPlayer(dmg){
  if(P.inv>0 || G.mode!=='play' && G.mode!=='intro') return;
  dmg = dmg || 1;
  P.hp -= dmg;
  /* Invulnerability scales with the hit, and that is what keeps half hearts
     from halving the difficulty. What set the old balance was not the size of
     a hit but the WORST CASE RATE: one heart per 1.35s, or 0.74 hearts a
     second. Half a heart per 0.675s is exactly the same ceiling - so a chip
     buys a shorter breather, a real hit still buys the full one, and the
     pressure the waves were tuned against is unchanged. */
  P.inv = 1.35 * dmg;
  G.combo = 0;
  /* Every bit of feedback scales with the hit, so a chip does not land like a
     killing blow. Losing a heart should still feel like losing a heart. */
  G.dmgFlash = dmg;
  A.sHurt();
  shakeIt(10 + 10*dmg);
  G.hitStop = Math.max(G.hitStop, 0.06 + 0.05*dmg);
  spark(P.x, P.y, Math.round(10 + 12*dmg), '#ff5566', 90, 380, 0.25, 0.6, 3.5);
  ring(P.x, P.y, 90 + 50*dmg, 'rgba(255,80,100,0.7)', 0.5, 4);
  // Orbit lost scales too: a graze should not cost a full release.
  var drop = Math.floor(orbit.length * 0.5 * dmg);
  for(var i=0;i<drop;i++) orbit.pop();
  redistribute();
  if(P.hp <= 0) die();
}

var REVIVE_SECONDS = 8;

/* Death is now only the start of the end-of-run sequence:
     die -> [revive offer] -> finishRun -> [midgame ad] -> game over
   Payout lives in finishRun, not here, so a revived run is not paid twice. */
function die(){
  if(G.ended) return;
  G.ended = true;
  G.mode = 'dying';
  G.deathT = 0;
  G.postDeath = false;
  A.sDead();
  A.setHum(0,0);
  shakeIt(30); G.flash=0.8;
  spark(P.x,P.y,70,C.player,120,520,0.4,1.1,4);
  ring(P.x,P.y,260,hexA(C.player,0.7),0.8,5);
  if(window.CG) window.CG.gameplayStop();
}

/* Only offer a revive on a run worth saving, once per run, and never when we
   know the request cannot succeed - a button that can never work is a
   CrazyGames rejection cause. */
function reviveAvailable(){
  return !!(window.CG && window.CG.ready && window.CG.adsOk && !G.revived && G.wave >= 3);
}
/* The SDK enforces its own 3-minute midgame cap, so this only adds the rules
   it cannot know: not after a trivially short run, and never a second ad in a
   run where the player already sat through a rewarded one. */
function midgameEligible(){
  // One ad opportunity per run. If the player already engaged with the
  // rewarded offer - watched it OR had it fail on them - do not follow it
  // with a second request. Chaining ads is against the ad requirements and
  // is a miserable thing to do to someone who just died.
  return !!(window.CG && window.CG.ready && window.CG.adsOk &&
            !G.watchedAd && !G.adAttempted && G.t >= 45);
}

function afterDeath(){
  if(reviveAvailable()){ G.mode = 'revive'; G.reviveT = REVIVE_SECONDS; }
  else finishRun();
}

function showOver(){ G.mode = 'over'; G.overT = 0; }

function finishRun(){
  if(G.runFinished){ showOver(); return; }
  G.runFinished = true;

  G.fluxEarned = Math.round(fluxFor(G.score, G.wave) * fluxMul());
  addFlux(G.fluxEarned);
  var best = parseInt(store('mgn.best')||'0',10);
  if(G.score > best){ store('mgn.best', String(G.score)); G.newBest = true; }
  var bw = parseInt(store('mgn.bestwave')||'0',10);
  if(G.wave > bw) store('mgn.bestwave', String(G.wave));
  if(G.newBest && window.CG) window.CG.happytime();
  if(window.CG) window.CG.gameplayStop();

  // Death is an allowed midgame placement; the panel appears when it is done.
  if(midgameEligible()) window.CG.requestAd('midgame', showOver, showOver);
  else showOver();
}

function takeRevive(){
  if(G.adBusy || G.revived || G.mode!=='revive') return;
  G.adAttempted = true;
  window.CG.requestAd('rewarded', doRevive, function(code){
    // Never reward on adError - the run simply ends.
    G.adMsg = (code==='unfilled') ? 'NO AD AVAILABLE RIGHT NOW' : 'AD UNAVAILABLE';
    G.adMsgT = 2.2;
    finishRun();
  });
}

function doRevive(){
  G.revived = true;
  G.watchedAd = true;
  G.ended = false;
  G.postDeath = false;
  G.mode = 'play';
  P.hp = Math.max(1, Math.min(2, P.maxHp));
  P.inv = 3.0;
  bolts.length = 0;
  clearArea(300);
  A.sHeal();
  G.flash = 0.7;
  shakeIt(18);
  ring(P.x, P.y, 340, hexA(C.player,0.8), 0.8, 6);
  popText(P.x, P.y-46, 'REVIVED', C.player, 30);
  if(window.CG) window.CG.gameplayStart();
}

/* Buys breathing room, not points. Watching an ad must never move the
   scoreboard or the leaderboard stops meaning anything. */
function clearArea(r){
  for(var i=enemies.length-1;i>=0;i--){
    var e = enemies[i];
    var d = Math.max(1, len(e.x-P.x, e.y-P.y));
    if(e.type==='boss'){
      e.vx += (e.x-P.x)/d*280; e.vy += (e.y-P.y)/d*280;
      continue;
    }
    if(d < r){
      spark(e.x, e.y, 10, e.col, 90, 300, 0.2, 0.5, 3);
      enemies.splice(i,1);
    }
  }
}

function restart(){
  reset();
  G.mode = store('mgn.played')==='1' ? 'play' : 'intro';
  if(G.mode==='play' && G.wave===0) startWave(1);
  A.sUi();
  if(window.CG) window.CG.gameplayStart();
}

function togglePause(){
  if(G.mode!=='play') return;
  G.paused = !G.paused;
  A.sUi();
}

/* ------------------------------ level ups ------------------------------ */
function checkLevel(){
  if(G.xp < G.xpNeed) return;
  G.xp -= G.xpNeed;
  G.level++;
  G.xpNeed = Math.round(9 + G.level*4.6);
  openLevelUp();
}
/* Weighted draw without replacement: each slot is rolled against the weights
   of whatever is still in the pool, so a hand can hold at most one of a given
   upgrade and epics stay scarce even when few cards remain unmaxed. */
function openLevelUp(){
  var pool = [], i;
  for(i=0;i<UPGRADES.length;i++){
    var u = UPGRADES[i];
    if(((G.taken && G.taken[u.id]) || 0) < u.max) pool.push(u);
  }
  if(!pool.length) return;

  var picked = [], best = 0;
  while(picked.length < 3 && pool.length){
    var total = 0, j;
    for(j=0;j<pool.length;j++) total += RARITY[pool[j].r].w;
    var roll = Math.random()*total, chosen = pool.length-1;
    for(j=0;j<pool.length;j++){
      roll -= RARITY[pool[j].r].w;
      if(roll <= 0){ chosen = j; break; }
    }
    if(pool[chosen].r > best) best = pool[chosen].r;
    picked.push(pool[chosen]);
    pool.splice(chosen,1);
  }

  G.cards = picked;
  G.bestRarity = best;
  G.mode = 'levelup';
  G.cardT = 0;
  if(best >= EPIC) A.sEpic(); else A.sLevel();
  G.flash = 0.35 + best*0.12;
}
function chooseUpgrade(i){
  if(G.mode!=='levelup') return;
  var u = G.cards[i];
  if(!u) return;
  if(!G.taken) G.taken = {};
  G.taken[u.id] = (G.taken[u.id]||0)+1;
  u.ap();
  G.mode = 'play';
  G.cards = [];
  A.sUi();
  var rc = RARITY[u.r].col;
  ring(P.x,P.y,150,hexA(rc,0.7),0.55,4);
  popText(P.x, P.y-40, u.name, rc, 24);
}

/* -------------------------------- update ------------------------------- */
function update(dt){
  G.t += dt;

  /* ---- timers / global fx ---- */
  G.shake = Math.max(0, G.shake - G.shake*7*dt - 12*dt);
  G.pulse = Math.max(0, G.pulse - dt*2.2);
  /* flash, dmgFlash and chroma decay in frame() instead - see the note there. */
  G.waveBanner = Math.max(0, G.waveBanner - dt);
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }
  P.inv = Math.max(0, P.inv-dt);
  P.blastCool = Math.max(0, P.blastCool-dt);

  var alive = (G.mode==='play' || G.mode==='intro' || G.mode==='levelup');

  /* ---- intro script ---- */
  if(G.mode==='intro'){
    G.introT += dt;
    if(G.introStep===0 && G.introT>2.1){ G.introStep=1; G.introT=0; }
    if(G.introStep===1 && (G.introPulled || G.introT>7)){ G.introStep=2; G.introT=0; }
    if(G.introStep===2 && (G.introBlasted || G.introT>7)){
      G.introStep=3; G.introT=0;
      // give the player something to shoot before wave 1 starts
      for(var q=0;q<3;q++) spawnAt('drone', edgePoint());
    }
    if(G.introStep===3 && G.introT>1.4){
      G.introStep=4; store('mgn.played','1');
      G.mode='play'; startWave(1);
    }
  }

  /* ---- player movement ---- */
  var kv = keyVector();
  var tx=P.x, ty=P.y, useKeys = kv[2];
  var magHeld = (IN.down || IN.kMag) && alive && G.mode!=='levelup';

  var maxSpd = P.spd * (magHeld ? P.holdMul : 1);
  var dvx, dvy;
  if(!alive){
    dvx = 0; dvy = 0;
  } else if(useKeys){
    dvx = kv[0]*maxSpd; dvy = kv[1]*maxSpd;
  } else if(IN.has){
    var ddx = IN.x-P.x, ddy = IN.y-P.y, dd = len(ddx,ddy);
    if(dd < 4){ dvx=0; dvy=0; }
    else {
      var want = Math.min(maxSpd, dd*7.5);
      dvx = ddx/dd*want; dvy = ddy/dd*want;
    }
  } else { dvx=0; dvy=0; }

  var k = 1-Math.exp(-15*dt);
  P.vx += (dvx-P.vx)*k;
  P.vy += (dvy-P.vy)*k;
  P.x += P.vx*dt; P.y += P.vy*dt;

  var pad = P.r+4;
  if(P.x<pad){ P.x=pad; P.vx*=-0.3; }
  if(P.x>VW-pad){ P.x=VW-pad; P.vx*=-0.3; }
  if(P.y<pad){ P.y=pad; P.vy*=-0.3; }
  if(P.y>VH-pad){ P.y=VH-pad; P.vy*=-0.3; }

  /* ---- magnet + orbit ---- */
  P.orbBase = (P.orbBase||0) + (P.omega + orbit.length*0.02)*dt;
  var fill = orbit.length/Math.max(1,P.cap);
  A.setHum(magHeld?(0.35+fill*0.65):0, fill);

  if(magHeld){
    var pull = 1250*P.pullMul;
    for(var i=0;i<scrap.length;i++){
      var s = scrap[i];
      var dx=P.x-s.x, dy=P.y-s.y, d=len(dx,dy);
      if(d < P.magR && d>0.01){
        var f = pull*(1 - d/P.magR*0.55)/Math.max(28,d);
        s.vx += dx*f*dt; s.vy += dy*f*dt;
        s.vx *= (1-1.6*dt); s.vy *= (1-1.6*dt);
        if(d < P.orbR+12 && orbit.length<P.cap){
          captureInto('scrap', s.x, s.y, s.r);
          scrap.splice(i,1); i--;
          A.sPull();
          G.introPulled = true;
          continue;
        }
      }
    }
    for(var b=0;b<bolts.length;b++){
      var bo = bolts[b];
      if(bo.mag===false) continue;   // lancer spikes cannot be caught
      var bx=P.x-bo.x, by=P.y-bo.y, bd=len(bx,by);
      if(bd < P.magR*1.05 && bd>0.01){
        var bf = pull*1.15*(1 - bd/(P.magR*1.05)*0.5)/Math.max(28,bd);
        bo.vx += bx*bf*dt; bo.vy += by*bf*dt;
        bo.vx *= (1-2.2*dt); bo.vy *= (1-2.2*dt);
        if(bd < P.orbR+12 && orbit.length<P.cap){
          captureInto('bolt', bo.x, bo.y, 8);
          bolts.splice(b,1); b--;
          A.sCatch();
          spark(bo.x,bo.y,5,C.bolt,60,180,0.12,0.3,2.4);
          G.introPulled = true;
          continue;
        }
      }
    }
  }

  // orbit item positions + grind damage
  var n = orbit.length;
  for(var oi=0; oi<n; oi++){
    var o = orbit[oi];
    o.t += dt;
    o.spinA = (o.spinA||0) + o.spin*dt;
    var ang = P.orbBase + (o.slot||0)*TAU/n;
    o.cur = o.cur + (P.orbR-o.cur)*(1-Math.exp(-14*dt));
    o.x = P.x + Math.cos(ang)*o.cur;
    o.y = P.y + Math.sin(ang)*o.cur;
  }
  if(n>0){
    for(var ei=0; ei<enemies.length; ei++){
      var en = enemies[ei];
      if(en.dead || en.spawnA>0) continue;
      for(var oj=orbit.length-1; oj>=0; oj--){
        var ob = orbit[oj];
        if(len(en.x-ob.x, en.y-ob.y) < en.r+ob.r+2){
          damageEnemy(en, P.orbDmg + (ob.kind==='bolt'?1:0), 0, 0);
          spark(ob.x,ob.y,4,C.shot,60,220,0.1,0.25,2.6);
          orbit.splice(oj,1); redistribute();
          n = orbit.length;
          break;
        }
      }
    }
  }

  // static charge
  if(P.stat>0 && orbit.length>0){
    P.statT -= dt;
    if(P.statT<=0){
      P.statT = 1.05/P.stat;
      var best=null, bestD=1e9;
      for(var si=0; si<enemies.length; si++){
        var se=enemies[si];
        if(se.dead||se.spawnA>0) continue;
        var sd=len(se.x-P.x, se.y-P.y);
        if(sd<300 && sd<bestD){ bestD=sd; best=se; }
      }
      if(best){
        zaps.push({x1:P.x,y1:P.y,x2:best.x,y2:best.y,life:0.16,max:0.16});
        damageEnemy(best, P.stat+1, 0, 0);   // epic: scales with stacks
        A.tone(1400,0.07,'square',0.07,600);
      }
    }
  }

  if(IN.justUp){
    if(IN.swallow) IN.swallow = false;
    else if(alive && G.mode!=='levelup') doBlast();
  }
  IN.justUp=false; IN.justDown=false;

  if(orbit.length < P.cap) G.charged = false;

  /* ---- cosmetic wake ---- */
  /* Sampled on the fixed timestep rather than per frame, so the wake is the
     same length on a 60 Hz laptop as on a 165 Hz monitor. */
  if(alive){
    P.trailT -= dt;
    if(P.trailT <= 0){
      P.trailT = 0.018;
      P.trail.unshift({x:P.x, y:P.y, a:P.orbBase});
      while(P.trail.length > 30) P.trail.pop();
    }
  } else if(P.trail.length){
    P.trail.length = 0;
  }

  /* ---- scrap field ---- */
  for(var s2=0; s2<scrap.length; s2++){
    var sc = scrap[s2];
    sc.x += sc.vx*dt; sc.y += sc.vy*dt;
    sc.vx *= (1-0.7*dt); sc.vy *= (1-0.7*dt);
    sc.a += sc.sp*dt;
    if(sc.x<12){sc.x=12;sc.vx=Math.abs(sc.vx)*0.6;}
    if(sc.x>VW-12){sc.x=VW-12;sc.vx=-Math.abs(sc.vx)*0.6;}
    if(sc.y<12){sc.y=12;sc.vy=Math.abs(sc.vy)*0.6;}
    if(sc.y>VH-12){sc.y=VH-12;sc.vy=-Math.abs(sc.vy)*0.6;}
  }
  if(scrap.length < G.scrapCap){
    G.scrapT = (G.scrapT||0) - dt;
    if(G.scrapT<=0){ G.scrapT = 0.35/P.pullMul; addScrap(false); }
  }
  while(scrap.length > G.scrapCap+30) scrap.shift();

  updateEnemies(dt);
  updateBolts(dt);
  updateShots(dt);
  updateWaveFlow(dt);
  updateParticles(dt);
}


/* ------------------------------ enemies -------------------------------- */
/* Half a heart from the swarm, a whole one from the things with weight behind
   them. Anything not listed chips for half. */
var CONTACT_DMG = { brute:1, boss:1 };

var SHOT_SEEK = 330, SHOT_TURN = 7.5;
var LANCE_TELL = 0.85;
var RAGE_AFTER = 22;

/* Stragglers get faster the longer a wave drags on, so a wave can never
   stall into a boring stalemate. Also drives the pace of a run upward. */
function rageMul(){
  if(G.mode!=='play' || G.waveT <= RAGE_AFTER) return 1;
  return 1 + Math.min(0.85, (G.waveT-RAGE_AFTER)*0.05);
}

function updateEnemies(dt){
  var rage = rageMul();
  for(var i=enemies.length-1; i>=0; i--){
    var e = enemies[i];
    if(e.dead){ enemies.splice(i,1); continue; }
    e.t += dt;
    e.flash = Math.max(0, e.flash-dt*6);

    if(e.spawnA>0){
      e.spawnA -= dt;
      continue;
    }

    var es = e.spd * (e.type==='boss' ? 1 : rage);
    var dx = P.x-e.x, dy = P.y-e.y, d = Math.max(0.01, len(dx,dy));
    var ux = dx/d, uy = dy/d;

    if(e.type==='drone'){
      e.vx += ux*es*3.2*dt; e.vy += uy*es*3.2*dt;
      var sp = len(e.vx,e.vy);
      if(sp>es){ e.vx=e.vx/sp*es; e.vy=e.vy/sp*es; }
    }
    else if(e.type==='spinner'){
      e.wob += dt*5.5;
      var px=-uy, py=ux;
      var swirl = Math.sin(e.wob)*0.85;
      e.vx += (ux+px*swirl)*es*3.4*dt;
      e.vy += (uy+py*swirl)*es*3.4*dt;
      var sp2 = len(e.vx,e.vy);
      if(sp2>es){ e.vx=e.vx/sp2*es; e.vy=e.vy/sp2*es; }
    }
    else if(e.type==='shooter'){
      var want = 320;
      var drive = (d-want)/140;
      drive = clamp(drive,-1,1);
      var sx=-uy, sy=ux;
      var strafe = Math.sin(e.t*0.9+e.wob)*0.9;
      e.vx += (ux*drive + sx*strafe)*es*3*dt;
      e.vy += (uy*drive + sy*strafe)*es*3*dt;
      var sp3 = len(e.vx,e.vy);
      if(sp3>es){ e.vx=e.vx/sp3*es; e.vy=e.vy/sp3*es; }
      e.fire -= dt;
      if(e.fire<=0){
        e.fire = rnd(1.7,2.4);
        fireBolt(e, ux, uy, 250, 1);
      }
    }
    else if(e.type==='splitter'){
      e.vx += ux*es*2.6*dt; e.vy += uy*es*2.6*dt;
      var sp4=len(e.vx,e.vy);
      if(sp4>es){ e.vx=e.vx/sp4*es; e.vy=e.vy/sp4*es; }
    }
    else if(e.type==='brute'){
      e.vx += ux*es*2.2*dt; e.vy += uy*es*2.2*dt;
      var sp5=len(e.vx,e.vy);
      if(sp5>es){ e.vx=e.vx/sp5*es; e.vy=e.vy/sp5*es; }
    }
    else if(e.type==='lancer'){
      // Snipes from range with a NON-magnetic spike, so holding the magnet
      // is no longer a free bullet shield. Pure dodge pressure.
      var far = 400;
      var push = clamp((d-far)/150,-1,1);
      var lx=-uy, ly=ux;
      var sway = Math.sin(e.t*0.7+e.wob)*0.7;
      e.vx += (ux*push + lx*sway)*es*2.4*dt;
      e.vy += (uy*push + ly*sway)*es*2.4*dt;
      var sp6 = len(e.vx,e.vy);
      if(sp6>es){ e.vx=e.vx/sp6*es; e.vy=e.vy/sp6*es; }
      if(e.charge>0){
        e.charge -= dt;
        e.aimX = ux; e.aimY = uy;
        if(e.charge<=0){
          fireBolt(e, e.aimX, e.aimY, 660, 1, false);
          A.tone(1500,0.16,'sawtooth',0.10,300);
          e.fire = rnd(2.2,3.2);
        }
      } else {
        e.fire -= dt;
        if(e.fire<=0){ e.charge = LANCE_TELL; e.aimX=ux; e.aimY=uy; A.tone(240,0.5,'triangle',0.06,700); }
      }
    }
    else if(e.type==='boss'){
      updateBoss(e, dt, ux, uy, d);
    }

    e.vx *= (1-1.1*dt); e.vy *= (1-1.1*dt);
    e.x += e.vx*dt; e.y += e.vy*dt;

    var m = e.r+2;
    if(e.x<m){ e.x=m; e.vx=Math.abs(e.vx)*0.5; }
    if(e.x>VW-m){ e.x=VW-m; e.vx=-Math.abs(e.vx)*0.5; }
    if(e.y<m){ e.y=m; e.vy=Math.abs(e.vy)*0.5; }
    if(e.y>VH-m){ e.y=VH-m; e.vy=-Math.abs(e.vy)*0.5; }

    // contact with player
    if(G.mode!=='levelup' && len(P.x-e.x, P.y-e.y) < P.r + e.r*0.86){
      hurtPlayer(CONTACT_DMG[e.type] || 0.5);
      var kx = (P.x-e.x), ky = (P.y-e.y), kd = Math.max(0.01,len(kx,ky));
      P.vx = kx/kd*430; P.vy = ky/kd*430;
      if(e.type!=='brute' && e.type!=='boss'){ e.vx = -kx/kd*260; e.vy = -ky/kd*260; }
    }
  }
}

function fireBolt(e, ux, uy, speed, dmg, magnetic){
  var mag = (magnetic===undefined) ? true : magnetic;
  bolts.push({x:e.x+ux*(e.r+6), y:e.y+uy*(e.r+6), vx:ux*speed, vy:uy*speed,
              r:mag?8:6, life:mag?6:3.2, a:rnd(0,TAU), mag:mag});
  if(mag) A.tone(300,0.1,'square',0.07,180);
}

function updateBoss(e, dt, ux, uy, d){
  e.phaseT -= dt;
  var cx = VW/2, cy = VH/2;
  var tox = cx-e.x, toy = cy-e.y;
  var td = Math.max(0.01, len(tox,toy));
  var driftx = tox/td, drifty = toy/td;
  var orbitAng = e.t*0.55;
  var tgx = cx + Math.cos(orbitAng)*260, tgy = cy + Math.sin(orbitAng)*150;
  var gx = tgx-e.x, gy = tgy-e.y, gd = Math.max(0.01,len(gx,gy));
  e.vx += gx/gd*e.spd*2.4*dt;
  e.vy += gy/gd*e.spd*2.4*dt;
  var sp = len(e.vx,e.vy);
  if(sp>e.spd){ e.vx=e.vx/sp*e.spd; e.vy=e.vy/sp*e.spd; }

  if(e.phaseT<=0){
    e.phase = (e.phase+1)%3;
    e.phaseT = e.phase===1 ? 3.0 : 2.6;
    e.sub = 0; e.subT = 0.4;
    if(e.phase===0) ring(e.x,e.y,e.r*2.6,'rgba(255,47,94,0.6)',0.5,4);
  }
  e.subT -= dt;
  if(e.subT<=0){
    if(e.phase===0){ // radial burst
      e.subT = 1.05;
      var count = 14;
      var off = rnd(0,TAU);
      for(var i=0;i<count;i++){
        var a = off + i*TAU/count;
        fireBolt(e, Math.cos(a), Math.sin(a), 195, 1);
      }
      shakeIt(5);
    } else if(e.phase===1){ // spiral stream
      e.subT = 0.10;
      e.spiral = (e.spiral||0) + 0.62;
      fireBolt(e, Math.cos(e.spiral), Math.sin(e.spiral), 235, 1);
      fireBolt(e, Math.cos(e.spiral+Math.PI), Math.sin(e.spiral+Math.PI), 235, 1);
    } else { // summon + aimed shots
      e.subT = 1.3;
      e.sub++;
      if(e.sub<=2){
        for(var k=0;k<3;k++){
          var an = rnd(0,TAU);
          var s = spawnAt('drone', {x:clamp(e.x+Math.cos(an)*70,30,VW-30), y:clamp(e.y+Math.sin(an)*70,30,VH-30)});
          s.spawnA = 0.35;
        }
      } else {
        for(var q=-1;q<=1;q++){
          var aa = Math.atan2(uy,ux)+q*0.24;
          fireBolt(e, Math.cos(aa), Math.sin(aa), 300, 1);
        }
      }
    }
  }
}

/* -------------------------------- bolts -------------------------------- */
function updateBolts(dt){
  for(var i=bolts.length-1;i>=0;i--){
    var b = bolts[i];
    b.life -= dt;
    b.a += dt*6;
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.life<=0 || b.x<-40||b.x>VW+40||b.y<-40||b.y>VH+40){ bolts.splice(i,1); continue; }
    if(G.mode!=='levelup' && len(P.x-b.x,P.y-b.y) < P.r+b.r*0.8){
      bolts.splice(i,1);
      // A magnetic bolt was catchable, so eating one is a half. The lancer's
      // spike is not catchable, so it is the full heart.
      hurtPlayer(b.mag === false ? 1 : 0.5);
      continue;
    }
  }
}

/* -------------------------------- shots -------------------------------- */
function updateShots(dt){
  for(var i=shots.length-1;i>=0;i--){
    var s = shots[i];
    s.life -= dt;
    if(s.shock){
      s.r += (s.max - s.r)*(1-Math.exp(-9*dt)) + 260*dt;
      for(var j=0;j<enemies.length;j++){
        var e2 = enemies[j];
        if(e2.dead||e2.spawnA>0) continue;
        if(s.hitIds.indexOf(e2)>=0) continue;
        var dd = len(e2.x-s.x, e2.y-s.y);
        if(dd < s.r + e2.r && dd > s.r - 60){
          s.hitIds.push(e2);
          var nx=(e2.x-s.x)/Math.max(0.01,dd), ny=(e2.y-s.y)/Math.max(0.01,dd);
          damageEnemy(e2, s.dmg, nx*300, ny*300);
        }
      }
      if(s.life<=0) shots.splice(i,1);
      continue;
    }
    s.a += dt*10;

    // Magnetically guided: slugs curve toward nearby enemies. This is what
    // makes an aimless radial blast actually lethal - without it the player
    // can hold the button forever and never clear a wave.
    var tgt=null, tdist=SHOT_SEEK;
    for(var h=0;h<enemies.length;h++){
      var en2 = enemies[h];
      if(en2.dead || en2.spawnA>0) continue;
      if(s.hitIds.indexOf(en2)>=0) continue;
      var hd = len(en2.x-s.x, en2.y-s.y);
      if(hd < tdist){ tdist = hd; tgt = en2; }
    }
    if(tgt){
      var cur = Math.atan2(s.vy,s.vx);
      var want = Math.atan2(tgt.y-s.y, tgt.x-s.x);
      var diff = ((want-cur+Math.PI*3)%TAU)-Math.PI;
      var maxTurn = SHOT_TURN*dt;
      var na = cur + clamp(diff,-maxTurn,maxTurn);
      var spd = len(s.vx,s.vy);
      s.vx = Math.cos(na)*spd; s.vy = Math.sin(na)*spd;
    }

    s.x += s.vx*dt; s.y += s.vy*dt;

    var bounced=false;
    if(s.bounce>0){
      if(s.x<s.r){ s.x=s.r; s.vx=Math.abs(s.vx); bounced=true; }
      else if(s.x>VW-s.r){ s.x=VW-s.r; s.vx=-Math.abs(s.vx); bounced=true; }
      if(s.y<s.r){ s.y=s.r; s.vy=Math.abs(s.vy); bounced=true; }
      else if(s.y>VH-s.r){ s.y=VH-s.r; s.vy=-Math.abs(s.vy); bounced=true; }
      if(bounced){ s.bounce--; spark(s.x,s.y,3,C.shot,50,160,0.1,0.22,2); }
    }

    if(s.life<=0 || s.x<-30||s.x>VW+30||s.y<-30||s.y>VH+30){
      shots.splice(i,1); continue;
    }

    // trail
    if(Math.random()<0.55){
      parts.push({x:s.x,y:s.y,vx:rnd(-14,14),vy:rnd(-14,14),life:0.16,max:0.16,r:s.r*0.55,col:s.kind==='bolt'?C.bolt:C.shot,drag:3});
    }

    for(var k=0;k<enemies.length;k++){
      var e = enemies[k];
      if(e.dead||e.spawnA>0) continue;
      if(s.hitIds.indexOf(e)>=0) continue;
      if(len(e.x-s.x, e.y-s.y) < e.r + s.r){
        s.hitIds.push(e);
        var vl = Math.max(0.01, len(s.vx,s.vy));
        damageEnemy(e, s.dmg, s.vx/vl*260, s.vy/vl*260);
        s.pierce--;
        if(s.pierce<0){ shots.splice(i,1); break; }
      }
    }
  }
}

/* ------------------------------ wave flow ------------------------------ */
function updateWaveFlow(dt){
  if(G.mode!=='play') return;
  G.waveT += dt;

  for(var i=G.spawnQ.length-1;i>=0;i--){
    if(G.waveT >= G.spawnQ[i].at){
      var q = G.spawnQ[i];
      var e = spawnAt(q.t, q.pt);
      if(q.t==='boss') G.bossRef = e;
      G.spawnQ.splice(i,1);
    }
  }

  if(G.spawnQ.length===0 && enemies.length===0){
    if(!G.clearShown){ G.clearShown = true; popText(VW/2, VH/2-60, 'WAVE CLEAR', C.player, 34); }
    G.betweenT += dt;
    if(G.betweenT > 1.6){
      G.betweenT = 0; G.clearShown = false;
      startWave(G.wave+1);
    }
  } else {
    G.betweenT = 0; G.clearShown = false;
  }
}

/* ------------------------------ particles ------------------------------ */
function updateParticles(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.life -= dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    var dr = 1-Math.min(0.9, p.drag*dt);
    p.vx*=dr; p.vy*=dr;
  }
  for(var j=pops.length-1;j>=0;j--){
    var t = pops[j];
    t.life -= dt;
    if(t.life<=0){ pops.splice(j,1); continue; }
    t.y += t.vy*dt; t.vy *= (1-2*dt);
  }
  for(var w=waves.length-1;w>=0;w--){
    var wv = waves[w];
    wv.life -= dt;
    if(wv.life<=0){ waves.splice(w,1); continue; }
    wv.r += (wv.max-wv.r)*(1-Math.exp(-7*dt));
  }
  for(var z=zaps.length-1;z>=0;z--){
    zaps[z].life -= dt;
    if(zaps[z].life<=0) zaps.splice(z,1);
  }
}


/* ------------------------------ draw utils ----------------------------- */
function text(str,x,y,size,col,align,weight,alpha,track){
  ctx.globalAlpha = alpha===undefined?1:alpha;
  ctx.fillStyle = col||C.text;
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'middle';
  ctx.font = (weight||700)+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  if(track){
    var total=0, i;
    for(i=0;i<str.length;i++) total += ctx.measureText(str[i]).width + track;
    total -= track;
    var sx = align==='center' ? x-total/2 : (align==='right' ? x-total : x);
    ctx.textAlign='left';
    for(i=0;i<str.length;i++){
      ctx.fillText(str[i], sx, y);
      sx += ctx.measureText(str[i]).width + track;
    }
  } else {
    ctx.fillText(str,x,y);
  }
  ctx.globalAlpha = 1;
}
function poly(x,y,r,sides,rot){
  ctx.beginPath();
  for(var i=0;i<sides;i++){
    var a = rot + i*TAU/sides;
    var px = x+Math.cos(a)*r, py = y+Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function inRect(px,py,r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }

/* One spacing scale for every screen. Panels breathe at PAD, groups separate
   at GAP, and a hairline rule does the work that cramped spacing used to. */
var PAD = 28, GAP = 36;
var HINT_SECONDS = 3.6;      // long enough to read once, short enough to ignore

var BTN_MUTE  = {x:VW-114, y:VH-76, w:44, h:44};
var BTN_PAUSE = {x:VW-60,  y:VH-76, w:44, h:44};

function cardRect(i){ return {x:130 + i*352, y:182, w:316, h:384}; }

/* Hairline divider - groups content without drawing another box around it. */
function hr(x1, x2, y, alpha){
  ctx.globalAlpha = (alpha===undefined?0.10:alpha);
  ctx.strokeStyle = '#eaf2ff';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y+0.5); ctx.lineTo(x2, y+0.5); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* -------------------------------- render ------------------------------- */
function render(rdt){
  var sx=0, sy=0;
  if(G.shake>0.2){ sx = rnd(-G.shake,G.shake); sy = rnd(-G.shake,G.shake); }

  // background fill (device space)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#02030a';
  ctx.fillRect(0,0,cssW,cssH);

  var base = function(){ ctx.setTransform(scale*dpr,0,0,scale*dpr, offX*dpr, offY*dpr); };

  base();
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();
  ctx.translate(sx,sy);

  drawBackground();

  ctx.globalCompositeOperation = 'lighter';
  drawWaveRings();
  drawScrap();
  drawShots();
  drawBolts();
  drawEnemies();
  drawZaps();
  drawPlayer();
  drawParticles();
  ctx.globalCompositeOperation = 'source-over';
  drawPops();
  ctx.restore();

  // HUD (no shake)
  base();
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();
  /* The HUD belongs to the arena. On a decision screen it only repeats in a
     ghost layer what the panel already says - wave, score, level - and offers
     a pause button that does nothing there. The meta screens are full screens
     of their own and would ghost through their backdrop as well. */
  var showHUD = (G.mode==='play' || G.mode==='intro' ||
                 G.mode==='dying' || G.mode==='revive');
  if(showHUD) drawHUD();
  if(G.mode==='intro') drawIntro();
  if(G.mode==='levelup') drawLevelUp();
  if(G.mode==='over') drawGameOver();
  if(G.mode==='cores') drawCores();
  if(G.mode==='shop') drawShop();
  if(G.mode==='revive') drawRevive();
  if(G.adMsgT > 0) text(G.adMsg, VW/2, VH-92, 14, C.scrap, 'center', 800, clamp(G.adMsgT,0,1), 3);
  if(G.adBusy) drawAdBusy();
  if(G.paused && G.mode==='play') drawPaused();
  drawCursor();

  /* Belt and braces: even mid-fade, these belong to the arena and not to a
     screen you are reading. */
  var arenaFx = (G.mode==='play' || G.mode==='intro' || G.mode==='dying');
  if(arenaFx && G.flash>0.001){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(180,220,255,'+(G.flash*0.30)+')';
    ctx.fillRect(0,0,VW,VH);
    ctx.globalCompositeOperation='source-over';
  }
  if(arenaFx && G.dmgFlash>0.001){
    // Kept off the centre of the screen: the moment you take a hit is the
    // moment you most need to see what is coming next.
    var gr = ctx.createRadialGradient(VW/2,VH/2,VH*0.42, VW/2,VH/2,VH*0.88);
    gr.addColorStop(0,'rgba(255,40,70,0)');
    gr.addColorStop(1,'rgba(255,40,70,'+(G.dmgFlash*0.48)+')');
    ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
  }
  ctx.restore();

  /* Both of these are drawn in CSS pixels rather than virtual ones, so they
     cover the letterbox bars too - in portrait the playfield is only a third
     of the screen, and anything confined to it would be the size of the
     problem it is trying to solve. */
  if(portraitUI() && (G.mode === 'shop' || G.mode === 'cores' || G.mode === 'over')){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(G.mode === 'shop') drawShopPortrait();
    else if(G.mode === 'cores') drawCoresPortrait();
    else drawOverPortrait();
  }
  if(needsRotate()){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawRotate();
  }
}

function drawBackground(){
  var pulse = G.pulse, th = arenaTheme();
  ctx.fillStyle = th.sky;
  ctx.fillRect(0,0,VW,VH);

  // subtle drifting grid
  var step = 64, t = G.t*10;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba('+th.grid+','+(0.055+pulse*0.10)+')';
  ctx.beginPath();
  for(var x=(t%step)-step; x<VW+step; x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,VH); }
  for(var y=(t*0.6%step)-step; y<VH+step; y+=step){ ctx.moveTo(0,y); ctx.lineTo(VW,y); }
  ctx.stroke();

  // arena glow border
  ctx.globalCompositeOperation='lighter';
  var g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'rgba('+th.top+',0.10)');
  g.addColorStop(0.5,'rgba('+th.top+',0.00)');
  g.addColorStop(1,'rgba('+th.bot+',0.10)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  ctx.globalCompositeOperation='source-over';

  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba('+th.edge+','+(0.22+pulse*0.4)+')';
  ctx.strokeRect(1.5,1.5,VW-3,VH-3);

  // vignette
  var vg = ctx.createRadialGradient(VW/2,VH/2,VH*0.34, VW/2,VH/2,VH*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.60)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
}

function drawWaveRings(){
  for(var i=0;i<waves.length;i++){
    var w = waves[i], a = clamp(w.life/0.5,0,1);
    ctx.globalAlpha = a*0.85;
    ctx.strokeStyle = w.col;
    ctx.lineWidth = w.w*a;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* Forty-odd scrap were drawn at identical weight whether or not you could do
   anything with them, and they are additive, so the field became a haze that
   every other read had to compete with.

   Thinning the field was measured and rejected - it is the ammunition supply,
   and cutting the count enough to matter visibly made the orbit measurably
   slower to fill. The count is not the problem; equal salience is. So the
   subset the magnet can actually reach lights up, and the rest goes quiet.
   Same economy, far fewer things asking for attention at once - and it makes
   your reach visible, which nothing else in the game showed. */
function drawScrap(){
  var held = (IN.down || IN.kMag) && (G.mode==='play' || G.mode==='intro') && P.hp > 0;
  var r2 = P.magR * P.magR;
  for(var i=0;i<scrap.length;i++){
    var s = scrap[i];
    var dx = s.x-P.x, dy = s.y-P.y;
    var live = held && (dx*dx + dy*dy) < r2;
    blob(s.x, s.y, s.r*(live?2.8:2.0), live ? 'rgba(255,205,95,0.26)' : 'rgba(255,190,70,0.09)');
    ctx.save();
    ctx.translate(s.x,s.y); ctx.rotate(s.a);
    ctx.globalAlpha = live ? 1 : 0.6;
    ctx.fillStyle = C.scrap;
    ctx.fillRect(-s.r*0.62,-s.r*0.62,s.r*1.24,s.r*1.24);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawBolts(){
  for(var i=0;i<bolts.length;i++){
    var b = bolts[i];
    if(b.mag===false){
      // lancer spike: a hard dart you must dodge, never catch
      var ang = Math.atan2(b.vy,b.vx);
      blob(b.x,b.y,16,'rgba(201,214,255,0.40)');
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(ang);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(13,0); ctx.lineTo(-7,4.5); ctx.lineTo(-3,0); ctx.lineTo(-7,-4.5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(201,214,255,0.55)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-30,0); ctx.stroke();
      ctx.restore();
      continue;
    }
    blob(b.x,b.y,20,'rgba(255,93,177,0.42)');
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
    ctx.fillStyle = '#ffd8ee';
    poly(0,0,b.r,4,0); ctx.fill();
    ctx.strokeStyle = C.bolt; ctx.lineWidth=2;
    poly(0,0,b.r+3.5,4,Math.PI/4); ctx.stroke();
    ctx.restore();
  }
}

function drawShots(){
  for(var i=0;i<shots.length;i++){
    var s = shots[i];
    if(s.shock){
      var a = clamp(s.life/0.34,0,1);
      ctx.globalAlpha = a*0.8;
      ctx.strokeStyle = '#9dfbff';
      ctx.lineWidth = 6*a;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    var col = s.kind==='bolt' ? C.bolt : C.shot;
    blob(s.x,s.y, s.r*3.4, s.kind==='bolt'?'rgba(255,93,177,0.45)':'rgba(157,251,255,0.42)');
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a);
    ctx.fillStyle = '#ffffff';
    if(s.kind==='bolt'){ poly(0,0,s.r,4,0); ctx.fill(); }
    else { ctx.fillRect(-s.r*0.6,-s.r*0.6,s.r*1.2,s.r*1.2); }
    ctx.restore();
  }
}

function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.spawnA>0){
      var t = 1-clamp(e.spawnA/0.6,0,1);
      ctx.globalAlpha = 0.35+0.4*Math.sin(G.t*30);
      ctx.strokeStyle = e.col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(0.5+t*0.9),0,TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      blob(e.x,e.y,e.r*2.2,'rgba(255,80,80,0.16)');
      continue;
    }
    var ang = Math.atan2(P.y-e.y, P.x-e.x);
    var flash = e.flash>0;
    var body = flash ? '#ffffff' : e.col;
    blob(e.x,e.y, e.r*3.0, hexA(e.col, 0.34));

    ctx.save(); ctx.translate(e.x,e.y);
    ctx.lineWidth = 2.5;
    if(e.type==='drone'){
      ctx.rotate(ang);
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(e.r,0); ctx.lineTo(-e.r*0.72, e.r*0.78); ctx.lineTo(-e.r*0.30,0); ctx.lineTo(-e.r*0.72,-e.r*0.78);
      ctx.closePath(); ctx.fill();
    } else if(e.type==='spinner'){
      ctx.rotate(e.t*7);
      ctx.fillStyle = body;
      poly(0,0,e.r,3,0); ctx.fill();
      ctx.strokeStyle = body; ctx.globalAlpha=0.6;
      poly(0,0,e.r*1.5,3,Math.PI); ctx.stroke(); ctx.globalAlpha=1;
    } else if(e.type==='shooter'){
      ctx.rotate(ang);
      ctx.strokeStyle = body; ctx.fillStyle = hexA(e.col,0.30);
      poly(0,0,e.r,6,0); ctx.fill(); ctx.stroke();
      ctx.fillStyle = flash?'#fff':'#ffd8ee';
      ctx.beginPath(); ctx.arc(e.r*0.42,0,e.r*0.30,0,TAU); ctx.fill();
    } else if(e.type==='splitter'){
      ctx.rotate(e.t*1.6);
      ctx.strokeStyle = body; ctx.fillStyle = hexA(e.col,0.34);
      poly(0,0,e.r,4,0); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = body; ctx.globalAlpha=0.7;
      poly(0,0,e.r*0.52,4,Math.PI/4); ctx.stroke(); ctx.globalAlpha=1;
    } else if(e.type==='lancer'){
      ctx.rotate(ang);
      ctx.strokeStyle = body; ctx.fillStyle = hexA(e.col,0.26);
      ctx.beginPath();
      ctx.moveTo(e.r,0); ctx.lineTo(-e.r*0.5, e.r*0.85); ctx.lineTo(-e.r*0.9,0); ctx.lineTo(-e.r*0.5,-e.r*0.85);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = flash?'#fff':'#eef3ff';
      ctx.beginPath(); ctx.arc(e.r*0.25,0,e.r*0.24,0,TAU); ctx.fill();
    } else if(e.type==='brute'){
      ctx.rotate(e.t*0.7);
      ctx.strokeStyle = body; ctx.lineWidth=4; ctx.fillStyle = hexA(e.col,0.28);
      poly(0,0,e.r,8,0); ctx.fill(); ctx.stroke();
      ctx.fillStyle = body;
      poly(0,0,e.r*0.36,8,0); ctx.fill();
    } else if(e.type==='boss'){
      ctx.rotate(e.t*0.5);
      ctx.strokeStyle = body; ctx.lineWidth=5; ctx.fillStyle = hexA(e.col,0.24);
      poly(0,0,e.r,6,0); ctx.fill(); ctx.stroke();
      ctx.rotate(-e.t*1.3);
      ctx.strokeStyle = '#ffd8ee'; ctx.lineWidth=3; ctx.globalAlpha=0.85;
      poly(0,0,e.r*0.60,3,0); ctx.stroke();
      ctx.globalAlpha=1;
      ctx.fillStyle = flash?'#fff':'#ffe0ec';
      ctx.beginPath(); ctx.arc(0,0,e.r*0.20,0,TAU); ctx.fill();
    }
    ctx.restore();

    if(e.type==='lancer' && e.charge>0){
      var ch = 1 - e.charge/LANCE_TELL;
      ctx.globalAlpha = 0.25 + ch*0.65;
      ctx.strokeStyle = ch>0.75 ? '#ffffff' : C.lancer;
      ctx.lineWidth = 1 + ch*2.5;
      ctx.setLineDash([14,10]); ctx.lineDashOffset = -G.t*90;
      ctx.beginPath();
      ctx.moveTo(e.x + e.aimX*e.r, e.y + e.aimY*e.r);
      ctx.lineTo(e.x + e.aimX*1400, e.y + e.aimY*1400);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // Only once it has something to say: a full bar is six pixels of noise
    // repeated across every tough enemy on screen.
    if(e.maxHp>2 && e.type!=='boss' && e.hp < e.maxHp){
      var w = e.r*1.8, hp = clamp(e.hp/e.maxHp,0,1);
      ctx.globalAlpha=0.85;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(e.x-w/2, e.y-e.r-11, w, 4);
      ctx.fillStyle=e.col; ctx.fillRect(e.x-w/2, e.y-e.r-11, w*hp, 4);
      ctx.globalAlpha=1;
    }
  }
}

function hexA(hex,a){
  var h = hex.replace('#','');
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function drawZaps(){
  for(var i=0;i<zaps.length;i++){
    var z = zaps[i], a = z.life/z.max;
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#bff6ff'; ctx.lineWidth = 3*a;
    ctx.beginPath();
    var segs=6;
    ctx.moveTo(z.x1,z.y1);
    for(var s=1;s<segs;s++){
      var tt=s/segs;
      ctx.lineTo(lerp(z.x1,z.x2,tt)+rnd(-14,14), lerp(z.y1,z.y2,tt)+rnd(-14,14));
    }
    ctx.lineTo(z.x2,z.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawPlayer(){
  if(G.mode==='over') return;
  var alive = P.hp>0;
  var magHeld = (IN.down||IN.kMag) && (G.mode==='play'||G.mode==='intro');

  // magnet field
  if(magHeld && alive){
    var pf = 0.10 + 0.06*Math.sin(G.t*9);
    ctx.globalAlpha = 1;
    var fg = ctx.createRadialGradient(P.x,P.y,P.magR*0.30,P.x,P.y,P.magR);
    fg.addColorStop(0, hexA(C.player,0));
    fg.addColorStop(0.75, hexA(C.player, pf*0.6));
    fg.addColorStop(1, hexA(C.player,0));
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(P.x,P.y,P.magR,0,TAU); ctx.fill();
    ctx.strokeStyle=hexA(C.player, 0.22+0.10*Math.sin(G.t*9));
    ctx.lineWidth=2;
    ctx.setLineDash([10,12]);
    ctx.lineDashOffset = -G.t*40;
    ctx.beginPath(); ctx.arc(P.x,P.y,P.magR,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  // orbit items
  for(var i=0;i<orbit.length;i++){
    var o = orbit[i];
    if(o.kind==='bolt'){
      blob(o.x,o.y,22,'rgba(255,93,177,0.42)');
      ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.spinA||0);
      ctx.fillStyle='#ffd8ee'; poly(0,0,8,4,0); ctx.fill();
      ctx.restore();
    } else {
      blob(o.x,o.y,o.r*2.6,'rgba(255,190,70,0.28)');
      ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.spinA||0);
      ctx.fillStyle=C.scrap; ctx.fillRect(-o.r*0.62,-o.r*0.62,o.r*1.24,o.r*1.24);
      ctx.restore();
    }
  }
  // orbit ring guide
  if(orbit.length>0 && alive){
    ctx.strokeStyle=hexA(C.player,0.16); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(P.x,P.y,P.orbR,0,TAU); ctx.stroke();
  }

  if(!alive) return;
  drawTrail();

  var blink = P.inv>0 && (Math.floor(G.t*22)%2===0);
  var pr = P.r + Math.sin(G.t*5)*0.8;
  blob(P.x,P.y, pr*5.2, hexA(C.player, blink?0.20:0.42));
  ctx.globalAlpha = blink?0.45:1;
  ctx.fillStyle = C.player;
  poly(P.x,P.y,pr*1.5,P.sides,-P.orbBase*0.8); ctx.fill();
  ctx.fillStyle = C.playerCore;
  ctx.beginPath(); ctx.arc(P.x,P.y,pr*0.62,0,TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // capacity arc
  if(orbit.length>0){
    var frac = orbit.length/P.cap;
    var full = frac >= 1;
    // At capacity the ring breathes, so "let go now" is readable peripherally.
    ctx.strokeStyle = full ? hexA(C.scrap, 0.65+0.35*Math.sin(G.t*11)) : hexA(C.player,0.75);
    ctx.lineWidth = full ? 4 : 3;
    ctx.beginPath();
    ctx.arc(P.x,P.y,pr*2.2,-Math.PI/2, -Math.PI/2 + TAU*Math.min(1,frac));
    ctx.stroke();
    if(G.chargeT > 0){
      ctx.globalAlpha = clamp(G.chargeT/0.55, 0, 1) * 0.5;
      ctx.strokeStyle = C.scrap; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(P.x, P.y, pr*2.2 + (1-clamp(G.chargeT/0.55,0,1))*26, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function drawParticles(){
  for(var i=0;i<parts.length;i++){
    var p = parts[i], a = clamp(p.life/p.max,0,1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x-p.r*a, p.y-p.r*a, p.r*2*a, p.r*2*a);
    ctx.globalAlpha = 1;
  }
}

function drawPops(){
  for(var i=0;i<pops.length;i++){
    var t = pops[i], a = clamp(t.life/t.max,0,1);
    text(t.txt, t.x, t.y, t.size, t.col, 'center', 800, a*0.95, 0.5);
  }
}

/* --------------------------------- HUD --------------------------------- */
function drawHUD(){
  // lives, in half hearts
  for(var i=0;i<P.maxHp;i++){
    var x = 38+i*28, y = 40;
    var full = P.hp >= i+1;
    var half = !full && P.hp > i;
    var lcol = P.hp<=1 ? '#ff5f7a' : C.player;
    ctx.save(); ctx.translate(x,y);
    if(half){
      /* Clipped BEFORE the rotation, so the cut runs vertically down the
         screen rather than along the diamond's own edge - a diagonal split
         reads as a smaller diamond rather than as half of one. */
      ctx.save();
      ctx.beginPath(); ctx.rect(-12,-12,12,24); ctx.clip();
      ctx.rotate(Math.PI/4);
      ctx.fillStyle = lcol;
      ctx.fillRect(-7.5,-7.5,15,15);
      ctx.restore();
      ctx.rotate(Math.PI/4);
      ctx.strokeStyle = hexA(lcol, 0.55); ctx.lineWidth = 2;
      ctx.strokeRect(-7.5,-7.5,15,15);
    } else {
      ctx.rotate(Math.PI/4);
      if(full){
        ctx.fillStyle = lcol;
        ctx.fillRect(-7.5,-7.5,15,15);
      } else {
        ctx.strokeStyle='rgba(234,242,255,0.26)'; ctx.lineWidth=2;
        ctx.strokeRect(-7.5,-7.5,15,15);
      }
    }
    ctx.restore();
  }

  /* Wave + remaining. The banner announces the wave in 38px letters at the same
     moment, so the label steps aside while it does - otherwise the same word
     is stacked twice down the middle of the screen, and the centre column
     carries four things at once. They cross-fade. */
  if(G.wave>0){
    var wa = 0.92 * (1 - clamp(G.waveBanner/0.6, 0, 1));
    if(wa > 0.02){
      text('WAVE '+G.wave, VW/2, 40, 21, C.text, 'center', 800, wa, 3);
      var remaining = enemies.length + G.spawnQ.length;
      if(remaining>0) text(remaining+' LEFT', VW/2, 66, 11, C.dim, 'center', 700, wa*0.8, 2.5);
    }
  }

  // score
  text(String(G.score), VW-38, 40, 28, C.text, 'right', 800, 1, 1);
  var best = parseInt(store('mgn.best')||'0',10);
  text('BEST '+Math.max(best,G.score), VW-38, 66, 11, C.dim, 'right', 700, 0.75, 2);

  // boss bar, clear of the wave label above it
  if(G.bossRef && !G.bossRef.dead){
    var b = G.bossRef, w2 = 460, x2 = VW/2-w2/2, y2 = 100;
    text('GUARDIAN', VW/2, y2-14, 11, C.boss, 'center', 800, 0.95, 4);
    ctx.fillStyle='rgba(0,0,0,0.45)'; roundRect(x2,y2,w2,9,5); ctx.fill();
    ctx.fillStyle=C.boss; roundRect(x2,y2,Math.max(4,w2*clamp(b.hp/b.maxHp,0,1)),9,5); ctx.fill();
  }

  /* Wave announcement. The state for this was already being computed and
     decayed every frame but never drawn - it just needed a home. */
  if(G.waveBanner > 0 && G.waveBannerTxt && (G.mode==='play' || G.mode==='intro')){
    var wb = G.waveBanner;
    var alpha = clamp(Math.min((2.0-wb)/0.22, wb/0.55), 0, 1);
    var rise = (1 - clamp((2.0-wb)/0.45, 0, 1)) * 16;
    text(G.waveBannerTxt, VW/2, 214 - rise, 38, C.text, 'center', 900, alpha*0.9, 11);
  }

  /* Sits below the wave announcement, in the calm band above the fight. */
  if(G.hintT > 0 && G.hintTxt && (G.mode==='play' || G.mode==='intro')){
    var hfade = clamp(Math.min(G.hintT/0.6, (HINT_SECONDS-G.hintT)/0.4), 0, 1);
    text(G.hintTxt, VW/2, 252, 15, C.text, 'center', 700, hfade*0.82, 1.2);
  }

  // combo
  if(G.combo>1){
    var ca = clamp(G.comboT/2.6,0,1);
    // Was 34 + up to 19px, which put a 53px number in the middle of the fight.
    var sz = 30 + Math.min(G.combo,10)*1.3;
    text('x'+G.combo, VW/2, 134, sz, C.scrap, 'center', 900, 0.35+ca*0.65, 1);
    text('COMBO', VW/2, 134+sz*0.64, 11, C.scrap, 'center', 700, ca*0.55, 4);
    /* A chain that expires invisibly is a chain you cannot play to. The bar is
       the same information the alpha was already carrying, made readable. */
    var cbw = 72, cbx = VW/2 - cbw/2, cby = Math.round(134 + sz*0.64 + 19);
    ctx.globalAlpha = ca*0.75;
    ctx.fillStyle = hexA(C.scrap, 0.20); ctx.fillRect(cbx, cby, cbw, 3);
    ctx.fillStyle = C.scrap;             ctx.fillRect(cbx, cby, cbw*ca, 3);
    ctx.globalAlpha = 1;
  }

  /* XP runs full-bleed along the very bottom edge. It used to be an inset
     rounded bar that passed underneath the mute and pause buttons. */
  var xpH = 5, xpY = VH-xpH;
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(0, xpY, VW, xpH);
  ctx.fillStyle=C.player;
  ctx.fillRect(0, xpY, Math.max(3, VW*clamp(G.xp/G.xpNeed,0,1)), xpH);

  text('LV '+G.level, 38, VH-26, 12, C.dim, 'left', 700, 0.75, 2);
  text(coreById(P.core).name, 38+78, VH-26, 11, C.player, 'left', 700, 0.5, 2.5);

  drawBtn(BTN_MUTE, (A.muted||A.forced)?'muted':'sound');
  drawBtn(BTN_PAUSE, G.paused?'play':'pause');
}

function drawBtn(r, kind){
  ctx.fillStyle='rgba(255,255,255,0.06)';
  roundRect(r.x,r.y,r.w,r.h,10); ctx.fill();
  ctx.strokeStyle='rgba(234,242,255,0.18)'; ctx.lineWidth=1.5;
  roundRect(r.x,r.y,r.w,r.h,10); ctx.stroke();
  var cx=r.x+r.w/2, cy=r.y+r.h/2;
  ctx.strokeStyle='rgba(234,242,255,0.85)'; ctx.fillStyle='rgba(234,242,255,0.85)';
  ctx.lineWidth=2;
  if(kind==='pause'){ ctx.fillRect(cx-6,cy-8,4,16); ctx.fillRect(cx+2,cy-8,4,16); }
  else if(kind==='play'){ ctx.beginPath(); ctx.moveTo(cx-5,cy-8); ctx.lineTo(cx+8,cy); ctx.lineTo(cx-5,cy+8); ctx.closePath(); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.moveTo(cx-9,cy-4); ctx.lineTo(cx-4,cy-4); ctx.lineTo(cx+1,cy-9);
    ctx.lineTo(cx+1,cy+9); ctx.lineTo(cx-4,cy+4); ctx.lineTo(cx-9,cy+4); ctx.closePath(); ctx.fill();
    if(kind==='muted'){
      ctx.beginPath(); ctx.moveTo(cx+5,cy-5); ctx.lineTo(cx+12,cy+5); ctx.moveTo(cx+12,cy-5); ctx.lineTo(cx+5,cy+5); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(cx+3,cy,7,-0.9,0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+3,cy,12,-0.9,0.9); ctx.stroke();
    }
  }
}

function drawCursor(){
  if(IN.isTouch || !IN.has) return;
  var a = 0.55;
  ctx.strokeStyle=hexA(C.player,a); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(IN.x,IN.y,9,0,TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(IN.x-15,IN.y); ctx.lineTo(IN.x-11,IN.y);
  ctx.moveTo(IN.x+11,IN.y); ctx.lineTo(IN.x+15,IN.y);
  ctx.moveTo(IN.x,IN.y-15); ctx.lineTo(IN.x,IN.y-11);
  ctx.moveTo(IN.x,IN.y+11); ctx.lineTo(IN.x,IN.y+15);
  ctx.stroke();
}

/* ------------------------------- level up ------------------------------ */
function drawLevelUp(){
  G.cardT = (G.cardT||0) + 0.016;
  var a = clamp(G.cardT*5,0,1);
  // Deep enough that the slowed field reads as texture rather than as
  // something moving across the words you are trying to compare.
  ctx.fillStyle='rgba(3,5,14,'+(0.90*a)+')';
  ctx.fillRect(0,0,VW,VH);

  var hi = RARITY[G.bestRarity||0];
  text('LEVEL '+G.level, VW/2, 92, 17, (G.bestRarity>=EPIC)?hi.col:C.scrap, 'center', 800, a, 6);
  text('CHOOSE AN UPGRADE', VW/2, 132, 34, C.text, 'center', 900, a, 5);

  for(var i=0;i<G.cards.length;i++){
    var r = cardRect(i), u = G.cards[i];
    var hov = IN.has && inRect(IN.x,IN.y,r);
    var lift = hov?8:0;
    var ca = clamp((G.cardT-i*0.06)*6,0,1);
    var top = r.y-lift;
    ctx.globalAlpha = ca;

    var rar = RARITY[u.r];

    // Epics carry a soft outer bloom so the good card reads across the room.
    if(u.r >= EPIC){
      var puls = 0.5 + 0.5*Math.sin(G.uiT*2.6 + i);
      ctx.globalAlpha = ca*(0.10 + 0.12*puls);
      ctx.strokeStyle = rar.col; ctx.lineWidth = 12;
      roundRect(r.x-3, top-3, r.w+6, r.h+6, 21); ctx.stroke();
      ctx.globalAlpha = ca;
    }

    /* A card needs its own surface. At 4% white the slowed field drifted
       straight through the words you are comparing - the neon edge still
       carries the styling, the fill just stops competing with the text. */
    ctx.fillStyle = hov ? hexA(rar.col,0.15) : 'rgba(7,10,20,0.72)';
    roundRect(r.x, top, r.w, r.h, 18); ctx.fill();
    ctx.strokeStyle = hov ? rar.col : hexA(rar.col, u.r?0.55:0.32);
    ctx.lineWidth = hov?3:(u.r?2:1.5);
    roundRect(r.x, top, r.w, r.h, 18); ctx.stroke();

    var cx = r.x+r.w/2;

    // header row
    text(String(i+1), r.x+PAD, top+34, 14, C.dim, 'left', 700, ca*0.8, 1);
    text(rar.name, r.x+r.w-PAD, top+34, 10, rar.col, 'right', 800, ca*0.95, 3.5);

    // icon
    var cy = top+142;
    ctx.globalCompositeOperation='lighter';
    blob(cx,cy,82, hexA(rar.col, rar.glow));
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle = rar.col; ctx.lineWidth=3;
    poly(cx,cy,32, u.sides, G.uiT*(0.8+i*0.3)); ctx.stroke();
    ctx.fillStyle = rar.col; ctx.globalAlpha = ca*0.9;
    ctx.beginPath(); ctx.arc(cx,cy,8,0,TAU); ctx.fill();
    ctx.globalAlpha = ca;

    hr(r.x+PAD, r.x+r.w-PAD, top+212, ca*0.10);

    text(u.name, cx, top+250, 21, C.text, 'center', 900, ca, 1.5);
    wrapText(u.desc, cx, top+288, 15, C.dim, r.w-2*PAD-16, 21);

    // stack pips
    var taken = (G.taken&&G.taken[u.id])||0;
    for(var p=0;p<u.max;p++){
      var px = cx - (u.max-1)*8 + p*16;
      ctx.fillStyle = p<taken ? rar.col : 'rgba(234,242,255,0.18)';
      ctx.beginPath(); ctx.arc(px, top+r.h-42, 4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  text(IN.isTouch?'Tap a card':'Click a card, or press 1 / 2 / 3',
       VW/2, 616, 14, C.dim, 'center', 600, a*0.75, 1.5);
  // Pause means nothing here, so only the mute button comes along.
  drawBtn(BTN_MUTE, (A.muted||A.forced)?'muted':'sound');
}

function wrapText(str,cx,y,size,col,maxW,lh,align,alpha){
  ctx.font = '600 '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  var words = str.split(' '), line='', lines=[];
  for(var i=0;i<words.length;i++){
    var test = line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line=words[i]; }
    else line = test;
  }
  if(line) lines.push(line);
  for(var j=0;j<lines.length;j++){
    text(lines[j], cx, y+j*lh, size, col, align||'center', 600, alpha===undefined?0.9:alpha, 0);
  }
  return lines.length;
}

/* The panel sits higher when a banner has space reserved beneath it. */
function overY(){ return BANNER.reserved ? 48 : 100; }
var OVER_H = 512;

function drawGameOver(){
  if(portraitUI()) return;      // drawn in CSS space after the HUD pass instead
  var t = G.overT||0;
  var a = clamp(t*2.5,0,1);
  ctx.fillStyle='rgba(3,5,14,'+(0.84*a)+')';
  ctx.fillRect(0,0,VW,VH);

  var by = overY(), bw = 580, bx = VW/2-bw/2, bh = OVER_H;
  ctx.globalAlpha = a;
  ctx.fillStyle='rgba(7,10,20,0.72)';      // same reason as the level-up cards
  roundRect(bx,by,bw,bh,22); ctx.fill();
  ctx.strokeStyle=hexA(C.player,0.30); ctx.lineWidth=2;
  roundRect(bx,by,bw,bh,22); ctx.stroke();

  var inset = bx+PAD+10, inR = bx+bw-PAD-10;

  // identity
  text('CORE LOST', VW/2, by+54, 36, '#ff5f7a', 'center', 900, 1, 5);
  var bw2 = parseInt(store('mgn.bestwave')||'0',10);
  text('RANK  '+rankFor(bw2), VW/2, by+86, 11, C.dim, 'center', 700, 0.62, 4);

  // the number of the run
  text(String(G.score), VW/2, by+152, 66, C.text, 'center', 900, 1, 2);
  if(G.newBest){
    text('NEW BEST SCORE', VW/2, by+198, 12, C.scrap, 'center', 800, 0.65+0.35*Math.sin(G.uiT*6), 4);
  } else {
    text('SCORE', VW/2, by+198, 11, C.dim, 'center', 700, 0.7, 5);
  }

  hr(inset, inR, by+230, a*0.10);

  // run detail
  var best = parseInt(store('mgn.best')||'0',10);
  stat(VW/2-168, by+268, 'WAVE', String(G.wave));
  stat(VW/2,     by+268, 'BEST COMBO', 'x'+G.bestCombo);
  stat(VW/2+168, by+268, 'BEST', String(Math.max(best, G.score)));

  hr(inset, inR, by+326, a*0.10);

  // The Flux payout counts up, so the reward for the run you just finished is
  // the thing that animates rather than a static number you skim past.
  var earned = G.fluxEarned||0;
  var shown = Math.round(earned * clamp((t-0.35)/0.8, 0, 1));
  text('+'+shown+' FLUX', VW/2, by+366, 29, C.scrap, 'center', 900, 1, 2);
  text(bankedLine(bw - PAD*2, 11), VW/2, by+392, 11, C.dim, 'center', 700, 0.7, 1.5);

  // actions
  var b = overBtns(), pulse = 0.65+0.35*Math.sin(G.uiT*4);
  var hovP = IN.has && inRect(IN.x,IN.y,b.play);
  ctx.fillStyle=hexA(C.player, hovP?0.26:(0.13+0.05*pulse));
  roundRect(b.play.x,b.play.y,b.play.w,b.play.h,14); ctx.fill();
  ctx.strokeStyle=hexA(C.player, hovP?1:pulse); ctx.lineWidth=2;
  roundRect(b.play.x,b.play.y,b.play.w,b.play.h,14); ctx.stroke();
  text('PLAY AGAIN', b.play.x+b.play.w/2, b.play.y+28, 20, C.text, 'center', 900, 1, 3);

  var hovC = IN.has && inRect(IN.x,IN.y,b.cores);
  ctx.fillStyle = hovC ? hexA(C.scrap,0.16) : 'rgba(255,255,255,0.05)';
  roundRect(b.cores.x,b.cores.y,b.cores.w,b.cores.h,14); ctx.fill();
  ctx.strokeStyle = hovC ? C.scrap : 'rgba(234,242,255,0.26)'; ctx.lineWidth=2;
  roundRect(b.cores.x,b.cores.y,b.cores.w,b.cores.h,14); ctx.stroke();
  text('CORES', b.cores.x+b.cores.w/2, b.cores.y+28, 14, hovC?C.scrap:C.text, 'center', 800, 1, 1.5);

  var hovS = IN.has && inRect(IN.x,IN.y,b.shop);
  ctx.fillStyle = hovS ? hexA(C.scrap,0.16) : 'rgba(255,255,255,0.05)';
  roundRect(b.shop.x,b.shop.y,b.shop.w,b.shop.h,14); ctx.fill();
  ctx.strokeStyle = hovS ? C.scrap : 'rgba(234,242,255,0.26)'; ctx.lineWidth=2;
  roundRect(b.shop.x,b.shop.y,b.shop.w,b.shop.h,14); ctx.stroke();
  text('SHOP', b.shop.x+b.shop.w/2, b.shop.y+28, 14, hovS?C.scrap:C.text, 'center', 800, 1, 1.5);

  // With an ad on screen, "click anywhere" would turn the whole page into a
  // button sitting next to it - the button becomes the only pointer target.
  var hint = BANNER.reserved
    ? (IN.isTouch ? 'Tap PLAY AGAIN to retry' : 'Press PLAY AGAIN or Enter to retry')
    : (IN.isTouch ? 'Tap anywhere to retry'   : 'Click anywhere or press Enter to retry');
  text(hint, VW/2, by+bh-26, 12, C.dim, 'center', 600, 0.55*a, 1.5);
  drawBtn(BTN_MUTE, (A.muted||A.forced)?'muted':'sound');
  ctx.globalAlpha = 1;
}

var RANKS = [[20,'EVENT HORIZON'],[15,'SINGULARITY'],[10,'MAGNETAR'],[5,'FIELD TECH'],[1,'SCRAP RAT']];
function rankFor(w){
  for(var i=0;i<RANKS.length;i++) if(w>=RANKS[i][0]) return RANKS[i][1];
  return 'SCRAP RAT';
}
function stat(x,y,label,val){
  text(val, x, y, 26, C.text, 'center', 900, 1, 1);
  text(label, x, y+26, 11, C.dim, 'center', 700, 0.75, 2.5);
}

/* The wake borrows C.player, which follows the equipped core, so it can never
   come out in a colour the arena has already given to something hostile. */
function drawTrail(){
  var id = equippedTrail(), tr = P.trail;
  if(id === 'trail.std' || !tr || tr.length < 3) return;
  var n = tr.length, i, f, p;

  if(id === 'trail.ion'){
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for(i=1;i<n;i++){
      f = 1 - i/n;
      ctx.strokeStyle = hexA(C.player, 0.28*f*f);
      ctx.lineWidth = P.r*1.4*f + 0.5;
      ctx.beginPath();
      ctx.moveTo(tr[i-1].x, tr[i-1].y); ctx.lineTo(tr[i].x, tr[i].y);
      ctx.stroke();
    }
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    ctx.globalCompositeOperation = 'source-over';
  } else if(id === 'trail.spark'){
    ctx.globalCompositeOperation = 'lighter';
    for(i=0;i<n;i+=2){
      p = tr[i]; f = 1 - i/n;
      var s = P.r*0.30*f + 0.4;
      ctx.fillStyle = hexA(C.player, 0.60*f*f);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a*2 + i*0.7);
      ctx.fillRect(-s,-s,s*2,s*2);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
  } else {
    ctx.lineWidth = 1.5;
    for(i=4;i<n;i+=6){
      p = tr[i]; f = 1 - i/n;
      ctx.strokeStyle = hexA(C.player, 0.38*f);
      poly(p.x, p.y, P.r*1.5*(0.55+0.55*f), P.sides, -p.a*0.8);
      ctx.stroke();
    }
  }
}

/* -------------------------------- cores -------------------------------- */
/* The core menu is a full screen with no spare band, so a banner has to be
   made room for rather than dropped in. Everything tightens by about 17% and
   only while a banner is actually reserved - with no ad (no SDK, no fill, the
   Artifact build) the roomy layout is what you get. */
function coresLayout(){
  return BANNER.reserved
    ? { title:46, sub:78, sync:100,
        y0:120, h:186, step:202,
        glyphY:64, glyphR:22, nameY:38,
        tagY:62, tagSize:12, tagLh:16,
        divY:110, statY:134, statLh:18, statSize:12,
        launch:{x:VW/2-213, y:524, w:260, h:46},
        alt:{x:VW/2+63, y:524, w:150, h:46} }
    : { title:62, sub:98, sync:124,
        y0:152, h:225, step:251,
        glyphY:76, glyphR:25, nameY:44,
        tagY:74, tagSize:12.5, tagLh:18,
        divY:134, statY:160, statLh:22, statSize:12.5,
        launch:{x:VW/2-213, y:650, w:260, h:52},
        alt:{x:VW/2+63, y:650, w:150, h:52} };
}
function coreCardRect(i){
  var L = coresLayout(), col = i%3, row = Math.floor(i/3);
  return {x:66 + col*392, y:L.y0 + row*L.step, w:364, h:L.h};
}
function launchRect(){ return coresLayout().launch; }

/* Both meta screens end on the same pair - start a run, or step sideways to
   the other one - so they share the drawing rather than drifting apart. */
function drawMetaButtons(L, altLabel){
  var LB = L.launch, hovL = IN.has && inRect(IN.x,IN.y,LB);
  var pulse = 0.6+0.4*Math.sin(G.uiT*4);
  ctx.fillStyle = hexA(C.player, hovL?0.24:0.13);
  roundRect(LB.x,LB.y,LB.w,LB.h,14); ctx.fill();
  ctx.strokeStyle = hexA(C.player, hovL?1:pulse); ctx.lineWidth=2;
  roundRect(LB.x,LB.y,LB.w,LB.h,14); ctx.stroke();
  text('LAUNCH', LB.x+LB.w/2, LB.y+LB.h/2, 19, C.text, 'center', 900, 1, 4);

  var AB = L.alt, hovA = IN.has && inRect(IN.x,IN.y,AB);
  ctx.fillStyle = hovA ? hexA(C.scrap,0.16) : 'rgba(255,255,255,0.05)';
  roundRect(AB.x,AB.y,AB.w,AB.h,14); ctx.fill();
  ctx.strokeStyle = hovA ? C.scrap : 'rgba(234,242,255,0.26)'; ctx.lineWidth=2;
  roundRect(AB.x,AB.y,AB.w,AB.h,14); ctx.stroke();
  text(altLabel, AB.x+AB.w/2, AB.y+AB.h/2, 14, hovA?C.scrap:C.text, 'center', 800, 1, 2.5);
}

function coreGlyph(c, cx, cy, r, alpha){
  ctx.globalCompositeOperation='lighter';
  blob(cx, cy, r*2.6, hexA(c.col, 0.30*alpha));
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c.col;
  poly(cx, cy, r, c.sides, G.uiT*0.5); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx, cy, r*0.30, 0, TAU); ctx.fill();
  ctx.strokeStyle = hexA(c.col, 0.45);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r*1.55, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}

function openCores(){
  G.mode = 'cores';
  G.coreT = 0;
  A.sUi();
}

function drawCores(){
  if(portraitUI()) return;      // drawn in CSS space after the HUD pass instead
  G.coreT = (G.coreT||0) + 0.016;
  var a = clamp(G.coreT*5,0,1);
  var L = coresLayout();
  ctx.fillStyle='rgba(3,5,14,0.94)';
  ctx.fillRect(0,0,VW,VH);
  ctx.globalAlpha = a;

  text('CORES', 66, L.title, 34, C.text, 'left', 900, 1, 7);
  text('Every run banks Flux. Spend it on a different way to open the next one.',
       66, L.sub, 13, C.dim, 'left', 600, 0.75, 0.5);

  var flux = getFlux();
  text(String(flux), VW-66, L.title-4, 34, C.scrap, 'right', 900, 1, 1);
  text('FLUX BANKED', VW-66, L.title+26, 10, C.dim, 'right', 700, 0.75, 4);

  // Progression is only worth chasing if the player believes it will still be
  // there tomorrow, so say plainly where it is being kept.
  var synced = !!(window.CG && window.CG.cloud);
  var msg = synced ? 'SYNCED TO YOUR CRAZYGAMES ACCOUNT' : 'SAVED ON THIS DEVICE';
  var col = synced ? '#6effc0' : C.dim;
  ctx.globalAlpha = a*0.8;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(70, L.sync, 3.5, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  text(msg, 82, L.sync, 10, col, 'left', 700, a*0.65, 2.5);

  var sel = selectedCore();
  for(var i=0;i<CORES.length;i++){
    var c = CORES[i], r = coreCardRect(i);
    var own = owns(c.id), eq = (c.id===sel), afford = flux >= c.cost;
    var hov = IN.has && inRect(IN.x,IN.y,r);
    var live = own || afford;          // dim only what you cannot act on yet
    var ca = a * (live ? 1 : 0.5);

    ctx.fillStyle = eq ? hexA(c.col,0.11) : (hov && live ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.032)');
    roundRect(r.x,r.y,r.w,r.h,18); ctx.fill();
    ctx.strokeStyle = eq ? c.col : (hov && live ? hexA(c.col,0.75) : 'rgba(234,242,255,0.14)');
    ctx.lineWidth = eq ? 2.5 : 1.5;
    roundRect(r.x,r.y,r.w,r.h,18); ctx.stroke();

    coreGlyph(c, r.x+64, r.y+L.glyphY, L.glyphR, ca);

    var tx = r.x+118;
    text(c.name, tx, r.y+L.nameY, 20, own?C.text:'rgba(234,242,255,0.8)', 'left', 900, ca, 1.5);
    wrapText(c.tag, tx, r.y+L.tagY, L.tagSize, C.dim, r.w-118-PAD, L.tagLh, 'left', ca*0.8);

    hr(r.x+PAD, r.x+r.w-PAD, r.y+L.divY, ca*0.09);

    for(var k=0;k<c.stats.length;k++){
      var sy = r.y+L.statY+k*L.statLh;
      ctx.globalAlpha = ca*0.9;
      ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.arc(r.x+PAD+2, sy, 2.5, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      text(c.stats[k], r.x+PAD+14, sy, L.statSize, C.dim, 'left', 600, ca*0.85, 0.3);
    }

    // Share a baseline with the last stat line so the row reads as one.
    var bxr = r.x+r.w-PAD, byr = r.y+L.statY+(c.stats.length-1)*L.statLh;
    if(eq)        text('EQUIPPED', bxr, byr, 13, c.col, 'right', 900, a, 3);
    else if(own)  text('SELECT',   bxr, byr, 13, hov?C.text:C.dim, 'right', 800, a, 3);
    else          text(c.cost+' FLUX', bxr, byr, 13, afford?C.scrap:'rgba(234,242,255,0.32)', 'right', 800, a, 2.5);
  }

  drawMetaButtons(L, 'SHOP');
  drawBtn(BTN_MUTE, (A.muted||A.forced)?'muted':'sound');
  ctx.globalAlpha = 1;
}

/* --------------------------------- shop --------------------------------- */
/* Same vertical rhythm as the cores screen, so moving between the two does not
   feel like moving between two different games. Three shorter rows of four
   rather than two tall rows of three: a cosmetic sells itself on its preview
   and needs a fraction of the words a core does. */
function shopLayout(){
  return BANNER.reserved
    ? { title:46, sub:78,
        y0:112, h:120, step:132,
        glyphY:40, nameY:32, tagY:56, tagSize:11, tagLh:14, priceY:100,
        launch:{x:VW/2-213, y:524, w:260, h:46},
        alt:{x:VW/2+63, y:524, w:150, h:46} }
    : { title:62, sub:98,
        y0:140, h:148, step:164,
        glyphY:48, nameY:36, tagY:64, tagSize:12, tagLh:16, priceY:124,
        launch:{x:VW/2-213, y:650, w:260, h:52},
        alt:{x:VW/2+63, y:650, w:150, h:52} };
}
function shopCardRect(i){
  var L = shopLayout(), col = i%4, row = Math.floor(i/4);
  return {x:66 + col*292, y:L.y0 + row*L.step, w:272, h:L.h};
}

/* Every card previews the thing it is selling: a wake as a real wake, an
   arena as its own grid and glow, the amplifier as Flux going up. */
function shopGlyph(it, cx, cy, alpha){
  ctx.globalAlpha = alpha;
  var i, f, gx, gy;

  if(it.kind === 'trail'){
    if(it.id === 'trail.std'){
      ctx.strokeStyle = hexA(C.player, 0.30); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.stroke();
      ctx.fillStyle = C.player;
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, TAU); ctx.fill();
    } else {
      ctx.globalCompositeOperation = 'lighter';
      for(i=0;i<9;i++){
        f = 1 - i/9;
        gx = cx + 11 - i*3; gy = cy + Math.sin(i*0.7 + G.uiT*3)*4;
        if(it.id === 'trail.ion'){
          ctx.fillStyle = hexA(C.player, 0.55*f*f);
          ctx.beginPath(); ctx.arc(gx, gy, 4.2*f + 0.6, 0, TAU); ctx.fill();
        } else if(it.id === 'trail.spark'){
          var s = 2.6*f + 0.4;
          ctx.fillStyle = hexA(C.player, 0.75*f*f);
          ctx.save(); ctx.translate(gx, gy); ctx.rotate(i*0.9 + G.uiT);
          ctx.fillRect(-s,-s,s*2,s*2);
          ctx.restore();
        } else {
          ctx.strokeStyle = hexA(C.player, 0.55*f); ctx.lineWidth = 1.2;
          poly(gx, gy, 4.5*f + 1.2, 3, G.uiT*0.6); ctx.stroke();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

  } else if(it.kind === 'arena'){
    var w = 17, h = 13;
    ctx.fillStyle = it.sky;
    roundRect(cx-w, cy-h, w*2, h*2, 4); ctx.fill();
    ctx.save();
    roundRect(cx-w, cy-h, w*2, h*2, 4); ctx.clip();
    ctx.strokeStyle = 'rgba('+it.grid+',0.55)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(i=0;i<4;i++){ ctx.moveTo(cx-w+4+i*9, cy-h); ctx.lineTo(cx-w+4+i*9, cy+h); }
    for(i=0;i<3;i++){ ctx.moveTo(cx-w, cy-h+4+i*9); ctx.lineTo(cx+w, cy-h+4+i*9); }
    ctx.stroke();
    var gg = ctx.createLinearGradient(0, cy-h, 0, cy+h);
    gg.addColorStop(0,   'rgba('+it.top+',0.55)');
    gg.addColorStop(0.5, 'rgba('+it.top+',0)');
    gg.addColorStop(1,   'rgba('+it.bot+',0.55)');
    ctx.fillStyle = gg; ctx.fillRect(cx-w, cy-h, w*2, h*2);
    ctx.restore();
    ctx.strokeStyle = 'rgba('+it.edge+',0.75)'; ctx.lineWidth = 1.5;
    roundRect(cx-w, cy-h, w*2, h*2, 4); ctx.stroke();

  } else {
    ctx.globalCompositeOperation = 'lighter';
    blob(cx, cy-3, 26, hexA(C.scrap, 0.30*alpha));
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = C.scrap;
    ctx.save(); ctx.translate(cx, cy-3); ctx.rotate(G.uiT*0.6);
    ctx.fillRect(-5,-5,10,10);
    ctx.restore();
    ctx.strokeStyle = hexA(C.scrap, 0.70); ctx.lineWidth = 2;
    for(i=0;i<3;i++){
      var bh = 3 + i*3.5;
      ctx.beginPath();
      ctx.moveTo(cx-13+i*13, cy+16);
      ctx.lineTo(cx-13+i*13, cy+16-bh);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function openShop(){
  G.mode = 'shop';
  G.shopT = 0;
  A.sUi();
}

/* Purchases funnel through PURCHASE rather than buyItem, so the day a cash
   rail exists this call site does not have to learn about it. */
function tryBuy(it){
  PURCHASE.buy(it, function(ok, why){
    if(ok){
      equipItem(it.id);          // a no-op for boosts, which are never equipped
      A.sLevel();
      G.boughtT = G.uiT;
      return;
    }
    A.tone(150,0.20,'square',0.09,100);
    G.menuMsg = (why === 'funds')  ? 'NOT ENOUGH FLUX'
              : (why === 'locked') ? 'AMPLIFIER I FIRST'
              : 'UNAVAILABLE';
    G.menuMsgT = 1.8;
  });
}

function drawShop(){
  if(portraitUI()) return;      // drawn in CSS space after the HUD pass instead
  G.shopT = (G.shopT||0) + 0.016;
  var a = clamp(G.shopT*5,0,1);
  var L = shopLayout();
  ctx.fillStyle='rgba(3,5,14,0.94)';

       66, L.sub, 13, C.dim, 'left', 600, 0.75, 0.5);
